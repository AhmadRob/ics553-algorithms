<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algorithms | ICS 553</title>
<meta name="description" content="KFUPM ICS 553 notes by Ahmed Abualrob: searching and sorting algorithms with step-by-step visualizers, pseudocode and complexity.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FAFAFA;--ink:#0A0A0A;--muted:#666;--line:rgba(10,10,10,.1);
  --glass:rgba(255,255,255,.4);--glass-strong:rgba(255,255,255,.6);
  --gb:rgba(0,0,0,.05);--gb-strong:rgba(0,0,0,.08);
  --blob:rgba(255,255,255,.8);--hover:rgba(0,0,0,.05);
  --bar:rgba(10,10,10,.1);--bar-line:rgba(10,10,10,.28);--bar-mid:rgba(10,10,10,.38);
  --inv:#FAFAFA;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A;--ink:#FAFAFA;--muted:#9A9A9A;--line:rgba(250,250,250,.12);
    --glass:rgba(255,255,255,.04);--glass-strong:rgba(255,255,255,.07);
    --gb:rgba(255,255,255,.08);--gb-strong:rgba(255,255,255,.14);
    --blob:rgba(255,255,255,.07);--hover:rgba(255,255,255,.08);
    --bar:rgba(250,250,250,.12);--bar-line:rgba(250,250,250,.3);--bar-mid:rgba(250,250,250,.4);
    --inv:#0A0A0A;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A;--ink:#FAFAFA;--muted:#9A9A9A;--line:rgba(250,250,250,.12);
  --glass:rgba(255,255,255,.04);--glass-strong:rgba(255,255,255,.07);
  --gb:rgba(255,255,255,.08);--gb-strong:rgba(255,255,255,.14);
  --blob:rgba(255,255,255,.07);--hover:rgba(255,255,255,.08);
  --bar:rgba(250,250,250,.12);--bar-line:rgba(250,250,250,.3);--bar-mid:rgba(250,250,250,.4);
  --inv:#0A0A0A;color-scheme:dark;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:88px}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;background:var(--bg);color:var(--ink)}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.container{position:relative;background:var(--bg);min-height:100vh}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}

.glass-layer{background:var(--glass);border:1px solid var(--gb)}
.glass-layer-strong{background:var(--glass-strong);border:1px solid var(--gb-strong)}
.panel{background:var(--glass);border:1px solid var(--gb)}

.text-fluid-xl{font-size:clamp(3rem,8vw,9rem);line-height:.9;font-weight:900;letter-spacing:-.04em;color:var(--ink);transform-origin:left top}
.text-fluid-md{font-size:clamp(1.5rem,3vw,2.5rem);line-height:1.2;font-weight:700;letter-spacing:-.02em;color:var(--ink)}

.scroll-indicator{position:fixed;left:40px;top:0;width:2px;height:100vh;background:var(--gb);z-index:1000;display:none}
.scroll-progress{position:absolute;top:0;left:0;width:100%;height:100%;background:var(--ink);transform:scaleY(0);transform-origin:top;will-change:transform}
.liquid-blob{position:fixed;left:0;top:0;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,var(--blob) 0%,rgba(255,255,255,0) 70%);pointer-events:none;z-index:0;transform:translate3d(-999px,-999px,0);will-change:transform}

.hero-section{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.hero-content{max-width:1280px;width:100%}
.subtitle-glass{display:inline-block;padding:16px 32px;margin:32px 0;font-size:1.125rem;font-weight:500;color:var(--ink);border-radius:4px}
.contact-links{display:flex;flex-wrap:wrap;gap:24px;font-size:.875rem;color:var(--muted)}
.contact-links a{color:var(--muted);text-decoration:none;transition:color .3s}
.contact-links a:hover{color:var(--ink)}

.index{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:12px;z-index:60;width:min(1120px,calc(100% - 24px));margin:0 auto;padding:6px;border-radius:999px;display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
.index::-webkit-scrollbar{display:none}
.index a,.index button{flex:0 0 auto;font:500 12px 'JetBrains Mono',monospace;color:var(--muted);text-decoration:none;padding:8px 14px;border-radius:999px;border:0;background:none;cursor:pointer;transition:all .3s}
.index a:hover,.index button:hover{color:var(--ink);background:var(--hover)}
.index a.on{background:var(--ink);color:var(--inv)}
.index #theme{padding:8px 10px;display:grid;place-items:center;margin-left:auto}
.index .sep{flex:0 0 1px;height:16px;background:var(--line);margin:0 4px}

main{position:relative;z-index:1}
.section{position:relative;padding:96px 24px 32px;max-width:1280px;margin:0 auto}
.sec-head{margin-bottom:48px;max-width:640px}
.sec-head p{color:var(--muted);line-height:1.6;margin-top:12px}

.project-type{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);margin-bottom:8px}
.card-header{display:flex;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px}
.card-title{font-size:1.875rem;font-weight:700;color:var(--ink);margin-bottom:8px;letter-spacing:-.02em}
.card-subtitle{font-size:1.125rem;color:var(--muted)}

.def{padding:48px;margin-bottom:32px}
.def p{font-size:clamp(1.15rem,2vw,1.6rem);line-height:1.5;font-weight:500;letter-spacing:-.01em;max-width:880px}
.props{display:grid;grid-template-columns:1fr;gap:24px;margin-bottom:32px}
.prop{padding:32px}
.prop h3{font-size:1.25rem;font-weight:700;margin-bottom:12px}
.prop p{color:var(--muted);line-height:1.6;font-size:.95rem}
.notation{padding:32px;display:grid;grid-template-columns:1fr;gap:24px}
.notation .sym{font-size:2.5rem;font-weight:900;letter-spacing:-.03em;line-height:1}
.notation h3{font-size:1rem;font-weight:700;margin:12px 0 6px}
.notation p{color:var(--muted);font-size:.9rem;line-height:1.55}

.algo{padding:48px;margin-bottom:48px;border-radius:2px}
.io{font-size:.8rem;color:var(--muted);line-height:1.7;max-width:420px}
.io b{color:var(--ink);font-weight:500;margin-right:8px}

.viz{margin-bottom:40px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.presets,.inputs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:500 13px 'JetBrains Mono',monospace;padding:8px 16px;border-radius:999px;border:1px solid var(--gb-strong);background:var(--glass-strong);color:var(--ink);cursor:pointer;transition:all .3s}
.btn:hover{background:var(--ink);color:var(--inv)}
.btn.solid{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.btn.solid:hover{opacity:.8}
.btn[disabled]{opacity:.35;pointer-events:none}
.lab{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);display:flex;align-items:center;gap:8px}
.in{font:400 13px 'JetBrains Mono',monospace;padding:8px 12px;border-radius:12px;border:1px solid var(--gb-strong);background:var(--glass-strong);color:var(--ink);min-width:0}
.in.arr{width:min(320px,62vw)}
.in.x{width:72px}
.hint{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);min-height:1.2em;margin-bottom:8px}
.viz-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.stage{padding:24px;border-radius:4px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:32px;margin-bottom:16px}
.chip{font:500 12px 'JetBrains Mono',monospace;padding:5px 12px;border-radius:999px;border:1px solid var(--gb-strong);background:var(--glass)}
.chip i{font-style:normal;color:var(--muted);margin-right:8px}
.chip.stat{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.chip.stat i{color:inherit;opacity:.65}
.board{overflow-x:auto;padding-bottom:6px;min-height:250px}
.cells{display:flex;gap:6px;align-items:flex-end;width:max-content;max-width:none;margin:0 auto;padding:0 4px}
.cell{flex:0 0 42px;display:flex;flex-direction:column;align-items:stretch;text-align:center;transition:opacity .25s}
.cell .val{font:500 12px 'JetBrains Mono',monospace;height:22px;line-height:22px}
.cell .bar{transition:height .25s,background .25s}
.cell .idx{font:400 11px 'JetBrains Mono',monospace;color:var(--muted);margin-top:6px}
.cell .ptr{font:500 10px 'JetBrains Mono',monospace;line-height:1.25;min-height:54px;padding-top:2px;white-space:nowrap}

.bar,.sw{background:var(--bar);border:1px solid var(--bar-line);border-radius:6px 6px 2px 2px}
.cell.cmp .bar,.sw.cmp{background:var(--ink);border-color:var(--ink)}
.cell.swap .bar,.sw.swap{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px);border-color:var(--ink)}
.cell.found .bar,.sw.found{background:var(--ink);border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.cell.min .bar,.sw.min,.cell.pivot .bar,.sw.pivot,.cell.key .bar,.sw.key{background:var(--bar-mid);border:2px solid var(--ink)}
.cell.sorted .bar,.sw.sorted{background:transparent;border:2px solid var(--ink)}
.cell.le .bar,.sw.le,.cell.runL .bar,.sw.runL{background:var(--bar-mid);border-color:var(--bar-line)}
.cell.runR .bar,.sw.runR{background:repeating-linear-gradient(135deg,var(--bar-mid) 0 3px,transparent 3px 6px);border-color:var(--bar-line)}
.cell.dim{opacity:.22}
.sw.dim{opacity:.25}
.cell.hole .bar,.sw.hole{background:transparent;border:1.5px dashed var(--bar-line)}
.cell.edge{opacity:.5}
.cell.edge .bar{background:transparent;border:1.5px dotted var(--bar-line)}
.cell.edge .idx{font-style:italic}
.cell.cmp .val,.cell.found .val,.cell.swap .val,.cell.min .val,.cell.pivot .val,.cell.key .val{font-weight:700}

.aux{margin-top:18px}
.aux-lab{font:500 11px 'JetBrains Mono',monospace;color:var(--muted);margin:14px 4px 6px;text-align:center}
.abox .box{height:36px;display:grid;place-items:center;font:500 12px 'JetBrains Mono',monospace;border:1.5px dashed var(--bar-line);border-radius:6px}
.abox.swap .box{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px);border:1.5px solid var(--ink);font-weight:700;background-color:var(--bg)}
.abox.sorted .box{border:2px solid var(--ink)}
.abox .ptr{min-height:22px}

.note{font-size:.95rem;line-height:1.55;min-height:4.4em;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.extra:empty{display:none}
.extra{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.tree-cap{font-size:11px;color:var(--muted);margin-bottom:8px}
.tree-wrap{overflow-x:auto}
.tn circle{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.tn text{fill:var(--ink);font:500 10px 'JetBrains Mono',monospace}
.tn.vis circle{fill:var(--ink)}
.tn.vis text{fill:var(--inv)}
.tn.cur circle{stroke-width:3.5}
.te{stroke:var(--bar-line);stroke-width:1.2}
.te.on{stroke:var(--ink);stroke-width:2.2}

.code{padding:20px;border-radius:4px;font:400 12.5px/1.6 'JetBrains Mono',monospace;align-self:start}
.code-title{font-size:.75rem;color:var(--muted);margin-bottom:12px}
.ln{display:flex;gap:10px;padding:2px 8px;border-radius:6px;color:var(--muted);transition:background .2s,color .2s}
.ln .no{opacity:.55;min-width:18px;text-align:right}
.ln .tx{white-space:pre-wrap}
.ln.on{background:var(--ink);color:var(--inv)}
.ln.proc .tx{font-weight:500}

.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.ctl input[type=range]{flex:1 1 180px;accent-color:var(--ink);min-width:120px}
.ctl select{font:500 12px 'JetBrains Mono',monospace;padding:8px 30px 8px 14px;border-radius:999px;border:1px solid var(--gb-strong);color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none;
  background-color:var(--glass-strong);
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;transition:all .3s}
.ctl select:hover{background-color:var(--hover)}
select option{background:var(--bg);color:var(--ink)}
.count{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);min-width:64px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px;font:400 12px 'JetBrains Mono',monospace;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:8px}
.sw{width:16px;height:16px;border-radius:4px;display:inline-block}

.rx{display:flex;flex-direction:column;gap:14px}
.rx-row{display:flex;gap:12px;align-items:center}
.rx-lab{font:500 12px 'JetBrains Mono',monospace;color:var(--muted);min-width:14px}
.rx-list{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;align-items:center}
.rx-empty{font:400 12px 'JetBrains Mono',monospace;color:var(--muted)}
.rx-cur{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);display:flex;gap:10px;align-items:center;min-height:34px}
.nchip{font:500 13px 'JetBrains Mono',monospace;padding:5px 9px;border-radius:8px;border:1px solid var(--bar-line);background:var(--bar);display:inline-block}
.nchip.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.nchip .lz{opacity:.35}
.nchip .dg.hi{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px;font-weight:700}
.rx-buckets{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.rx-b{border:1px solid var(--bar-line);border-radius:8px;padding:8px;min-height:74px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.rx-b.on{border:2px solid var(--ink)}
.rx-h{font:500 11px 'JetBrains Mono',monospace;color:var(--muted)}
.rx-b .nchip{font-size:12px;padding:4px 7px}

.algo-text{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;border-top:1px solid var(--line);padding-top:32px}
.algo-text h4{font-size:.75rem;font-family:'JetBrains Mono',monospace;color:var(--muted);font-weight:500;margin-bottom:12px}
.algo-text p{line-height:1.65;color:var(--ink);margin-bottom:16px;max-width:64ch}
.key{padding:20px 24px;border-radius:4px;margin-bottom:16px}
.key p{margin:0;font-weight:500}
.nt{margin-bottom:20px;padding:16px 20px 16px 22px;border-left:3px solid var(--muted);border-radius:0 8px 8px 0;background:color-mix(in srgb,var(--ink) 4%,transparent);backdrop-filter:blur(6px);max-width:68ch}
.nt b{display:block;margin-bottom:6px;font-weight:700;font-size:.85rem;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.nt span{color:var(--ink);opacity:.78;line-height:1.65;display:block;font-size:.92rem}
.tbl-wrap{overflow-x:auto;margin-bottom:24px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font:500 12px 'JetBrains Mono',monospace;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
td.th{font:500 13px 'JetBrains Mono',monospace;min-width:96px}
td.mn{color:var(--muted)}
.tbl-title{font-weight:700;margin-bottom:8px}
.todo{padding:32px;border-radius:4px;border-style:dashed;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.9rem}
.algo.later{opacity:.6}

.cheat{padding:32px;border-radius:2px;margin-bottom:32px}
.grow{padding:32px;border-radius:2px}
.grow input[type=range]{width:100%;accent-color:var(--ink);margin:16px 0 24px}
.g-row{display:grid;grid-template-columns:90px 1fr 120px;gap:16px;align-items:center;margin-bottom:12px;font:500 13px 'JetBrains Mono',monospace}
.g-bar{height:12px;border-radius:6px;background:var(--bar);overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .2s}
.g-val{text-align:right}
.g-cap{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);margin-top:16px}

.footer{position:relative;z-index:1;padding:80px 24px;border-top:1px solid var(--line);text-align:center;margin-top:64px}
.footer-text{color:var(--muted);font:400 .875rem 'JetBrains Mono',monospace;margin-bottom:16px}

@media (min-width:768px){
  .scroll-indicator{display:block}
  .section{padding:96px 80px 32px}
  .index{width:min(1120px,calc(100% - 160px))}
  .hero-section{padding:80px}
  .subtitle-glass{font-size:1.25rem}
  .contact-links{font-size:1rem}
  .props{grid-template-columns:repeat(2,1fr)}
  .notation{grid-template-columns:repeat(3,1fr)}
  .rx-buckets{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (min-width:1000px){
  .viz-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .algo-text{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .props{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:767px){
  .algo,.def{padding:24px}
  .cheat,.grow{padding:20px}
  .g-row{grid-template-columns:64px 1fr 84px}
}
/* ---------- animations ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes subtlePulse{0%,100%{box-shadow:0 0 0 0 rgba(10,10,10,.12)}50%{box-shadow:0 0 0 8px rgba(10,10,10,0)}}

.hero-section h1{animation:fadeUp .9s cubic-bezier(.22,1,.36,1) both}
.subtitle-glass{animation:fadeUp .9s cubic-bezier(.22,1,.36,1) .15s both}
.contact-links{animation:fadeUp .9s cubic-bezier(.22,1,.36,1) .3s both}
.index{animation:slideDown .5s cubic-bezier(.22,1,.36,1) .5s both}

.reveal{opacity:0;transform:translateY(28px);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
.reveal.visible{opacity:1;transform:translateY(0)}

.algo,.def,.prop,.cheat,.grow{transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s}
.algo:hover,.def:hover,.cheat:hover,.grow:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.08)}

.cross-link{animation:subtlePulse 3s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .reveal{opacity:1;transform:none}
  .liquid-blob{display:none}
}

/* ---------- polish layer (shared by both pages) ---------- */
:root{
  --r-lg:20px;--r-md:14px;--r-sm:10px;
  --shadow:0 1px 2px rgba(10,10,10,.04),0 8px 28px -12px rgba(10,10,10,.10);
  --shadow-up:0 2px 4px rgba(10,10,10,.05),0 18px 40px -16px rgba(10,10,10,.16);
  --tint:rgba(10,10,10,.035);--tint-2:rgba(10,10,10,.06);
  --nav-bg:rgba(250,250,250,.92);--nav-solid:#FAFAFA;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -14px rgba(0,0,0,.7);
    --shadow-up:0 1px 0 rgba(255,255,255,.06) inset,0 20px 44px -18px rgba(0,0,0,.85);
    --tint:rgba(255,255,255,.04);--tint-2:rgba(255,255,255,.07);
    --nav-bg:rgba(14,14,14,.92);--nav-solid:#0E0E0E;
  }
}
:root[data-theme="dark"]{
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-up:0 1px 0 rgba(255,255,255,.06) inset,0 20px 44px -18px rgba(0,0,0,.85);
  --tint:rgba(255,255,255,.04);--tint-2:rgba(255,255,255,.07);
  --nav-bg:rgba(14,14,14,.92);--nav-solid:#0E0E0E;
}

html{scroll-padding-top:96px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-feature-settings:'cv11','ss01';text-rendering:optimizeLegibility}
::selection{background:var(--ink);color:var(--inv)}
.mono,.io,.btn,.chip,.code,.count,td.th,.g-row{font-variant-numeric:tabular-nums}

/* hero */
.hero-section h1{letter-spacing:-.05em}
.subtitle-glass{border-radius:999px;padding:12px 24px;font-size:1.05rem;box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.contact-links{gap:10px}
.contact-links a{color:var(--ink);padding:9px 16px;border-radius:999px;border:1px solid var(--gb-strong);background:var(--glass-strong);font-size:.82rem;transition:background .25s,color .25s,border-color .25s}
.contact-links a:hover{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.contact-links a:first-child{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.contact-links a:first-child:hover{opacity:.85}

/* nav: solid glass, soft shadow, fades at the edges so it reads as scrollable */
.index{background:var(--nav-bg);border-color:var(--gb-strong);box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);padding:6px 0;scroll-behavior:smooth}
.index::before,.index::after{content:"";position:sticky;flex:0 0 22px;align-self:stretch;margin:-6px 0;z-index:2;pointer-events:none}
.index::before{left:0;background:linear-gradient(90deg,var(--nav-solid) 30%,transparent)}
.index::after{right:0;background:linear-gradient(270deg,var(--nav-solid) 30%,transparent)}
.index a,.index button{font-size:11.5px;padding:7px 13px;letter-spacing:.01em}
.index a.on{box-shadow:0 4px 12px -4px rgba(0,0,0,.35)}
.index .sep{margin:0 6px}

/* sections */
main{counter-reset:sec}
.section{padding-top:112px}
.sec-head{counter-increment:sec;margin-bottom:40px;max-width:720px;padding-top:4px}
.sec-head::before{content:counter(sec,decimal-leading-zero);display:inline-block;font:500 11px 'JetBrains Mono',monospace;color:var(--muted);letter-spacing:.08em;padding:4px 10px;border:1px solid var(--gb-strong);border-radius:999px;margin-bottom:16px}
.sec-head h2{letter-spacing:-.035em}
.sec-head p{font-size:1.05rem;line-height:1.6;max-width:62ch}

/* cards */
.algo,.def,.prop,.notation,.cheat,.grow{border-radius:var(--r-lg);box-shadow:var(--shadow)}
.algo{margin-bottom:40px}
.def{padding:44px 48px}
.def p{letter-spacing:-.015em;text-wrap:pretty}
.prop{padding:28px}
.prop h3{font-size:1.05rem;letter-spacing:-.01em}
.prop p{font-size:.92rem}
.notation .sym{font-size:2.25rem}
.stage,.code,.key,.todo,.widget{border-radius:var(--r-md)}
.stage{box-shadow:inset 0 0 0 1px var(--gb)}
.code{background:var(--tint);border-color:transparent}
.ln{border-radius:7px}

/* no lift on big interactive cards; keep a light lift on small ones */
.algo:hover,.cheat:hover,.grow:hover,.def:hover{transform:none;box-shadow:var(--shadow)}
.prop:hover{transform:translateY(-2px);box-shadow:var(--shadow-up)}

/* card header */
.card-header{margin-bottom:28px;align-items:flex-start}
.project-type{display:inline-block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--tint-2);color:var(--ink);opacity:.75;margin-bottom:14px}
.card-title{font-size:clamp(1.6rem,2.6vw,2rem);letter-spacing:-.03em;line-height:1.15}
.card-subtitle{font-size:1.05rem;line-height:1.5;max-width:60ch}
.io{padding:12px 16px;border-radius:var(--r-sm);background:var(--tint);line-height:1.75}

/* controls */
.btn,.ctl select,.in{transition:background .2s,color .2s,border-color .2s,opacity .2s}
.btn:active{transform:translateY(1px)}
.in:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--tint-2)}
.chip{background:var(--glass-strong)}
.ctl{padding:10px 12px;border-radius:999px;background:var(--tint);margin-top:18px}
.ctl input[type=range]{height:4px}
.legend{margin-top:14px;padding-left:4px}
.note{font-size:.98rem;line-height:1.6}

/* reading text */
.algo-text{gap:40px;padding-top:36px;margin-top:8px}
.algo-text h4{display:flex;align-items:center;gap:10px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;margin:4px 0 12px}
.algo-text h4::after{content:"";flex:1;height:1px;background:var(--line)}
.algo-text p{font-size:1rem;line-height:1.7;text-wrap:pretty}
.algo-text p + h4,.algo-text ol + h4,.algo-text ul + h4,.algo-text .key + h4,.algo-text .nt + h4,.algo-text .tbl-wrap + h4{margin-top:28px}

/* key idea: solid ink rule; notes: muted rule */
.key{border:0;border-left:3px solid var(--ink);border-radius:0 var(--r-md) var(--r-md) 0;background:var(--tint);padding:18px 22px}
.key p{line-height:1.6}
.nt{border-left-color:var(--bar-line);background:var(--tint);border-radius:0 var(--r-md) var(--r-md) 0;backdrop-filter:none}
.nt b{font-size:.68rem;letter-spacing:.1em;margin-bottom:8px}
.nt span{opacity:.82}

/* tables */
.tbl-wrap{border:1px solid var(--gb-strong);border-radius:var(--r-md);overflow:auto}
table{font-size:.9rem}
thead th{background:var(--tint);border-bottom:1px solid var(--gb-strong);padding:12px 14px;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase}
td{padding:12px 14px}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--tint)}
.tbl-title{font-size:.95rem;letter-spacing:-.01em;margin:4px 0 10px}
.cheat{padding:28px}
.cheat .tbl-wrap{margin-bottom:0}

/* homework intro: same family as .nt, full width */
.nt.prof-intro{max-width:none;margin:56px 0 28px;padding:22px 26px 22px 28px;border:0;border-left:3px solid var(--bar-line);border-radius:0 var(--r-md) var(--r-md) 0;background:var(--tint);opacity:1;font-size:inherit}
.nt.prof-intro span{max-width:78ch;font-size:.98rem}

/* homework placeholders */
.algo.later{opacity:1;box-shadow:none;background:transparent;border-style:dashed}
.algo.later .card-header{margin-bottom:16px}
.todo{border-radius:var(--r-sm);padding:18px 20px;font-size:.82rem}

/* page-to-page link */
.cross-link{animation:none!important;background:var(--ink)!important;color:var(--inv)!important;border-color:var(--ink)!important;box-shadow:var(--shadow-up);font-family:'Inter',system-ui,sans-serif!important;font-weight:600!important;letter-spacing:-.01em}
.cross-link:hover{opacity:.88}
.footer{padding:64px 24px 72px;margin-top:72px}
.footer-text{margin-bottom:0}

@media (max-width:767px){
  .section{padding:88px 14px 24px}
  .algo,.def{padding:22px 18px;border-radius:16px}
  .stage{padding:16px 12px}
  .code{padding:14px}
  .card-header{margin-bottom:20px}
  .ctl{border-radius:var(--r-md)}
  .sec-head{margin-bottom:28px}
  .index{width:calc(100% - 16px);top:8px;padding:5px 0}
  .algo-text{gap:24px}
  .def p{font-size:1.1rem}
}

/* ---------- mobile alignment fixes (both pages) ---------- */
main ol,main ul{padding-left:1.5em}
main li{padding-left:.15em}
main li::marker{color:var(--muted);font-variant-numeric:tabular-nums}
main p,main li,main td,.nt span,.note,.cap,.card-subtitle,.io div,.key p{overflow-wrap:break-word}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.tree-wrap svg{display:block;margin:0 auto}

@media (max-width:640px){
  /* tables become one small card per row, labelled by column */
  .tbl-wrap{border:0;border-radius:0;overflow:visible}
  .tbl-wrap table,.tbl-wrap tbody,.tbl-wrap tr,.tbl-wrap td{display:block;width:100%}
  .tbl-wrap thead{display:none}
  .tbl-wrap tr{border:1px solid var(--gb-strong);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:10px;background:var(--tint)}
  .tbl-wrap tbody tr:hover{background:var(--tint)}
  .tbl-wrap td{border:0;padding:4px 0;display:grid;grid-template-columns:minmax(78px,32%) minmax(0,1fr);gap:10px;align-items:baseline}
  .tbl-wrap td::before{content:attr(data-label);font:500 .64rem 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .tbl-wrap td:first-child{display:block;font-weight:700;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  .tbl-wrap td:first-child::before{display:none}
  .tbl-wrap td.th{min-width:0}
  /* bars: fit a 10-element array across a phone */
  .cells{gap:4px}
  .cell .val{font-size:11px}
  .cell .ptr{font-size:9px}
  .stage{padding:14px 10px}
  .inputs{width:100%}
  .inputs .in.arr{flex:1 1 160px;width:auto}
  .legend{gap:6px 14px}
}

/* bars shrink to fit the panel instead of scrolling */
.cells{width:100%;justify-content:center}
.cell{flex:1 1 0;min-width:20px;max-width:42px}

.tp-link{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font:500 13px 'JetBrains Mono',monospace;color:var(--ink);text-decoration:none;padding:9px 16px;border-radius:999px;border:1px solid var(--gb-strong);background:var(--glass-strong);transition:background .2s,color .2s}
.tp-link:hover{background:var(--ink);color:var(--inv)}

@media (min-width:641px){td.th{white-space:nowrap}}

.cx-a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--line)}
.cx-a:hover{border-bottom-color:var(--ink)}
#cx-cheat-card .io{max-width:460px}

/* ---------- diagrams: shared palette + node/edge styles ---------- */
:root{
  --d-blue:#2563EB;--d-green:#059669;--d-amber:#D97706;--d-rose:#E11D48;--d-violet:#7C3AED;--d-teal:#0891B2;
  --d-edge:#A8B1BE;--d-edge-strong:#475569;--d-node:#FFFFFF;--d-node-stroke:#334155;--d-text:#0F172A;--d-on:#FFFFFF;--d-muted:#64748B;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --d-blue:#60A5FA;--d-green:#34D399;--d-amber:#FBBF24;--d-rose:#FB7185;--d-violet:#A78BFA;--d-teal:#22D3EE;
    --d-edge:#3F4A5A;--d-edge-strong:#94A3B8;--d-node:#12161D;--d-node-stroke:#CBD5E1;--d-text:#F1F5F9;--d-on:#0A0A0A;--d-muted:#94A3B8;
  }
}
:root[data-theme="dark"]{
  --d-blue:#60A5FA;--d-green:#34D399;--d-amber:#FBBF24;--d-rose:#FB7185;--d-violet:#A78BFA;--d-teal:#22D3EE;
  --d-edge:#3F4A5A;--d-edge-strong:#94A3B8;--d-node:#12161D;--d-node-stroke:#CBD5E1;--d-text:#F1F5F9;--d-on:#0A0A0A;--d-muted:#94A3B8;
}

/* hue helpers: set --h on a node, edge or swatch */
.h-blue{--h:var(--d-blue)}.h-green{--h:var(--d-green)}.h-amber{--h:var(--d-amber)}
.h-rose{--h:var(--d-rose)}.h-violet{--h:var(--d-violet)}.h-teal{--h:var(--d-teal)}

svg.dg{overflow:visible}
.dg text{font-family:'JetBrains Mono',ui-monospace,monospace}

/* nodes */
.dg .tn circle,.dg .tn rect{fill:var(--d-node);stroke:var(--d-node-stroke);stroke-width:1.8;transition:fill .25s,stroke .25s,opacity .25s}
.dg .tn text{fill:var(--d-text);font-size:12px;font-weight:600;transition:fill .25s}
.dg .tn[class*="h-"] circle,.dg .tn[class*="h-"] rect{fill:color-mix(in srgb,var(--h) 16%,var(--d-node));stroke:var(--h);stroke-width:2.2}
.dg .tn.solid circle,.dg .tn.solid rect,
.dg .tn.vis circle,.dg .tn.vis rect{fill:var(--h,var(--vis-h,var(--d-blue)));stroke:var(--h,var(--vis-h,var(--d-blue)))}
.dg .tn.solid text,.dg .tn.vis text{fill:var(--d-on)}
.dg .tn.cur circle,.dg .tn.cur rect{fill:color-mix(in srgb,var(--cur-h,var(--d-blue)) 18%,var(--d-node));stroke:var(--cur-h,var(--d-blue));stroke-width:3.4}
.dg .tn.dim{opacity:.38}

/* edges */
.dg .te{stroke:var(--d-edge);stroke-width:2.2;stroke-linecap:round;fill:none;transition:stroke .25s,opacity .25s,stroke-width .25s}
.dg .te.on{stroke:var(--d-edge-strong)}
.dg .te[class*="h-"]{stroke:var(--h)}
.dg .te.thick{stroke-width:4}
.dg .te.hot{stroke:var(--hot-h,var(--d-blue));stroke-width:4.5}
.dg .te.dash{stroke-dasharray:6 5}
.dg .te.dim{opacity:.16}
.dg .area{stroke-width:2;fill-opacity:.10}
.dg .area[class*="h-"]{stroke:var(--h);fill:var(--h)}

/* labels */
.dg .lab-cap{fill:var(--d-muted);font-size:11px;font-weight:600;letter-spacing:.06em}
.dg .lab-h{fill:var(--h);font-size:12px;font-weight:700}
.dg .lab-big{fill:var(--d-text);font-size:14px;font-weight:700}
.dg .ew{fill:var(--d-muted);font-size:11px;font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.dg .ew.w1{fill:var(--d-edge-strong)}
.dg .ew.w2{fill:var(--d-amber)}
.dg .ew.hot{fill:var(--d-green)}
.dg .arrow-fill{fill:var(--d-edge-strong)}

/* per-visualizer meaning */
[data-viz="circuit"]{--vis-h:var(--d-green);--cur-h:var(--d-blue)}
[data-viz="circuit"] .dg .te.one{stroke:var(--d-green);stroke-width:3.4}
[data-viz="hc"]{--vis-h:var(--d-blue);--hot-h:var(--d-green)}
[data-viz="hc"] .dg .te.dash{stroke:var(--d-amber)}
[data-viz="clique"],.fig-clique{--hot-h:var(--d-violet);--cur-h:var(--d-blue)}
[data-viz="clique"] .dg .tn.vis circle,.fig-clique .dg .tn.vis circle{fill:var(--d-violet);stroke:var(--d-violet)}
[data-viz="vcis"]{--vis-h:var(--d-amber)}
[data-viz="vcis"] .dg .tn.cur circle{fill:var(--d-teal);stroke:var(--d-teal);stroke-width:1.8}
[data-viz="vcis"] .dg .tn.cur text{fill:var(--d-on)}
[data-viz="vcis"] .dg .tn.clq circle{fill:var(--d-violet);stroke:var(--d-violet)}
[data-viz="vc"],[data-viz="vc3"],.fig-vc{--vis-h:var(--d-amber);--cur-h:var(--d-green)}
.dg .te.e-var{stroke:var(--d-blue);stroke-width:3}
.dg .te.e-cl{stroke:var(--d-violet);stroke-width:3}
.dg .te.e-con{stroke:var(--d-edge-strong);stroke-dasharray:5 5}

/* legend swatches */
.sw.k-green{background:var(--d-green);border-color:var(--d-green)}
.sw.k-blue{background:var(--d-blue);border-color:var(--d-blue)}
.sw.k-amber{background:var(--d-amber);border-color:var(--d-amber)}
.sw.k-violet{background:var(--d-violet);border-color:var(--d-violet)}
.sw.k-teal{background:var(--d-teal);border-color:var(--d-teal)}
.sw.k-rose{background:var(--d-rose);border-color:var(--d-rose)}
.sw.k-ring-blue{background:color-mix(in srgb,var(--d-blue) 18%,transparent);border:2.5px solid var(--d-blue)}
.sw.k-ring-green{background:color-mix(in srgb,var(--d-green) 18%,transparent);border:2.5px solid var(--d-green)}
.sw.k-line{background:var(--d-edge-strong);border-color:var(--d-edge-strong);height:4px;border-radius:2px}
.sw.k-dash-amber{background:transparent;border:0;border-top:3px dashed var(--d-amber);height:0;border-radius:0}
.sw.k-line-green{background:var(--d-green);border-color:var(--d-green);height:5px;border-radius:3px}
.sw.k-line-blue{background:var(--d-blue);border-color:var(--d-blue);height:4px;border-radius:2px}
.sw.k-line-violet{background:var(--d-violet);border-color:var(--d-violet);height:4px;border-radius:2px}
.sw.k-dash{background:transparent;border:0;border-top:3px dashed var(--d-edge-strong);height:0;border-radius:0}

/* yes / no result chips */
.chip.stat.yes{background:var(--d-green);border-color:var(--d-green);color:var(--d-on)}
.chip.stat.no{background:var(--d-rose);border-color:var(--d-rose);color:var(--d-on)}
.chip.stat.yes i,.chip.stat.no i{color:inherit;opacity:.75}

/* 3SAT clause chips */
.chip .lit-new{color:var(--d-amber);font-weight:700}
.fm .chip.on{background:color-mix(in srgb,var(--d-blue) 14%,transparent);border-color:var(--d-blue);color:var(--d-text)}
.fm .chip.on .lit-new{color:var(--d-amber)}

/* reduction map */
.mapn rect{fill:color-mix(in srgb,var(--h,var(--d-edge)) 14%,var(--d-node));stroke:var(--h,var(--d-node-stroke));stroke-width:1.8}
.mapn text{fill:var(--d-text);font-size:12px;font-weight:600}
.mapn:hover rect{fill:color-mix(in srgb,var(--h) 26%,var(--d-node))}
.mapn.sel rect{fill:var(--h);stroke:var(--h)}
.mapn.sel text{fill:var(--d-on)}
.mapn.to rect{stroke:var(--d-blue);stroke-width:3.2;fill:color-mix(in srgb,var(--d-blue) 14%,var(--d-node))}
.mapn.from rect{stroke:var(--d-amber);stroke-width:3.2;fill:color-mix(in srgb,var(--d-amber) 14%,var(--d-node))}
.mapn.dim{opacity:.28}
.map-legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font:400 12px 'JetBrains Mono',monospace;color:var(--muted)}

/* figure captions inside cards */
.fig{margin:4px 0 20px}
.fig .cap{text-align:center;max-width:none}
.algo-text .fig svg{max-width:100%}
.dg .tn.cur.fresh circle{stroke:var(--d-blue);fill:color-mix(in srgb,var(--d-blue) 18%,var(--d-node))}
.sw.k-ring-rose{background:color-mix(in srgb,var(--d-rose) 18%,transparent);border:2.5px solid var(--d-rose)}
@media (max-width:767px){
  [data-w="redmap"] .widget > svg{min-width:640px}
  [data-w="redmap"] .widget{overflow-x:auto;-webkit-overflow-scrolling:touch}
  [data-w="redmap"] .cap::before{content:"Swipe the map sideways. ";font-weight:600}
}

/* homework visualizers */
.dg .te.arc{stroke:var(--d-blue);stroke-width:2;opacity:.85}
.dg .te.arc.dim{opacity:.18}
.dg .te.arc-hot{stroke:var(--d-green);stroke-width:3.6}
.dg .arrow-blue{fill:var(--d-blue)}
.dg .arrow-hot{fill:var(--d-green)}
.dg .tn.ghost text{font-size:10px}
.sw.k-ring-violet{background:color-mix(in srgb,var(--d-violet) 18%,transparent);border:2.5px solid var(--d-violet)}
.dg .tn.vis.cur text,.dg .tn.cur text{fill:var(--d-text)}
[data-viz="vcis"] .dg .tn.cur text{fill:var(--d-on)}

[data-viz="cliqueis"]{--vis-h:var(--d-violet);--hot-h:var(--d-violet)}
[data-viz="cliqueis"] .dg .tn.cur circle{fill:var(--d-teal);stroke:var(--d-teal);stroke-width:1.8}
[data-viz="cliqueis"] .dg .tn.cur text{fill:var(--d-on)}
.sw.k-line-amber{background:var(--d-amber);border-color:var(--d-amber);height:4px;border-radius:2px}

/* ---------- algorithm visualizers: same palette as the reduction diagrams ---------- */
.cell.cmp .bar,.sw.cmp{background:var(--d-blue);border-color:var(--d-blue)}
.cell.swap .bar,.sw.swap{background:repeating-linear-gradient(135deg,var(--d-amber) 0 3px,transparent 3px 6px);border-color:var(--d-amber)}
.cell.found .bar,.sw.found{background:var(--d-green);border-color:var(--d-green);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--d-green)}
.cell.min .bar,.sw.min,.cell.pivot .bar,.sw.pivot,.cell.key .bar,.sw.key{background:color-mix(in srgb,var(--d-violet) 30%,transparent);border:2px solid var(--d-violet)}
.cell.sorted .bar,.sw.sorted{background:color-mix(in srgb,var(--d-green) 16%,transparent);border:2px solid var(--d-green)}
.cell.le .bar,.sw.le,.cell.runL .bar,.sw.runL{background:color-mix(in srgb,var(--d-blue) 22%,transparent);border-color:color-mix(in srgb,var(--d-blue) 60%,transparent)}
.cell.runR .bar,.sw.runR{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--d-teal) 50%,transparent) 0 3px,transparent 3px 6px);border-color:color-mix(in srgb,var(--d-teal) 65%,transparent)}
.abox.swap .box{background:repeating-linear-gradient(135deg,var(--d-amber) 0 3px,transparent 3px 6px);border-color:var(--d-amber);background-color:var(--bg)}
.abox.sorted .box{border-color:var(--d-green)}
.nchip.on{background:var(--d-blue);border-color:var(--d-blue);color:var(--d-on)}
.nchip .dg.hi{color:var(--d-amber);text-decoration-color:var(--d-amber)}
.nchip.on .dg.hi{color:var(--d-on)}
.rx-b.on{border-color:var(--d-blue)}
.tree-wrap .dg .te.on{stroke:var(--d-blue);stroke-width:3}
.grow .g-row:nth-of-type(1) .g-bar i{background:var(--d-green)}
.grow .g-row:nth-of-type(2) .g-bar i{background:var(--d-blue)}
.grow .g-row:nth-of-type(3) .g-bar i{background:var(--d-violet)}
.grow .g-row:nth-of-type(4) .g-bar i{background:var(--d-rose)}
</style>
</head>
<body>
<div class="container">
  <div class="scroll-indicator"><div class="scroll-progress" id="prog"></div></div>
  <div class="liquid-blob" id="blob"></div>

  <section class="hero-section">
    <div class="hero-content">

<script>
/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rnd=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
const randArr=(n,lo,hi)=>{const s=new Set();while(s.size<n)s.add(rnd(lo,hi));return [...s];};
const asc=a=>a.slice().sort((x,y)=>x-y);
const desc=a=>a.slice().sort((x,y)=>y-x);
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r;};
function P(...args){const p={};for(let i=0;i<args.length;i+=2){const ix=args[i],lb=args[i+1];if(ix==null||ix<0)continue;p[ix]=p[ix]?p[ix]+','+lb:lb;}return p;}
/* Like P, but keeps pointers that have moved off either end of the array, so a
   crossed low/high pair stays visible instead of silently disappearing. */
function PE(n,...args){
  const ptr={},edge={};
  for(let i=0;i<args.length;i+=2){
    const ix=args[i],lb=args[i+1];if(ix==null)continue;
    const side=ix<0?'left':ix>=n?'right':null;
    if(side)edge[side]=edge[side]?edge[side]+','+lb:lb;
    else ptr[ix]=ptr[ix]?ptr[ix]+','+lb:lb;
  }
  return {ptr,edge};
}
const allMark=(n,c)=>{const m={};for(let i=0;i<n;i++)m[i]=c;return m;};

/* ---------- frame generators (each returns an array of frames) ---------- */
function genLinear({arr:a,x}){
  const n=a.length,F=[];let cmp=0;
  const push=o=>F.push({arr:a.slice(),marks:{},ptr:{},vars:{},line:[],note:'',...o,stats:{comparisons:cmp}});
  push({line:[1],ptr:P(0,'j'),vars:{x,j:1,n},note:`j ← 1. Looking for x = ${x}.`});
  let j=0,matched=false;
  while(true){
    if(j<n-1){
      cmp++;matched=a[j]===x;
      push({line:[2],ptr:P(j,'j'),marks:{[j]:matched?'found':'cmp'},vars:{x,j:j+1,n},
        note:`j < n holds and x ${matched?'=':'≠'} A[${j+1}] = ${a[j]}. ${matched?'x found, the loop stops.':'Keep going.'}`});
      if(matched)break;
      j++;
      push({line:[3],ptr:P(j,'j'),vars:{x,j:j+1,n},note:`j ← j + 1 = ${j+1}`});
    }else{
      push({line:[2],ptr:P(j,'j'),vars:{x,j:j+1,n},note:`j = n, so the loop condition fails. The last element still needs a check in line 5.`});
      break;
    }
  }
  if(!matched)cmp++;
  const hit=a[j]===x;
  push({line:[5],ptr:P(j,'j'),marks:hit?{[j]:'found'}:allMark(n,'dim'),vars:{x,j:j+1,n},
    note:hit?`x = A[${j+1}], so return ${j+1}.`:`x ≠ A[${j+1}] and nothing is left. Return 0 (not found).`});
  return F;
}

function genBinary({arr:a,x}){
  const n=a.length,F=[];let low=0,high=n-1,j=-1,cmp=0;const visited=[];
  const dim=()=>{const m={};for(let i=0;i<n;i++)if(i<low||i>high)m[i]='dim';return m;};
  const push=o=>F.push({arr:a.slice(),marks:{},ptr:{},vars:{},line:[],note:'',visited:visited.slice(),cur:null,...o,stats:{comparisons:cmp}});
  const V=()=>({x,low:low+1,high:high+1,j:j+1});
  const PB=(...a)=>PE(n,...a);
  push({line:[1],...PB(low,'low',high,'high'),vars:V(),note:`low ← 1, high ← n = ${n}, j ← 0. Searching for x = ${x}.`});
  while(low<=high&&j===-1){
    const mid=(low+high)>>1;visited.push(mid);
    push({line:[2,3],marks:{...dim(),[mid]:'cmp'},...PB(low,'low',mid,'mid',high,'high'),cur:mid,vars:{...V(),mid:mid+1},
      note:`mid ← ⌊(${low+1} + ${high+1}) / 2⌋ = ${mid+1}. A[${mid+1}] = ${a[mid]}.`});
    cmp++;
    if(a[mid]===x){
      j=mid;
      push({line:[4],marks:{...dim(),[mid]:'found'},ptr:P(mid,'mid'),cur:mid,vars:{...V(),mid:mid+1},note:`x = A[${mid+1}], so j ← ${mid+1}. Found.`});
    }else if(x<a[mid]){
      high=mid-1;
      push({line:[5],marks:{...dim(),[mid]:'cmp'},...PB(low,'low',high,'high'),cur:mid,vars:V(),
        note:`x = ${x} < A[${mid+1}] = ${a[mid]}. Discard the right half: high ← mid − 1 = ${high+1}.`});
    }else{
      low=mid+1;
      push({line:[6],marks:{...dim(),[mid]:'cmp'},...PB(low,'low',high,'high'),cur:mid,vars:V(),
        note:`x = ${x} > A[${mid+1}] = ${a[mid]}. Discard the left half: low ← mid + 1 = ${low+1}.`});
    }
  }
  const ok=j!==-1;
  push({line:[7,8],marks:ok?{[j]:'found'}:allMark(n,'dim'),cur:ok?j:null,vars:V(),
    ...(ok?PB(j,'j'):PB(high,'high',low,'low')),
    note:ok?`Loop ends. return j = ${j+1}.`:`low = ${low+1} and high = ${high+1}, so low > high: the range is empty and x is not in A. return 0.`});
  return F;
}

function genMerge({arr:a,q}){
  const n=a.length,F=[];let s=0,t=q,k=0,cmp=0,asg=0;const B=Array(n).fill(null);
  const base=()=>{const m={};for(let i=0;i<n;i++){m[i]=i<q?(i<s?'dim':'runL'):(i<t?'dim':'runR');}return m;};
  const pst=()=>P(s<q?s:-1,'s',t<n?t:-1,'t');
  const push=o=>F.push({arr:a.slice(),aux:B.slice(),marks:base(),ptr:{},auxMarks:{},auxPtr:{},vars:{},line:[],note:'',...o,stats:{comparisons:cmp,assignments:asg}});
  push({line:[1,2],ptr:pst(),auxPtr:P(k,'k'),vars:{p:1,q,r:n},note:`Two sorted runs: A[1..${q}] and A[${q+1}..${n}]. s ← p, t ← q + 1, k ← p. B is the auxiliary array.`});
  while(s<q&&t<n){
    cmp++;
    const left=a[s]<=a[t];
    push({line:[3,4],marks:{...base(),[s]:'cmp',[t]:'cmp'},ptr:pst(),auxPtr:P(k,'k'),vars:{s:s+1,t:t+1,k:k+1},
      note:`Compare A[s] = ${a[s]} with A[t] = ${a[t]}: ${left?'A[s] ≤ A[t]':'A[s] > A[t]'}, so the smaller one, ${left?a[s]:a[t]}, goes next.`});
    let took,ln;
    if(left){B[k]=a[s];took=a[s];s++;ln=[5,6,11];}else{B[k]=a[t];took=a[t];t++;ln=[8,9,11];}
    asg++;k++;
    push({line:ln,ptr:pst(),auxMarks:{[k-1]:'swap'},auxPtr:P(k,'k'),vars:{s:s+1,t:t+1,k:k+1},note:`B[${k}] ← ${took}. Advance ${left?'s':'t'} and k.`});
  }
  while(t<n){
    B[k]=a[t];asg++;k++;t++;
    push({line:[13],ptr:pst(),auxMarks:{[k-1]:'swap'},auxPtr:P(k,'k'),vars:{s:s+1,t:t+1,k:k+1},note:`The left run is used up (s = q + 1), so copy the rest of the right run into B.`});
  }
  while(s<q){
    B[k]=a[s];asg++;k++;s++;
    push({line:[14],ptr:pst(),auxMarks:{[k-1]:'swap'},auxPtr:P(k,'k'),vars:{s:s+1,t:t+1,k:k+1},note:`The right run is used up, so copy the rest of the left run into B.`});
  }
  asg+=n;
  push({line:[16],arr:B.slice(),marks:allMark(n,'sorted'),note:`A[p..r] ← B[p..r] costs n more assignments. Total assignments = 2n = ${2*n}. Comparisons = ${cmp}, which is between min(n₁, n₂) = ${Math.min(q,n-q)} and n − 1 = ${n-1}.`});
  return F;
}

function mergeSim(a,p,q,r){
  let s=p,t=q+1,c=0;const B=[];
  while(s<=q&&t<=r){c++;if(a[s]<=a[t])B.push(a[s++]);else B.push(a[t++]);}
  while(s<=q)B.push(a[s++]);
  while(t<=r)B.push(a[t++]);
  for(let k=0;k<B.length;k++)a[p+k]=B[k];
  return c;
}
function genBottomUp({arr}){
  const a=arr.slice(),n=a.length,F=[];let cmp=0,asg=0;
  const push=o=>F.push({arr:a.slice(),marks:{},ptr:{},vars:{},line:[],note:'',...o,stats:{comparisons:cmp,assignments:asg}});
  push({line:[1],vars:{t:1,n},note:`t ← 1. Every single element is already a sorted run of size 1.`});
  let t=1;
  while(t<n){
    const s=t;t=2*s;let i=0;const done=[];
    const dm=()=>{const m={};done.forEach(([p,r])=>{for(let x=p;x<=r;x++)m[x]='sorted';});return m;};
    const shade={};for(let x=0;x<n;x++)shade[x]=Math.floor(x/s)%2===0?'runL':'runR';
    push({line:[2,3],vars:{s,t,n},marks:shade,note:`New pass: s = ${s}, t = ${t}. Merge neighboring runs of size ${s} into runs of size ${t}.`});
    const doMerge=(p,q,r,ln)=>{
      const m1=dm();for(let x=p-1;x<=q-1;x++)m1[x]='runL';for(let x=q;x<=r-1;x++)m1[x]='runR';
      push({line:ln,vars:{s,t,p,q,r},marks:m1,note:`merge(A, ${p}, ${q}, ${r}): merge A[${p}..${q}] with A[${q+1}..${r}].`});
      cmp+=mergeSim(a,p-1,q-1,r-1);asg+=2*(r-p+1);done.push([p-1,r-1]);
      push({line:ln,vars:{s,t,p,q,r},marks:dm(),note:`A[${p}..${r}] is now one sorted run of ${r-p+1} elements.`});
    };
    while(i+t<=n){doMerge(i+1,i+s,i+t,[4,5,6]);i+=t;}
    if(i+s<n)doMerge(i+1,i+s,n,[8]);
  }
  push({line:[9],marks:allMark(n,'sorted'),vars:{t,n},note:`t = ${t} ≥ n, so a single run remains: the array is sorted. Comparisons ${cmp}, assignments ${asg}.`});
  return F;
}

function genSelection({arr}){
  const a=arr.slice(),n=a.length,F=[];let cmp=0,sw=0;
  const push=o=>F.push({arr:a.slice(),marks:{},ptr:{},vars:{},line:[],note:'',...o,stats:{comparisons:cmp,interchanges:sw}});
  push({line:[1],note:`Start. Each round finds the smallest unsorted element and puts it at the front of the unsorted part.`});
  for(let i=0;i<n-1;i++){
    let k=i;
    const pre=()=>{const m={};for(let x=0;x<i;x++)m[x]='sorted';return m;};
    push({line:[1,2],marks:{...pre(),[i]:'min'},ptr:P(i,'i,k'),vars:{i:i+1,k:k+1},note:`i = ${i+1}. Assume A[${i+1}] = ${a[i]} is the smallest so far (k ← i).`});
    for(let j=i+1;j<n;j++){
      cmp++;
      const less=a[j]<a[k];
      if(less)k=j;
      push({line:[3,4],marks:{...pre(),[j]:'cmp',[k]:'min'},ptr:P(i,'i',k,'k',j,'j'),vars:{i:i+1,j:j+1,k:k+1},
        note:less?`A[${j+1}] = ${a[j]} is smaller than the current minimum, so k ← ${j+1}.`:`A[${j+1}] = ${a[j]} is not smaller than A[${k+1}] = ${a[k]}. k stays.`});
    }
    if(k!==i){
      [a[i],a[k]]=[a[k],a[i]];sw++;
      push({line:[6],marks:{...pre(),[i]:'swap',[k]:'swap'},ptr:P(i,'i',k,'k'),vars:{i:i+1,k:k+1},note:`Interchange A[${i+1}] and A[${k+1}]. Position ${i+1} is now final.`});
    }else{
      push({line:[6],marks:{...pre(),[i]:'min'},ptr:P(i,'i,k'),vars:{i:i+1,k:k+1},note:`k = i: the element is already in place, so no interchange.`});
    }
  }
  push({line:[7],marks:allMark(n,'sorted'),note:`Done. Always exactly n(n−1)/2 = ${n*(n-1)/2} comparisons, whatever the input.`});
  return F;
}

function genInsertion({arr}){
  const a=arr.slice(),n=a.length,F=[];let cmp=0,mv=0;let view=a.slice();
  const push=o=>F.push({arr:view.slice(),marks:{},ptr:{},vars:{},line:[],note:'',...o,stats:{comparisons:cmp,shifts:mv}});
  push({line:[1],note:`Start. A[1] alone is a sorted part. Each round inserts the next element into it.`});
  for(let i=1;i<n;i++){
    const x=a[i];view[i]=null;let j=i-1;
    const pre=()=>{const m={};for(let q=0;q<=i;q++)m[q]='sorted';return m;};
    push({line:[1,2,3],marks:pre(),ptr:P(j,'j',i,'gap'),vars:{i:i+1,x,j:j+1},note:`i = ${i+1}. Lift x = A[${i+1}] = ${x} out of the array, leaving a gap.`});
    while(j>=0){
      cmp++;
      const gt=a[j]>x;
      push({line:[4],marks:{...pre(),[j]:'cmp'},ptr:P(j,'j',j+1,'gap'),vars:{i:i+1,x,j:j+1},
        note:`A[${j+1}] = ${a[j]} > x = ${x}? ${gt?'Yes, shift it one place right.':`No, stop. x belongs at position ${j+2}.`}`});
      if(!gt)break;
      a[j+1]=a[j];mv++;view[j+1]=a[j];view[j]=null;j--;
      push({line:[5,6],marks:{...pre(),[j+2]:'swap'},ptr:P(j,'j',j+1,'gap'),vars:{i:i+1,x,j:j+1},note:`A[${j+3}] ← A[${j+2}]. The gap moves left. j ← ${j+1}.`});
    }
    a[j+1]=x;view[j+1]=x;
    push({line:[8],marks:{...pre(),[j+1]:'key'},ptr:P(j+1,'x'),vars:{i:i+1,x,j:j+1},note:`${j<0?'j = 0: nothing left to compare. ':''}A[${j+2}] ← x = ${x}. The first ${i+1} elements are sorted.`});
  }
  push({line:[9],marks:allMark(n,'sorted'),note:`Done. Sorted input needs only n − 1 = ${n-1} comparisons; reversed input needs n(n−1)/2 = ${n*(n-1)/2}.`});
  return F;
}

function genBubble({arr}){
  const a=arr.slice(),n=a.length,F=[];let cmp=0,sw=0;
  const push=o=>F.push({arr:a.slice(),marks:{},ptr:{},vars:{},line:[],note:'',...o,stats:{comparisons:cmp,interchanges:sw}});
  let i=1,sorted=false;
  push({line:[1],vars:{i,sorted},note:`i ← 1, sorted ← false.`});
  while(i<=n-1&&!sorted){
    sorted=true;
    const pre=()=>{const m={};for(let x=0;x<i-1;x++)m[x]='sorted';return m;};
    push({line:[2,3],marks:pre(),vars:{i,sorted},note:`Pass ${i}. sorted ← true. Scan from right to left so the smallest value bubbles toward the front.`});
    for(let j=n-1;j>=i;j--){
      cmp++;
      const swap=a[j]<a[j-1];
      push({line:[4,5],marks:{...pre(),[j]:'cmp',[j-1]:'cmp'},ptr:P(j,'j'),vars:{i,sorted},note:`A[${j+1}] = ${a[j]} < A[${j}] = ${a[j-1]}? ${swap?'Yes, interchange them.':'No, leave them.'}`});
      if(swap){
        [a[j],a[j-1]]=[a[j-1],a[j]];sw++;sorted=false;
        push({line:[6,7],marks:{...pre(),[j]:'swap',[j-1]:'swap'},ptr:P(j,'j'),vars:{i,sorted},note:`Interchanged. sorted ← false.`});
      }
    }
    const fin={};for(let x=0;x<i;x++)fin[x]='sorted';
    push({line:[9,10],marks:fin,vars:{i:i+1,sorted},note:sorted?`No interchange in this pass: sorted stays true, so the loop stops early.`:`A[${i}] is now in its final place. i ← ${i+1}.`});
    i++;
  }
  push({line:[11],marks:allMark(n,'sorted'),note:`Done. Sorted input costs one pass, n − 1 = ${n-1} comparisons.`});
  return F;
}

function genRadix({arr}){
  const F=[];let L=arr.slice();const n=L.length;const k=String(Math.max(...L)).length;let placed=0;
  const digit=(v,j)=>Math.floor(v/Math.pow(10,j-1))%10;
  const E=()=>Array.from({length:10},()=>[]);
  const names=['units','tens','hundreds','thousands'];
  const push=o=>F.push({radix:true,k,j:0,hj:0,list:L.slice(),buckets:E(),cur:null,curDigit:null,marks:{},ptr:{},vars:{},line:[],note:'',...o,stats:{placed:`${placed} / ${k*n}`}});
  push({vars:{k},note:`The largest number is ${Math.max(...arr)}, so k = ${k} digit${k>1?'s':''}. Make ${k} pass${k>1?'es':''}, starting from the least significant digit.`});
  for(let j=1;j<=k;j++){
    const b=E();const rest=L.slice();
    push({line:[1,2],j,hj:j,list:rest.slice(),vars:{j,k},note:`Pass ${j} of ${k}: distribute by the ${names[j-1]||j+'th'} digit. Ten empty lists L0 to L9 are ready.`});
    while(rest.length){
      const a1=rest.shift(),d=digit(a1,j);b[d].push(a1);placed++;
      push({line:[3,4,5],j,hj:j,list:rest.slice(),cur:a1,curDigit:d,buckets:b.map(x=>x.slice()),vars:{j,k},note:`a = ${a1}. Digit ${j} is ${d}, so append it to L${d}.`});
    }
    L=[].concat(...b);
    push({line:[7,8,9,10],j,hj:0,list:L.slice(),vars:{j,k},note:`L ← L0, L1, …, L9. The list is now sorted by its last ${j} digit${j>1?'s':''}.`});
  }
  push({line:[12],list:L.slice(),vars:{k},note:`return L. Sorted. Work done: ${k} passes over ${n} elements = Θ(kn).`});
  return F;
}

function genQuick({arr}){
  const a=arr.slice(),n=a.length,F=[];let cmp=0,sw=0;const fixed=new Set();
  const push=o=>F.push({arr:a.slice(),marks:{},ptr:{},vars:{},line:[],note:'',...o,stats:{comparisons:cmp,interchanges:sw}});
  const base=(lo,hi)=>{const m={};for(let i=0;i<n;i++){const c=fixed.has(i)?'sorted':(i<lo||i>hi)?'dim':'';if(c)m[i]=c;}return m;};
  function split(lo,hi){
    let i=lo;const x=a[lo];
    push({line:[7,8],marks:{...base(lo,hi),[lo]:'pivot'},ptr:P(lo,'x,i'),vars:{low:lo+1,high:hi+1,x},note:`split(A[${lo+1}..${hi+1}]). The pivot is x = A[low] = ${x}. i ← low.`});
    for(let j=lo+1;j<=hi;j++){
      cmp++;
      const le=a[j]<=x;
      const m={...base(lo,hi),[lo]:'pivot'};for(let q=lo+1;q<=i;q++)m[q]='le';m[j]='cmp';
      push({line:[9,10],marks:m,ptr:P(lo,'x',i,'i',j,'j'),vars:{low:lo+1,high:hi+1,x},note:`A[${j+1}] = ${a[j]} ≤ x = ${x}? ${le?'Yes, it joins the left zone.':'No, it stays on the right.'}`});
      if(le){
        i++;
        if(i!==j){
          [a[i],a[j]]=[a[j],a[i]];sw++;
          const m2={...base(lo,hi),[lo]:'pivot'};for(let q=lo+1;q<=i;q++)m2[q]='le';m2[i]='swap';m2[j]='swap';
          push({line:[11,12],marks:m2,ptr:P(lo,'x',i,'i',j,'j'),vars:{low:lo+1,high:hi+1,x},note:`i ← ${i+1}. Interchange A[${i+1}] and A[${j+1}] to grow the "≤ x" zone.`});
        }
      }
    }
    [a[lo],a[i]]=[a[i],a[lo]];if(i!==lo)sw++;
    fixed.add(i);
    push({line:[15,16],marks:{...base(lo,hi),[i]:'found'},ptr:P(i,'w'),vars:{low:lo+1,high:hi+1,w:i+1},note:`Interchange A[low] and A[i]. The pivot ${x} lands at its final position w = ${i+1}: everything left is ≤ ${x}, everything right is > ${x}.`});
    return i;
  }
  function qs(lo,hi){
    if(lo<hi){
      push({line:[1,2],marks:base(lo,hi),vars:{low:lo+1,high:hi+1},note:`quicksort(A, ${lo+1}, ${hi+1}): low < high, so split this range.`});
      const w=split(lo,hi);
      qs(lo,w-1);qs(w+1,hi);
    }else if(lo===hi){
      fixed.add(lo);
      push({line:[2],marks:{...base(lo,hi),[lo]:'sorted'},vars:{low:lo+1,high:hi+1},note:`quicksort(A, ${lo+1}, ${hi+1}): one element, nothing to do.`});
    }
  }
  push({line:[1],note:`quicksort(A, 1, n). Split places one pivot in its final position, then each side is sorted the same way. No combine step.`});
  qs(0,n-1);
  push({line:[6],marks:allMark(n,'sorted'),note:`Done. ${cmp} comparisons. Balanced splits give Θ(n log n); sorted input gives Θ(n²).`});
  return F;
}

const DEF=[38,27,43,3,9,82,10,55];
const absent=a=>Math.max(...a)+1;
const binCount=(a,x)=>{let lo=0,hi=a.length-1,c=0;while(lo<=hi){const m=(lo+hi)>>1;c++;if(a[m]===x)return c;if(x<a[m])hi=m-1;else lo=m+1;}return c;};
const worstAbsent=a=>{let best=a[0]-1,bc=binCount(a,best);a.forEach(v=>{const y=v+1;if(!a.includes(y)){const c=binCount(a,y);if(c>bc){bc=c;best=y;}}});return best;};
const sortP=(bestL,worstL)=>[
  {l:'Random',f:s=>{s.arr=randArr(s.arr.length,3,95);}},

function binTree(el,f,st){
  const n=st.arr.length;
  if(el._n!==n){
    el._n=n;const nodes=[];
    (function b(lo,hi,d,p){if(lo>hi)return;const m=(lo+hi)>>1;nodes.push({m,d,p});b(lo,m-1,d+1,m);b(m+1,hi,d+1,m);})(0,n-1,0,-1);
    el._nodes=nodes;el._h=Math.max(...nodes.map(z=>z.d));
  }
  const nodes=el._nodes,H=el._h,W=n*34+24,Ht=H*46+52;
  const X=i=>18+i*34,Y=d=>22+d*46;
  const vis=new Set(f.visited||[]);
  let s=`<svg class="dg" viewBox="0 0 ${W} ${Ht}" width="100%" style="max-width:${Math.round(W*1.25)}px" role="img" aria-label="Binary search decision tree">`;
  nodes.forEach(nd=>{if(nd.p>=0){const p=nodes.find(z=>z.m===nd.p);s+=`<line class="te ${vis.has(nd.m)&&vis.has(nd.p)?'on':''}" x1="${X(nd.p)}" y1="${Y(p.d)}" x2="${X(nd.m)}" y2="${Y(nd.d)}"/>`;}});
  nodes.forEach(nd=>{s+=`<g class="tn ${vis.has(nd.m)?'vis':''} ${f.cur===nd.m?'cur':''}"><circle cx="${X(nd.m)}" cy="${Y(nd.d)}" r="14"/><text x="${X(nd.m)}" y="${Y(nd.d)}" dominant-baseline="central" text-anchor="middle">${nd.m+1}</text></g>`;});
  s+='</svg>';
  const maxc=Math.floor(Math.log2(n))+1;
  el.innerHTML=`<div class="tree-cap mono">Decision tree for n = ${n}. Each node is a mid position. Height = ⌊log₂ ${n}⌋ = ${maxc-1}, so at most ⌊log₂ ${n}⌋ + 1 = ${maxc} comparisons.</div><div class="tree-wrap">${s}</div>`;
}

/* ---------- viz engine ---------- */
function fmtNum(v,k,hj){
  const s=String(v).padStart(k,'0'),lead=k-String(v).length;
  return s.split('').map((d,ix)=>{const pos=k-ix;return `<span class="dg${pos===hj?' hi':''}${ix<lead?' lz':''}">${d}</span>`;}).join('');
}
function renderRadix(f){
  const k=f.k,hj=f.hj;
  let h='<div class="rx"><div class="rx-row"><b class="rx-lab">L</b><div class="rx-list">';
  h+=f.list.length?f.list.map(v=>`<span class="nchip">${fmtNum(v,k,hj)}</span>`).join(''):'<span class="rx-empty">empty</span>';
  h+='</div></div>';
  h+=`<div class="rx-cur">${f.cur!=null?`<b>a</b> ← <span class="nchip on">${fmtNum(f.cur,k,hj)}</span> digit ${f.j} = ${f.curDigit}`:''}</div>`;
  h+='<div class="rx-buckets">'+f.buckets.map((b,i)=>`<div class="rx-b${f.cur!=null&&f.curDigit===i?' on':''}"><div class="rx-h">L${i}</div>${b.map(v=>`<span class="nchip">${fmtNum(v,k,hj)}</span>`).join('')}</div>`).join('')+'</div></div>';
  return h;
}
function renderBoard(f){
  if(f.radix)return renderRadix(f);
  const arr=f.arr,max=Math.max(...arr.filter(v=>v!=null),1);
  const eg=f.edge||{};
  const edgeCell=(lab,idx)=>`<div class="cell edge"><div class="val"></div><div class="bar" style="height:28px"></div><div class="idx">${idx}</div><div class="ptr">▲<br>${lab.split(',').map(esc).join('<br>')}</div></div>`;
  let h='<div class="cells">';
  if(eg.left)h+=edgeCell(eg.left,0);
  arr.forEach((v,i)=>{
    const hole=v==null,c=f.marks[i]||'';
    const bh=hole?28:16+Math.round(v/max*100);
    const p=f.ptr[i]?'▲<br>'+f.ptr[i].split(',').map(esc).join('<br>'):'';
    h+=`<div class="cell ${hole?'hole':''} ${c}"><div class="val">${hole?'':v}</div><div class="bar" style="height:${bh}px"></div><div class="idx">${i+1}</div><div class="ptr">${p}</div></div>`;
  });
  if(eg.right)h+=edgeCell(eg.right,arr.length+1);
  h+='</div>';
  if(f.aux){
    h+='<div class="aux-lab">B (auxiliary array)</div><div class="cells aux">';
    f.aux.forEach((v,i)=>{
      const p=f.auxPtr[i]?'▲ '+esc(f.auxPtr[i]):'';
      h+=`<div class="cell abox ${f.auxMarks[i]||''}"><div class="box">${v==null?'':v}</div><div class="idx">${i+1}</div><div class="ptr">${p}</div></div>`;
    });
    h+='</div>';
  }
  return h;
}
function parseNums(s,lo,hi){
  const t=s.split(/[\s,;]+/).filter(Boolean).map(Number);
  if(!t.length||t.some(v=>!Number.isInteger(v)||v<lo||v>hi))return null;
  return t;
}

     <button class="btn solid" data-a="play">Play</button>
     <button class="btn" data-a="next">Step</button>
     <input type="range" min="0" value="0" aria-label="Step position">
     <select aria-label="Speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option></select>
     <span class="count"></span>
   </div>
   <div class="legend">${(cfg.legend||[]).map(([c,l])=>`<span class="lg">${c?`<i class="sw ${c}"></i>`:''}${esc(l)}</span>`).join('')}</div>`;
  const $=s=>host.querySelector(s);
  const inArr=$('.in.arr'),inX=$('.in.x'),hint=$('.hint'),range=$('input[type=range]'),playBtn=$('[data-a=play]');
  const chipsEl=$('.chips'),boardEl=$('.board'),noteEl=$('.note'),extraEl=$('.extra'),countEl=$('.count');
  const lines=host.querySelectorAll('.ln');

  function syncInputs(){
    inArr.value=cfg.merge?st.arr.slice(0,st.q).join(', ')+' | '+st.arr.slice(st.q).join(', '):st.arr.join(', ');
    if(inX)inX.value=st.x;
  }
  function render(){
    const f=st.frames[st.i];
    const vars=Object.entries(f.vars||{}).map(([k,v])=>`<span class="chip"><i>${esc(k)}</i>${esc(v)}</span>`).join('');
    const stats=Object.entries(f.stats||{}).map(([k,v])=>`<span class="chip stat"><i>${esc(k)}</i>${esc(v)}</span>`).join('');
    chipsEl.innerHTML=vars+stats;
    boardEl.innerHTML=renderBoard(f);
    noteEl.textContent=f.note||'';
    lines.forEach(l=>l.classList.toggle('on',(f.line||[]).includes(+l.dataset.n)));
    if(cfg.extra)cfg.extra(extraEl,f,st);
    range.max=st.frames.length-1;range.value=st.i;
    countEl.textContent=`${st.i+1} / ${st.frames.length}`;
  }
  function stop(){clearTimeout(st.timer);st.timer=null;playBtn.textContent='Play';}
  function tick(){
    clearTimeout(st.timer);
    st.timer=setTimeout(()=>{if(st.i<st.frames.length-1){st.i++;render();tick();}else stop();},900/st.speed);
  }
  function play(){
    if(st.timer){stop();return;}
    if(st.i>=st.frames.length-1){st.i=0;render();}
    playBtn.textContent='Pause';tick();
  }
  function run(){stop();st.frames=cfg.gen(st);st.i=0;syncInputs();hint.textContent='';render();}
  function apply(){
    let ok=true,msg=`Enter 2 to ${maxLen} whole numbers between 0 and ${maxVal}, separated by commas.`;
    if(cfg.merge){
      const parts=inArr.value.split('|');
      if(parts.length===2){
        const l=parseNums(parts[0],0,maxVal),r=parseNums(parts[1],0,maxVal);
        if(!l||!r||l.length+r.length>maxLen)ok=false;else{st.arr=[...asc(l),...asc(r)];st.q=l.length;}
      }else{
        const t=parseNums(inArr.value,0,maxVal);
        if(!t||t.length<2||t.length>maxLen)ok=false;else{const h=t.length>>1;st.arr=[...asc(t.slice(0,h)),...asc(t.slice(h))];st.q=h;}
      }
      if(ok)msg='';else msg='Enter two groups of whole numbers split by |, for example 2, 5, 8 | 1, 4, 6. Each group is sorted for you.';
    }else{
      const t=parseNums(inArr.value,0,maxVal);
      if(!t||t.length<2||t.length>maxLen)ok=false;else st.arr=cfg.sortedInput?asc(t):t;
    }
    if(ok&&inX){const v=Number(inX.value);if(inX.value===''||!Number.isFinite(v)){ok=false;msg='Enter a number for x.';}else st.x=v;}
    if(!ok){hint.textContent=msg;return;}
    run();
  }
  host.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.p!=null){cfg.presets[+b.dataset.p].f(st);run();return;}
    const a=b.dataset.a;
    if(a==='apply')apply();
    else if(a==='play')play();
    else if(a==='next'){stop();if(st.i<st.frames.length-1){st.i++;render();}}
    else if(a==='back'){stop();if(st.i>0){st.i--;render();}}
    else if(a==='reset'){stop();st.i=0;render();}
  });
  host.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='range')apply();});
  range.addEventListener('input',()=>{stop();st.i=+range.value;render();});
  $('select').addEventListener('change',e=>{st.speed=+e.target.value;if(st.timer)tick();});
  run();
}

const SVGS={
};
const TOPICS=[
{group:'Complexity',id:'notation',title:'Asymptotic Notation',tagline:'O, Ω, Θ and o — the four ways to compare growth rates.',cols:[
 [{p:'Time complexity is how running time grows with input size n. Seconds depend on machine, language and compiler, so we track the growth rate instead and drop constant factors and lower-order terms: n² log n + 10n² + n is of order n² log n.'},
  {sub:'O — upper bound'},{p:'f(n) = O(g(n)) if there are constants c > 0 and n₀ with f(n) ≤ c·g(n) for all n ≥ n₀. f grows no faster than g — read O as "≤". It is only an upper bound: insertion sort is O(n²), yet runs in O(n) on sorted input.'},
  {sub:'Ω — lower bound'},{p:'f(n) = Ω(g(n)) if there are c > 0 and n₀ with f(n) ≥ c·g(n) for all n ≥ n₀. f grows at least as fast as g — read Ω as "≥". f is Ω(g) exactly when g is O(f). Ω also applies to problems: "comparison sorting is Ω(n log n)" means no comparison sort beats n log n.'},
  {sub:'Θ — tight bound'},{p:'f(n) = Θ(g(n)) if there are c₁, c₂ > 0 and n₀ with c₁·g(n) ≤ f(n) ≤ c₂·g(n) for all n ≥ n₀. f grows at the same rate as g — read Θ as "=". f = Θ(g) if and only if f is both O(g) and Ω(g).'}],
 [{key:'Selection sort is Θ(n²); bottom-up merge sort is Θ(n log n). Insertion sort has no single Θ overall, since it ranges from n to n².'},
  {sub:'Limit test shortcut'},{formula:'If lim f(n)/g(n) as n → ∞ exists: not ∞ ⇒ f = O(g).  not 0 ⇒ f = Ω(g).  a constant in (0, ∞) ⇒ f = Θ(g).'},
  {sub:'o — little-o (strictly slower)'},{p:'f(n) = o(g(n)) if for every constant c > 0 there is an n₀ with f(n) < c·g(n) for all n ≥ n₀: f becomes insignificant next to g — read "<". Big-O needs some c; little-o needs every c. For the smooth, steadily growing functions in this course, f = o(g) exactly when f = O(g) but g ≠ O(f). (This shortcut can fail for oscillating functions; fall back on the ∀c definition.) We also write f ≺ g for f = o(g).'},
  {nt:'Complexity classes',b:'"f is Θ(g)" is reflexive, symmetric and transitive, so it splits functions into classes — every degree-2 polynomial is in class n². Little-o separates classes: n log n = o(n²) means n log n is O(n²) but n² is not O(n log n).'},
  {table:{title:'Hierarchy of complexity classes (slowest-growing to fastest-growing)',head:['Chain'],rows:[['1 ≺ log log n ≺ log n ≺ √n ≺ n^(3/4) ≺ n ≺ n log n ≺ n² ≺ 2ⁿ ≺ n! ≺ 2^(n²)']]}}]]},

{group:'Complexity',id:'growth',title:'Why Growth Rate Matters',tagline:'The same million elements, radically different running times.',cols:[
 [{p:'Sort 2²⁰ (about a million) elements at one microsecond per comparison: bottom-up merge sort takes about 20 seconds, selection sort about 6.4 days. On small inputs the gap is invisible; on large ones the algorithm decides whether the program is usable.'},
  {p:'An elementary operation is any step with constant-bounded cost — arithmetic, comparisons and assignments on fixed-size operands. We count these instead of real time.'}],
 [{table:{title:'Common growth rates, slowest-growing to fastest-growing',head:['Rate','Note'],th:true,rows:[['log n','Halving per step — binary search.'],['n','One pass — linear search.'],['n log n','Optimal comparison-based sorting.'],['n²','Simple sorts — selection, insertion, bubble.'],['n³','Sum of squares; some matrix algorithms.'],['2ⁿ','Explodes even for moderate n — brute-force subsets.']]}}]]},

{group:'Complexity',id:'estimating',title:'How to Estimate Running Time',tagline:'Three standard techniques: count iterations, find the basic operation, or solve a recurrence.',cols:[
 [{sub:'1. Counting the number of iterations'},{p:'Running time is often proportional to the number of loop passes. Find the most-executed statement, assume constant cost, and count its runs. A simple loop (step 1) becomes a summation: iterator = index, start = lower limit, end = upper limit. Nested loops become nested sums.'},
  {table:{title:'Summations and geometric progression',head:['Sum','Closed form','Growth'],th:true,rows:[
    ['1 + 2 + … + n','n(n+1)/2','Θ(n²)'],
    ['1² + 2² + … + n²','n(n+1)(2n+1)/6','Θ(n³)'],
    ['1³ + 2³ + … + n³','n²(n+1)²/4','Θ(n⁴)'],
    ['1 + 2 + … + √n','(√n)(√n+1)/2','Θ(n)'],
    ['Σ 2ⁱ, i = 0..n (doubling)','2^(n+1) − 1','Θ(last term)'],
    ['1 + 1/2 + 1/4 + … (halving)','never exceeds 2','Θ(first term)']]}},
  {key:'A geometric sum is Θ(last term) when the ratio is above 1 and Θ(first term) when it is below 1. This is why the Master Theorem has three cases: the per-level costs form a geometric series dominated by the first level, the last level, or neither.'}],
 [{table:{title:'Loop-counting examples from the notes',head:['Example','Loop shape','Running time'],th:true,rows:[
    ['count1','j: 1..√n, i: 1..j²','Σ j² = Θ(n^1.5)'],
    ['count2','i: 1..n, j: 1..⌊n/i⌋','Σ ⌊n/i⌋ ≈ n ln n = Θ(n log n)'],
    ['count3','i = 1,2,4,…,n (r = log₂ i)','Σ 2ʳ = 2n − 1 = Θ(n)'],
    ['count4','i = n, n/2, n/4, …, 1','Same substitution as count3 = Θ(n)'],
    ['count5','i: 1..n, inner j = 2,4,16,… (j²  each time)','n(log log n + 1) = Θ(n log log n)']]}},
  {sub:'2. Counting the frequency of basic operations'},{p:'When counting iterations is awkward, as with merge, find a basic operation: the elementary operation with the highest frequency, up to a constant factor. In merge every element moves to B once and back once — exactly 2n assignments, more than anything else — so assignment is basic and merge is Θ(n). Comparison is not basic for merge in general (there may be only one), but it is when the halves are about equal, as in bottom-up merge sort.'},
  {nt:'A warning: modified insertion sort',b:'Using binary search to find the insertion point cuts comparisons to O(n log n). But comparison is no longer the basic operation: the shifting assignments are unchanged at O(n²), so the running time stays O(n²). Always check that your chosen operation really has the highest frequency.'},
  {sub:'3. Using recurrence relations'},{p:'Recursive algorithms usually give a recurrence, a function defined in terms of itself, such as T(n) = 2T(n/2) + n. For binary search, C(n) ≤ 1 if n = 1 and C(n) ≤ C(⌊n/2⌋) + 1 if n ≥ 2. Unrolling gives C(n) ≤ C(1) + ⌊log n⌋ = ⌊log n⌋ + 1, so O(log n). The Recursion section covers this in full.'}]]},

{group:'Complexity',id:'space',title:'Space Complexity',tagline:'Extra memory beyond the input — and why it can never exceed time.',cols:[
 [{p:'Space is the number of memory cells (words) an algorithm needs beyond the input. Counting only extra work space lets us tell apart algorithms that use less than linear space. O, Ω, Θ and o carry over from time complexity.'}],
 [{formula:'Work space never exceeds running time: writing each cell costs at least constant time. With time T(n) and space S(n), S(n) = O(T(n)).'},
  {key:'Sorting n = 2²⁰ = 1,048,576 elements: selection sort needs no extra storage; bottom-up merge sort needs n extra cells.'}]]},

{group:'Complexity',id:'optimal',title:'Optimal Algorithms',tagline:'Ω(n log n) is the floor for any comparison-based sort.',cols:[
 [{p:'Every comparison-based sort takes Ω(n log n) time in the worst case, so one whose worst case is O(n log n) is called optimal — bottom-up merge sort is optimal. It is optimal within a multiplicative constant: another algorithm might still run in a constant fraction of its time.'},
  {p:'In general, if every algorithm for problem Π is Ω(f(n)), any algorithm solving Π in O(f(n)) time is optimal for Π.'}],
 [{key:'This definition ignores space. Time counts as more precious while space stays reasonable, and most optimal algorithms use about O(n) space anyway. Bottom-up merge sort needs Θ(n) extra space and is still optimal, even though heap sort reaches O(n log n) time in O(1) space — heap sort is not covered yet, so its card is empty.'}]]},

{group:'Complexity',id:'wc-ac',title:'Worst-Case & Average-Case Analysis',tagline:'Same algorithm, different cost depending on which inputs we average over.',cols:[
 [{p:'Some algorithms depend only on input size — matrix addition and selection sort always do the same work. Others, like insertion sort, also depend on input order: its comparisons range from n − 1 to n(n − 1)/2. A time function of both size and order is impractical, so we analyze specific cases. Best-case analysis is rarely used; it says little about real behavior.'},
  {sub:'Worst-case analysis'},{p:'Take the maximum cost over all inputs of size n. Insertion sort is Ω(n²) on some input of every size (the decreasing one) and O(n²) overall, so it is Θ(n²) in the worst case. Θ beats O here because it also guarantees the Ω(n²) part.'}],
 [{nt:'Worst-case bounds don’t always match',b:'A worst-case Θ(f(n)) claim needs, for every n above some n₀, an input of size n taking Ω(f(n)) time — slow inputs for only infinitely many n are not enough. Example: binary search when n is odd, linear search when n is even. It is O(n) but not Ω(n) in the worst case, since odd n never gives a slow input; we can only say Ω(log n). So it is not Θ of any standard growth function. (A contrived piecewise f would fit, which is exactly why worst-case Θ needs the "for every n" condition.)'},
  {sub:'Average-case analysis'},{p:'Average the time over all inputs of size n. This needs an input distribution (usually uniform) and is often long and complex.'},
  {table:{title:'Average-case results',head:['Algorithm','Average comparisons'],th:true,rows:[['Linear search','(1/n)·Σ j = (n+1)/2, so Θ(n)'],['Insertion sort','i/2 + 1/2 − 1/i per element, summing to ≈ n²/4 + 3n/4 − ln n: Θ(n²), about half the worst case']]}}]]},

{group:'Complexity',id:'amortized',title:'Amortized Analysis',tagline:'Average the cost over a whole run, not over all inputs.',cols:[
 [{p:'When an exact Θ is out of reach, O can be pessimistic. If an operation repeats many times — usually fast, occasionally very slow — amortized analysis averages its cost over the whole execution. Unlike average-case analysis, it averages over operations within one run, not over all inputs of a size, and assumes no input distribution.'},
  {nt:'List with deletions',b:'Append each integer x to a list; if x is even, then delete every odd element just before it. One while loop can delete up to n − 1 elements, so the naive bound is O(n) per iteration, O(n²) total. But there are exactly n insertions and each element is deleted at most once: between n and 2n − 1 operations, Θ(n). The while loop is O(1) amortized for any input.'}],
 [{nt:'Doubling array',b:'Elements arrive in a stream. Start with an array of size 1 and double it when full, copying everything over. For n = 2ᵏ, each element moves O(log n) times — a loose O(n log n). But each entry of each new array is assigned exactly once, so total assignments are Σ 2ʲ = 2^(k+1) − 1 = 2n − 1 = Θ(n): Θ(1) amortized per element.'},
  {key:'Amortized analysis is harder than worst-case analysis, but yields a lower, tighter bound.'}]]},

{group:'Complexity',id:'input-size',title:'Input Size & Problem Instance',tagline:'What "n" means changes with the problem — and that changes the complexity class.',cols:[
 [{p:'An instance is one input to an algorithm for the problem. How input size is measured is a convention that depends on the problem.'},
  {table:{title:'How input size is measured',head:['Problem domain','Size n is …'],th:true,rows:[['Sorting and searching','the number of entries'],['Graphs','the number of vertices and/or edges'],['Computational geometry','the number of points, vertices, edges, segments or polygons'],['Matrices','the dimensions of the matrices'],['Number theory and cryptography','the number of bits of the input']]}}],
 [{key:'Adding two n × n matrices takes n² additions — linear, not quadratic, because the input itself has n² entries.'},
  {p:'This matters most for number problems, where size is the bit count k = ⌈log(n+1)⌉. Brute-force primality testing is O(√n), and since n ≈ 2ᵏ that is O(2^(k/2)) — exponential.'},
  {nt:'Same operations, different size',b:'Algorithm first takes an array A[1..n] with A[j] = j: size n, time Θ(n). Algorithm second takes just the number n: size k bits, time Θ(n) = Θ(2ᵏ), exponential. Both do exactly the same elementary operations; only the measure of input size differs.'}]]},

{group:'Recursion',id:'recurrences',title:'Writing Recurrences',tagline:'Divide, conquer, combine — and the cost is the recursive calls plus everything outside them.',cols:[
 [{p:'A recursive algorithm calls itself on smaller inputs, so its running time is a recurrence: T(n) written in terms of T on smaller inputs. Divide-and-conquer has three steps: divide the input into p parts, conquer with p recursive calls (down to a base size, usually 1), and combine the results.'}],
 [{table:{title:'Recurrence = recursive cost + outside cost',head:['Algorithm','Recurrence','Why'],th:true,rows:[
   ['Factorial','T(n) = T(n−1) + c','One call plus a multiplication'],
   ['Merge Sort','T(n) = 2T(n/2) + n','Two half-size calls plus a Θ(n) merge'],
   ['Binary Search (recursive)','T(n) = T(n/2) + 1','Searches only one half']]}}]]},

{group:'Recursion',id:'expansion',title:'Solving by Expansion',tagline:'Substitute the recurrence into itself until the pattern is clear.',cols:[
 [{p:'Substitute the recurrence into itself until a pattern appears, then stop at T(1).'},
  {formula:'Binary search, n = 2ᵏ: T(n) = T(n/2) + 1 = T(n/4) + 2 = … = T(1) + k, so Θ(log n).'},
  {formula:'Merge sort: T(n) = 2T(n/2) + n = 4T(n/4) + 2n = … = n·T(1) + n·log n, so Θ(n log n): log n levels costing n each.'}],
 [{formula:'Factorial: T(n) = c·n, so Θ(n).'},
  {key:'Use expansion whenever the recurrence doesn’t fit the Master Theorem’s form a·T(n/b) + f(n) — for example T(n) = T(n−1) + n.'}]]},

{group:'Recursion',id:'master',title:'The Master Theorem',tagline:'Solve T(n) = a·T(n/b) + f(n) by comparing f(n) to n^(log_b a).',cols:[
 [{sub:'Simple version'},{p:'For T(n) = a·T(n/b) + f(n) with a ≥ 1, b > 1: compute n^(log_b a) and compare it to f(n).'},
  {table:{head:['Case','Condition','Result'],th:true,rows:[
    ['1','f(n) is polynomially smaller','T(n) = Θ(n^(log_b a))'],
    ['2','f(n) is the same order','T(n) = Θ(n^(log_b a) · log n)'],
    ['3','f(n) is polynomially larger (needs a·f(n/b) ≤ c·f(n), c < 1)','T(n) = Θ(f(n))']]}},
  {table:{title:'Worked examples',head:['Recurrence','a, b, f','n^(log_b a)','Result'],th:true,rows:[
    ['Merge sort: 2T(n/2) + n','a=2, b=2, f=n','n','matches f ⇒ Θ(n log n)'],
    ['Binary search: T(n/2) + 1','a=1, b=2, f=1','1','matches f ⇒ Θ(log n)']]}}],
 [{sub:'Version with log factors'},{p:'Solves T(n) = a·T(n/b) + f(n) where f(n) = Θ(nᵏ · logᵖ n). Compute log_b a and compare it with k.'},
  {table:{head:['Case','Condition','Result'],th:true,rows:[
    ['1','log_b a > k','T(n) = Θ(n^(log_b a))'],
    ['2','log_b a = k, p > −1','T(n) = Θ(nᵏ · log^(p+1) n)'],
    ['2','log_b a = k, p = −1','T(n) = Θ(nᵏ · log log n)'],
    ['2','log_b a = k, p < −1','T(n) = Θ(nᵏ)'],
    ['3','log_b a < k, p ≥ 0','T(n) = Θ(f(n)) = Θ(nᵏ · logᵖ n)'],
    ['3','log_b a < k, p < 0','T(n) = Θ(nᵏ)']]}},
  {nt:'The simple version is the special case p = 0',b:'Case 2 with p = 0 gives nᵏ · log n. The theorem only covers a·T(n/b) + f(n); for T(n) = T(n−1) + n, use expansion.'},
  {table:{title:'More worked examples',head:['Recurrence','log_b a vs k, p','Result'],th:true,rows:[
    ['4T(n/2) + n','log₂4=2 > k=1','Case 1 ⇒ Θ(n²)'],
    ['2T(n/2) + n²','log₂2=1 < k=2','Case 3 ⇒ Θ(n²)'],
    ['2T(n/2) + n/log n','log₂2=1=k, p=−1','Case 2 ⇒ Θ(n log log n)']]}}]]},

{group:'Recursion',id:'quicksort-recurrence',title:'Quick Sort’s Running Time',tagline:'One recurrence, three very different answers depending on where the pivot lands.',cols:[
 [{p:'Split uses A[low] as the pivot, moves elements ≤ pivot left and places the pivot in its final position: exactly n − 1 comparisons, Θ(n). Quick Sort then recurses on each side.'},
  {table:{head:['Case','Recurrence','Result'],th:true,rows:[
    ['Worst (pivot lands at one end, e.g. sorted input)','T(n) = T(n−1) + (n−1)','n(n−1)/2 = Θ(n²)'],
    ['Best (pivot lands in the middle)','T(n) = 2T(n/2) + n−1','Θ(n log n)']]}}],
 [{p:'Average case: distinct elements, all permutations equally likely, so the pivot lands at each position with probability 1/n.'},
  {formula:'C(n) = (n−1) + (2/n)·Σ C(i) for i = 0 to n−1, which solves to about 2n ln n, so Θ(n log n).'},
  {key:'Sorting algorithms compared: selection sort is Θ(n²) in every case, constant space. Insertion and bubble sort are Θ(n) best, Θ(n²) average/worst, constant space. Merge sort is Θ(n log n) in every case with Θ(n) extra space. Quick sort is Θ(n log n) best/average and Θ(n²) worst; it sorts in place and is usually fastest in practice, though its recursion stack can reach O(n). Heap sort is Θ(n log n) in every case with constant space (its card is a stub until it is covered in class). Radix sort is Θ(kn) for k-digit numbers with Θ(n) space; it isn’t comparison-based, so the n log n lower bound doesn’t apply.'}]]},
];
