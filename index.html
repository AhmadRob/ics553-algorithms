<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICS 553 Algorithms, Visualized</title>
<meta name="description" content="KFUPM ICS 553 notes by Ahmed Abualrob: searching and sorting algorithms with step-by-step visualizers, pseudocode and complexity.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FAFAFA;--ink:#0A0A0A;--muted:#666;--line:rgba(10,10,10,.1);
  --glass:rgba(255,255,255,.4);--glass-strong:rgba(255,255,255,.6);
  --gb:rgba(0,0,0,.05);--gb-strong:rgba(0,0,0,.08);
  --blob:rgba(255,255,255,.8);--hover:rgba(0,0,0,.05);
  --bar:rgba(10,10,10,.1);--bar-line:rgba(10,10,10,.28);--bar-mid:rgba(10,10,10,.38);
  --inv:#FAFAFA;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A;--ink:#FAFAFA;--muted:#9A9A9A;--line:rgba(250,250,250,.12);
    --glass:rgba(255,255,255,.04);--glass-strong:rgba(255,255,255,.07);
    --gb:rgba(255,255,255,.08);--gb-strong:rgba(255,255,255,.14);
    --blob:rgba(255,255,255,.07);--hover:rgba(255,255,255,.08);
    --bar:rgba(250,250,250,.12);--bar-line:rgba(250,250,250,.3);--bar-mid:rgba(250,250,250,.4);
    --inv:#0A0A0A;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A;--ink:#FAFAFA;--muted:#9A9A9A;--line:rgba(250,250,250,.12);
  --glass:rgba(255,255,255,.04);--glass-strong:rgba(255,255,255,.07);
  --gb:rgba(255,255,255,.08);--gb-strong:rgba(255,255,255,.14);
  --blob:rgba(255,255,255,.07);--hover:rgba(255,255,255,.08);
  --bar:rgba(250,250,250,.12);--bar-line:rgba(250,250,250,.3);--bar-mid:rgba(250,250,250,.4);
  --inv:#0A0A0A;color-scheme:dark;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:88px}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;background:var(--bg);color:var(--ink)}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.container{position:relative;background:var(--bg);min-height:100vh}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}

.glass-layer{background:var(--glass);border:1px solid var(--gb)}
.glass-layer-strong{background:var(--glass-strong);border:1px solid var(--gb-strong)}
.panel{background:var(--glass);border:1px solid var(--gb)}

.text-fluid-xl{font-size:clamp(3rem,8vw,9rem);line-height:.9;font-weight:900;letter-spacing:-.04em;color:var(--ink);transform-origin:left top}
.text-fluid-md{font-size:clamp(1.5rem,3vw,2.5rem);line-height:1.2;font-weight:700;letter-spacing:-.02em;color:var(--ink)}

.scroll-indicator{position:fixed;left:40px;top:0;width:2px;height:100vh;background:var(--gb);z-index:1000;display:none}
.scroll-progress{position:absolute;top:0;left:0;width:100%;height:100%;background:var(--ink);transform:scaleY(0);transform-origin:top;will-change:transform}
.liquid-blob{position:fixed;left:0;top:0;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,var(--blob) 0%,rgba(255,255,255,0) 70%);pointer-events:none;z-index:0;transform:translate3d(-999px,-999px,0);will-change:transform}

.hero-section{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.hero-content{max-width:1280px;width:100%}
.subtitle-glass{display:inline-block;padding:16px 32px;margin:32px 0;font-size:1.125rem;font-weight:500;color:var(--ink);border-radius:4px}
.contact-links{display:flex;flex-wrap:wrap;gap:24px;font-size:.875rem;color:var(--muted)}
.contact-links a{color:var(--muted);text-decoration:none;transition:color .3s}
.contact-links a:hover{color:var(--ink)}

.index{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:12px;z-index:60;width:min(1120px,calc(100% - 24px));margin:0 auto;padding:6px;border-radius:999px;display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
.index::-webkit-scrollbar{display:none}
.index a,.index button{flex:0 0 auto;font:500 12px 'JetBrains Mono',monospace;color:var(--muted);text-decoration:none;padding:8px 14px;border-radius:999px;border:0;background:none;cursor:pointer;transition:all .3s}
.index a:hover,.index button:hover{color:var(--ink);background:var(--hover)}
.index a.on{background:var(--ink);color:var(--inv)}
.index #theme{padding:8px 10px;display:grid;place-items:center;margin-left:auto}
.index .sep{flex:0 0 1px;height:16px;background:var(--line);margin:0 4px}

main{position:relative;z-index:1}
.section{position:relative;padding:96px 24px 32px;max-width:1280px;margin:0 auto}
.sec-head{margin-bottom:48px;max-width:640px}
.sec-head p{color:var(--muted);line-height:1.6;margin-top:12px}

.project-type{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);margin-bottom:8px}
.card-header{display:flex;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px}
.card-title{font-size:1.875rem;font-weight:700;color:var(--ink);margin-bottom:8px;letter-spacing:-.02em}
.card-subtitle{font-size:1.125rem;color:var(--muted)}

.def{padding:48px;margin-bottom:32px}
.def p{font-size:clamp(1.15rem,2vw,1.6rem);line-height:1.5;font-weight:500;letter-spacing:-.01em;max-width:880px}
.props{display:grid;grid-template-columns:1fr;gap:24px;margin-bottom:32px}
.prop{padding:32px}
.prop h3{font-size:1.25rem;font-weight:700;margin-bottom:12px}
.prop p{color:var(--muted);line-height:1.6;font-size:.95rem}
.notation{padding:32px;display:grid;grid-template-columns:1fr;gap:24px}
.notation .sym{font-size:2.5rem;font-weight:900;letter-spacing:-.03em;line-height:1}
.notation h3{font-size:1rem;font-weight:700;margin:12px 0 6px}
.notation p{color:var(--muted);font-size:.9rem;line-height:1.55}

.algo{padding:48px;margin-bottom:48px;border-radius:2px}
.io{font-size:.8rem;color:var(--muted);line-height:1.7;max-width:420px}
.io b{color:var(--ink);font-weight:500;margin-right:8px}

.viz{margin-bottom:40px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.presets,.inputs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:500 13px 'JetBrains Mono',monospace;padding:8px 16px;border-radius:999px;border:1px solid var(--gb-strong);background:var(--glass-strong);color:var(--ink);cursor:pointer;transition:all .3s}
.btn:hover{background:var(--ink);color:var(--inv)}
.btn.solid{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.btn.solid:hover{opacity:.8}
.btn[disabled]{opacity:.35;pointer-events:none}
.lab{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);display:flex;align-items:center;gap:8px}
.in{font:400 13px 'JetBrains Mono',monospace;padding:8px 12px;border-radius:12px;border:1px solid var(--gb-strong);background:var(--glass-strong);color:var(--ink);min-width:0}
.in.arr{width:min(320px,62vw)}
.in.x{width:72px}
.hint{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);min-height:1.2em;margin-bottom:8px}
.viz-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.stage{padding:24px;border-radius:4px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:32px;margin-bottom:16px}
.chip{font:500 12px 'JetBrains Mono',monospace;padding:5px 12px;border-radius:999px;border:1px solid var(--gb-strong);background:var(--glass)}
.chip i{font-style:normal;color:var(--muted);margin-right:8px}
.chip.stat{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.chip.stat i{color:inherit;opacity:.65}
.board{overflow-x:auto;padding-bottom:6px;min-height:250px}
.cells{display:flex;gap:6px;align-items:flex-end;width:max-content;max-width:none;margin:0 auto;padding:0 4px}
.cell{flex:0 0 42px;display:flex;flex-direction:column;align-items:stretch;text-align:center;transition:opacity .25s}
.cell .val{font:500 12px 'JetBrains Mono',monospace;height:22px;line-height:22px}
.cell .bar{transition:height .25s,background .25s}
.cell .idx{font:400 11px 'JetBrains Mono',monospace;color:var(--muted);margin-top:6px}
.cell .ptr{font:500 10px 'JetBrains Mono',monospace;line-height:1.25;min-height:54px;padding-top:2px;white-space:nowrap}

.bar,.sw{background:var(--bar);border:1px solid var(--bar-line);border-radius:6px 6px 2px 2px}
.cell.cmp .bar,.sw.cmp{background:var(--ink);border-color:var(--ink)}
.cell.swap .bar,.sw.swap{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px);border-color:var(--ink)}
.cell.found .bar,.sw.found{background:var(--ink);border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.cell.min .bar,.sw.min,.cell.pivot .bar,.sw.pivot,.cell.key .bar,.sw.key{background:var(--bar-mid);border:2px solid var(--ink)}
.cell.sorted .bar,.sw.sorted{background:transparent;border:2px solid var(--ink)}
.cell.le .bar,.sw.le,.cell.runL .bar,.sw.runL{background:var(--bar-mid);border-color:var(--bar-line)}
.cell.runR .bar,.sw.runR{background:repeating-linear-gradient(135deg,var(--bar-mid) 0 3px,transparent 3px 6px);border-color:var(--bar-line)}
.cell.dim{opacity:.22}
.sw.dim{opacity:.25}
.cell.hole .bar,.sw.hole{background:transparent;border:1.5px dashed var(--bar-line)}
.cell.cmp .val,.cell.found .val,.cell.swap .val,.cell.min .val,.cell.pivot .val,.cell.key .val{font-weight:700}

.aux{margin-top:18px}
.aux-lab{font:500 11px 'JetBrains Mono',monospace;color:var(--muted);margin:14px 4px 6px;text-align:center}
.abox .box{height:36px;display:grid;place-items:center;font:500 12px 'JetBrains Mono',monospace;border:1.5px dashed var(--bar-line);border-radius:6px}
.abox.swap .box{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px);border:1.5px solid var(--ink);font-weight:700;background-color:var(--bg)}
.abox.sorted .box{border:2px solid var(--ink)}
.abox .ptr{min-height:22px}

.note{font-size:.95rem;line-height:1.55;min-height:4.4em;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.extra:empty{display:none}
.extra{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.tree-cap{font-size:11px;color:var(--muted);margin-bottom:8px}
.tree-wrap{overflow-x:auto}
.tn circle{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.tn text{fill:var(--ink);font:500 10px 'JetBrains Mono',monospace}
.tn.vis circle{fill:var(--ink)}
.tn.vis text{fill:var(--inv)}
.tn.cur circle{stroke-width:3.5}
.te{stroke:var(--bar-line);stroke-width:1.2}
.te.on{stroke:var(--ink);stroke-width:2.2}

.code{padding:20px;border-radius:4px;font:400 12.5px/1.6 'JetBrains Mono',monospace;align-self:start}
.code-title{font-size:.75rem;color:var(--muted);margin-bottom:12px}
.ln{display:flex;gap:10px;padding:2px 8px;border-radius:6px;color:var(--muted);transition:background .2s,color .2s}
.ln .no{opacity:.55;min-width:18px;text-align:right}
.ln .tx{white-space:pre-wrap}
.ln.on{background:var(--ink);color:var(--inv)}
.ln.proc .tx{font-weight:500}

.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.ctl input[type=range]{flex:1 1 180px;accent-color:var(--ink);min-width:120px}
.ctl select{font:500 12px 'JetBrains Mono',monospace;padding:8px 30px 8px 14px;border-radius:999px;border:1px solid var(--gb-strong);color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none;
  background-color:var(--glass-strong);
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;transition:all .3s}
.ctl select:hover{background-color:var(--hover)}
select option{background:var(--bg);color:var(--ink)}
.count{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);min-width:64px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px;font:400 12px 'JetBrains Mono',monospace;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:8px}
.sw{width:16px;height:16px;border-radius:4px;display:inline-block}

.rx{display:flex;flex-direction:column;gap:14px}
.rx-row{display:flex;gap:12px;align-items:center}
.rx-lab{font:500 12px 'JetBrains Mono',monospace;color:var(--muted);min-width:14px}
.rx-list{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;align-items:center}
.rx-empty{font:400 12px 'JetBrains Mono',monospace;color:var(--muted)}
.rx-cur{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);display:flex;gap:10px;align-items:center;min-height:34px}
.nchip{font:500 13px 'JetBrains Mono',monospace;padding:5px 9px;border-radius:8px;border:1px solid var(--bar-line);background:var(--bar);display:inline-block}
.nchip.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.nchip .lz{opacity:.35}
.nchip .dg.hi{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px;font-weight:700}
.rx-buckets{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.rx-b{border:1px solid var(--bar-line);border-radius:8px;padding:8px;min-height:74px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.rx-b.on{border:2px solid var(--ink)}
.rx-h{font:500 11px 'JetBrains Mono',monospace;color:var(--muted)}
.rx-b .nchip{font-size:12px;padding:4px 7px}

.algo-text{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;border-top:1px solid var(--line);padding-top:32px}
.algo-text h4{font-size:.75rem;font-family:'JetBrains Mono',monospace;color:var(--muted);font-weight:500;margin-bottom:12px}
.algo-text p{line-height:1.65;color:var(--ink);margin-bottom:16px;max-width:64ch}
.key{padding:20px 24px;border-radius:4px;margin-bottom:16px}
.key p{margin:0;font-weight:500}
.nt{margin-bottom:16px}
.nt b{display:block;margin-bottom:4px;font-weight:700}
.nt span{color:var(--muted);line-height:1.6;display:block;max-width:64ch}
.tbl-wrap{overflow-x:auto;margin-bottom:24px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font:500 12px 'JetBrains Mono',monospace;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
td.th{font:500 13px 'JetBrains Mono',monospace;min-width:96px}
td.mn{color:var(--muted)}
.tbl-title{font-weight:700;margin-bottom:8px}
.todo{padding:32px;border-radius:4px;border-style:dashed;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.9rem}
.algo.later{opacity:.6}

.cheat{padding:32px;border-radius:2px;margin-bottom:32px}
.grow{padding:32px;border-radius:2px}
.grow input[type=range]{width:100%;accent-color:var(--ink);margin:16px 0 24px}
.g-row{display:grid;grid-template-columns:90px 1fr 120px;gap:16px;align-items:center;margin-bottom:12px;font:500 13px 'JetBrains Mono',monospace}
.g-bar{height:12px;border-radius:6px;background:var(--bar);overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .2s}
.g-val{text-align:right}
.g-cap{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);margin-top:16px}

.footer{position:relative;z-index:1;padding:80px 24px;border-top:1px solid var(--line);text-align:center;margin-top:64px}
.footer-text{color:var(--muted);font:400 .875rem 'JetBrains Mono',monospace;margin-bottom:16px}

@media (min-width:768px){
  .scroll-indicator{display:block}
  .section{padding:96px 80px 32px}
  .index{width:min(1120px,calc(100% - 160px))}
  .hero-section{padding:80px}
  .subtitle-glass{font-size:1.25rem}
  .contact-links{font-size:1rem}
  .props{grid-template-columns:repeat(2,1fr)}
  .notation{grid-template-columns:repeat(3,1fr)}
  .rx-buckets{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (min-width:1000px){
  .viz-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .algo-text{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .props{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:767px){
  .algo,.def{padding:24px}
  .cheat,.grow{padding:20px}
  .g-row{grid-template-columns:64px 1fr 84px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .liquid-blob{display:none}
}
</style>

<body>
<div class="container">
  <div class="scroll-indicator"><div class="scroll-progress" id="prog"></div></div>
  <div class="liquid-blob" id="blob"></div>

  <section class="hero-section">
    <div class="hero-content">
      <div class="text-fluid-xl" id="heroTitle">ICS 553<br>Algorithms</div>
      <div class="glass-layer subtitle-glass">Step-by-step visualizers, pseudocode and complexity in one place</div>
      <div class="contact-links mono">
        <a href="#foundations">Start reading</a>
        <a href="#linear">Jump to the visualizers</a>
        <a href="#cheat">Complexity cheat sheet</a>
      </div>
    </div>
  </section>

  <nav class="glass-layer-strong index" id="index" aria-label="Sections"></nav>
  <main id="app"></main>

  <footer class="footer">
    <p class="footer-text">KFUPM ICS 553 notes by Ahmed Abualrob</p>
    <p style="color:var(--muted);font-size:.875rem">Designed with liquid glass and monochrome precision</p>
  </footer>
</div>

<script>
/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rnd=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
const randArr=(n,lo,hi)=>{const s=new Set();while(s.size<n)s.add(rnd(lo,hi));return [...s];};
const asc=a=>a.slice().sort((x,y)=>x-y);
const desc=a=>a.slice().sort((x,y)=>y-x);
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r;};
function P(...args){const p={};for(let i=0;i<args.length;i+=2){const ix=args[i],lb=args[i+1];if(ix==null||ix<0)continue;p[ix]=p[ix]?p[ix]+','+lb:lb;}return p;}
const allMark=(n,c)=>{const m={};for(let i=0;i<n;i++)m[i]=c;return m;};

/* ---------- frame generators (each returns an array of frames) ---------- */
function genLinear({arr:a,x}){
  const n=a.length,F=[];let cmp=0;
  const push=o=>F.push({arr:a.slice(),marks:{},ptr:{},vars:{},line:[],note:'',...o,stats:{comparisons:cmp}});
  push({line:[1],ptr:P(0,'j'),vars:{x,j:1,n},note:`j ← 1. Looking for x = ${x}.`});
  let j=0,matched=false;
  while(true){
    if(j<n-1){
      cmp++;matched=a[j]===x;
      push({line:[2],ptr:P(j,'j'),marks:{[j]:matched?'found':'cmp'},vars:{x,j:j+1,n},
        note:`j < n holds and x ${matched?'=':'≠'} A[${j+1}] = ${a[j]}. ${matched?'x found, the loop stops.':'Keep going.'}`});
      if(matched)break;
      j++;
      push({line:[3],ptr:P(j,'j'),vars:{x,j:j+1,n},note:`j ← j + 1 = ${j+1}`});
    }else{
      push({line:[2],ptr:P(j,'j'),vars:{x,j:j+1,n},note:`j = n, so the loop condition fails. The last element still needs a check in line 5.`});
      break;
    }
  }
  if(!matched)cmp++;
  const hit=a[j]===x;
  push({line:[5],ptr:P(j,'j'),marks:hit?{[j]:'found'}:allMark(n,'dim'),vars:{x,j:j+1,n},
    note:hit?`x = A[${j+1}], so return ${j+1}.`:`x ≠ A[${j+1}] and nothing is left. Return 0 (not found).`});
  return F;
}

function genBinary({arr:a,x}){
  const n=a.length,F=[];let low=0,high=n-1,j=-1,cmp=0;const visited=[];
  const dim=()=>{const m={};for(let i=0;i<n;i++)if(i<low||i>high)m[i]='dim';return m;};
  const push=o=>F.push({arr:a.slice(),marks:{},ptr:{},vars:{},line:[],note:'',visited:visited.slice(),cur:null,...o,stats:{comparisons:cmp}});
  const V=()=>({x,low:low+1,high:high+1,j:j+1});

function genMerge({arr:a,q}){

      note:`Compare A[s] = ${a[s]} with A[t] = ${a[t]}: ${left?'A[s] ≤ A[t]':'A[s] > A[t]'}, so the smaller one, ${left?a[s]:a[t]}, goes next.`});

function mergeSim(a,p,q,r){

  while(s<=q)B.push(a[s++]);
  while(t<=r)B.push(a[t++]);
  for(let k=0;k<B.length;k++)a[p+k]=B[k];
  return c;
}
function genBottomUp({arr}){

  push({line:[1],vars:{t:1,n},note:`t ← 1. Every single element is already a sorted run of size 1.`});
  let t=1;
  while(t<n){
    const s=t;t=2*s;let i=0;const done=[];
    const dm=()=>{const m={};done.forEach(([p,r])=>{for(let x=p;x<=r;x++)m[x]='sorted';});return m;};
    const shade={};for(let x=0;x<n;x++)shade[x]=Math.floor(x/s)%2===0?'runL':'runR';
    push({line:[2,3],vars:{s,t,n},marks:shade,note:`New pass: s = ${s}, t = ${t}. Merge neighbouring runs of size ${s} into runs of size ${t}.`});
    const doMerge=(p,q,r,ln)=>{

      push({line:ln,vars:{s,t,p,q,r},marks:m1,note:`merge(A, ${p}, ${q}, ${r}): merge A[${p}..${q}] with A[${q+1}..${r}].`});
      cmp+=mergeSim(a,p-1,q-1,r-1);asg+=2*(r-p+1);done.push([p-1,r-1]);

    };
    while(i+t<=n){doMerge(i+1,i+s,i+t,[4,5,6]);i+=t;}
    if(i+s<n)doMerge(i+1,i+s,n,[8]);

  push({line:[9],marks:allMark(n,'sorted'),vars:{t,n},note:`t = ${t} ≥ n, so a single run remains: the array is sorted. Comparisons ${cmp}, assignments ${asg}.`});
  return F;
}

function genSelection({arr}){
  const a=arr.slice(),n=a.length,F=[];let cmp=0,sw=0;
  const push=o=>F.push({arr:a.slice(),marks:{},ptr:{},vars:{},line:[],note:'',...o,stats:{comparisons:cmp,interchanges:sw}});

  for(let i=0;i<n-1;i++){

    push({line:[1,2],marks:{...pre(),[i]:'min'},ptr:P(i,'i,k'),vars:{i:i+1,k:k+1},note:`i = ${i+1}. Assume A[${i+1}] = ${a[i]} is the smallest so far (k ← i).`});

function genInsertion({arr}){

  const push=o=>F.push({arr:view.slice(),marks:{},ptr:{},vars:{},line:[],note:'',...o,stats:{comparisons:cmp,shifts:mv}});

function genBubble({arr}){
  const a=arr.slice(),n=a.length,F=[];let cmp=0,sw=0;

 notes:[{t:'Why Θ(log n)?',b:'Each iteration cuts the problem from n to n/2 to n/4 and so on down to 1. Solving n/2ᵏ = 1 gives k = log₂ n.'},{t:'Exercise: maximum comparisons',b:'⌊log₂ n⌋ + 1. Each comparison halves the remaining elements, so about log₂ n comparisons are needed, and the + 1 accounts for the final comparison.'},{t:'Theorem 1.1',b:'The number of comparisons performed by binarysearch on a sorted array of size n is at most ⌊log n⌋ + 1.'}],

{id:'merge',short:'Merge',group:'Sorting',tag:'Algorithm 1.3',name:'Merge',tagline:'Combine two sorted lists into one. The core step of Merge Sort.',
 io:['A[1..m] and indices p ≤ q < r, with A[p..q] and A[q+1..r] each sorted','A[p..r] holds the merged, sorted result'],

{id:'bottomup',short:'Bottom-up',group:'Sorting',tag:'Algorithm 1.6',name:'Bottom-Up Merge Sort',tagline:'Merge runs of size 1, then 2, then 4, doubling until one run remains.',
 io:['An array A[1..n] of n elements','A[1..n] sorted in nondecreasing order'],
 what:`Bottom-Up Merge Sort first treats every element as a sorted sequence of size 1. It then repeatedly merges neighbouring sequences, doubling their size each round: 1 → 2 → 4 → 8 … until the whole array is sorted. Unlike recursive Merge Sort it works iteratively from the bottom up. The Merge algorithm above is the main operation at every level.`,

{id:'selection',short:'Selection',group:'Sorting',tag:'Algorithm 1.4',name:'Selection Sort',tagline:'Repeatedly pick the smallest remaining element.',

{id:'radix',short:'Radix',group:'Sorting',tag:'Algorithm 4.5',name:'Radix Sort',tagline:'Sort digit by digit, starting from the least significant one.',

{id:'quick',short:'Quick',group:'Sorting',tag:'Algorithms 5.5 and 5.6',name:'Quick Sort',tagline:'Split around a pivot, then sort each side recursively.',

/* ---------- viz engine ---------- */
function fmtNum(v,k,hj){
  const s=String(v).padStart(k,'0'),lead=k-String(v).length;
  return s.split('').map((d,ix)=>{const pos=k-ix;return `<span class="dg${pos===hj?' hi':''}${ix<lead?' lz':''}">${d}</span>`;}).join('');
}
function renderRadix(f){
  const k=f.k,hj=f.hj;
  let h='<div class="rx"><div class="rx-row"><b class="rx-lab">L</b><div class="rx-list">';
  h+=f.list.length?f.list.map(v=>`<span class="nchip">${fmtNum(v,k,hj)}</span>`).join(''):'<span class="rx-empty">empty</span>';
  h+='</div></div>';
  h+=`<div class="rx-cur">${f.cur!=null?`<b>a</b> ← <span class="nchip on">${fmtNum(f.cur,k,hj)}</span> digit ${f.j} = ${f.curDigit}`:''}</div>`;
  h+='<div class="rx-buckets">'+f.buckets.map((b,i)=>`<div class="rx-b${f.cur!=null&&f.curDigit===i?' on':''}"><div class="rx-h">L${i}</div>${b.map(v=>`<span class="nchip">${fmtNum(v,k,hj)}</span>`).join('')}</div>`).join('')+'</div></div>';
  return h;
}
function renderBoard(f){
  if(f.radix)return renderRadix(f);
  const arr=f.arr,max=Math.max(...arr.filter(v=>v!=null),1);
  let h='<div class="cells">';
  arr.forEach((v,i)=>{
    const hole=v==null,c=f.marks[i]||'';
    const bh=hole?28:16+Math.round(v/max*100);
    const p=f.ptr[i]?'▲<br>'+f.ptr[i].split(',').map(esc).join('<br>'):'';
    h+=`<div class="cell ${hole?'hole':''} ${c}"><div class="val">${hole?'':v}</div><div class="bar" style="height:${bh}px"></div><div class="idx">${i+1}</div><div class="ptr">${p}</div></div>`;
  });
  h+='</div>';
  if(f.aux){
    h+='<div class="aux-lab">B (auxiliary array)</div><div class="cells aux">';
    f.aux.forEach((v,i)=>{
      const p=f.auxPtr[i]?'▲ '+esc(f.auxPtr[i]):'';
      h+=`<div class="cell abox ${f.auxMarks[i]||''}"><div class="box">${v==null?'':v}</div><div class="idx">${i+1}</div><div class="ptr">${p}</div></div>`;
    });
    h+='</div>';
  }
  return h;
}
function parseNums(s,lo,hi){
  const t=s.split(/[\s,;]+/).filter(Boolean).map(Number);
  if(!t.length||t.some(v=>!Number.isInteger(v)||v<lo||v>hi))return null;
  return t;
}
function buildViz(host,cfg){
  const st={arr:cfg.arr.slice(),x:cfg.x,q:cfg.q,frames:[],i:0,timer:null,speed:1};
  const maxVal=cfg.maxVal||99,maxLen=cfg.maxLen||12;
  host.innerHTML=`
   <div class="tools">
     <div class="presets">${(cfg.presets||[]).map((p,i)=>`<button class="btn" data-p="${i}">${esc(p.l)}</button>`).join('')}</div>
     <div class="inputs">
       <label class="lab">${cfg.merge?'A (two runs split by |)':'A'} <input class="in arr" aria-label="Array values" spellcheck="false"></label>
       ${cfg.needsX?'<label class="lab">x <input class="in x" type="number" aria-label="Search value x"></label>':''}
       <button class="btn solid" data-a="apply">Run</button>
     </div>
   </div>
   <div class="hint" role="status"></div>
   <div class="viz-grid">
     <div class="stage glass-layer-strong">
       <div class="chips"></div>
       <div class="board"></div>
       <div class="extra"></div>
       <div class="note" aria-live="polite"></div>
     </div>
     <div class="code panel"><div class="code-title">Pseudocode</div>${cfg.pseudoHtml}</div>
   </div>
   <div class="ctl">
     <button class="btn" data-a="reset">Reset</button>
     <button class="btn" data-a="back">Back</button>
     <button class="btn solid" data-a="play">Play</button>
     <button class="btn" data-a="next">Step</button>
     <input type="range" min="0" value="0" aria-label="Step position">
     <select aria-label="Speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option></select>
     <span class="count"></span>
   </div>
   <div class="legend">${(cfg.legend||[]).map(([c,l])=>`<span class="lg">${c?`<i class="sw ${c}"></i>`:''}${esc(l)}</span>`).join('')}</div>`;
  const $=s=>host.querySelector(s);
  const inArr=$('.in.arr'),inX=$('.in.x'),hint=$('.hint'),range=$('input[type=range]'),playBtn=$('[data-a=play]');
  const chipsEl=$('.chips'),boardEl=$('.board'),noteEl=$('.note'),extraEl=$('.extra'),countEl=$('.count');
  const lines=host.querySelectorAll('.ln');

  function syncInputs(){
    inArr.value=cfg.merge?st.arr.slice(0,st.q).join(', ')+' | '+st.arr.slice(st.q).join(', '):st.arr.join(', ');
    if(inX)inX.value=st.x;
  }
  function render(){
    const f=st.frames[st.i];
    const vars=Object.entries(f.vars||{}).map(([k,v])=>`<span class="chip"><i>${esc(k)}</i>${esc(v)}</span>`).join('');
    const stats=Object.entries(f.stats||{}).map(([k,v])=>`<span class="chip stat"><i>${esc(k)}</i>${esc(v)}</span>`).join('');
    chipsEl.innerHTML=vars+stats;
    boardEl.innerHTML=renderBoard(f);
    noteEl.textContent=f.note||'';
    lines.forEach(l=>l.classList.toggle('on',(f.line||[]).includes(+l.dataset.n)));
    if(cfg.extra)cfg.extra(extraEl,f,st);
    range.max=st.frames.length-1;range.value=st.i;
    countEl.textContent=`${st.i+1} / ${st.frames.length}`;
  }
  function stop(){clearTimeout(st.timer);st.timer=null;playBtn.textContent='Play';}
  function tick(){
    clearTimeout(st.timer);
    st.timer=setTimeout(()=>{if(st.i<st.frames.length-1){st.i++;render();tick();}else stop();},900/st.speed);
  }
  function play(){
    if(st.timer){stop();return;}
    if(st.i>=st.frames.length-1){st.i=0;render();}
    playBtn.textContent='Pause';tick();
  }
  function run(){stop();st.frames=cfg.gen(st);st.i=0;syncInputs();hint.textContent='';render();}
  function apply(){
    let ok=true,msg=`Enter 2 to ${maxLen} whole numbers between 0 and ${maxVal}, separated by commas.`;
    if(cfg.merge){
      const parts=inArr.value.split('|');
      if(parts.length===2){
        const l=parseNums(parts[0],0,maxVal),r=parseNums(parts[1],0,maxVal);
        if(!l||!r||l.length+r.length>maxLen)ok=false;else{st.arr=[...asc(l),...asc(r)];st.q=l.length;}
      }else{
        const t=parseNums(inArr.value,0,maxVal);
        if(!t||t.length<2||t.length>maxLen)ok=false;else{const h=t.length>>1;st.arr=[...asc(t.slice(0,h)),...asc(t.slice(h))];st.q=h;}
      }
      if(ok)msg='';else msg='Enter two groups of whole numbers split by |, for example 2, 5, 8 | 1, 4, 6. Each group is sorted for you.';
    }else{
      const t=parseNums(inArr.value,0,maxVal);
      if(!t||t.length<2||t.length>maxLen)ok=false;else st.arr=cfg.sortedInput?asc(t):t;
    }
    if(ok&&inX){const v=Number(inX.value);if(inX.value===''||!Number.isFinite(v)){ok=false;msg='Enter a number for x.';}else st.x=v;}
    if(!ok){hint.textContent=msg;return;}
    run();
  }
  host.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.p!=null){cfg.presets[+b.dataset.p].f(st);run();return;}
    const a=b.dataset.a;
    if(a==='apply')apply();
    else if(a==='play')play();
    else if(a==='next'){stop();if(st.i<st.frames.length-1){st.i++;render();}}
    else if(a==='back'){stop();if(st.i>0){st.i--;render();}}
    else if(a==='reset'){stop();st.i=0;render();}
  });
  host.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='range')apply();});
  range.addEventListener('input',()=>{stop();st.i=+range.value;render();});
  $('select').addEventListener('change',e=>{st.speed=+e.target.value;if(st.timer)tick();});
  run();
}

/* ---------- page ---------- */
function pseudoHtml(lines){
  return lines.map(([ind,t],i)=>`<div class="ln${/^procedure/.test(t)?' proc':''}" data-n="${i+1}"><span class="no">${i+1}</span><span class="tx" style="padding-left:${ind*16}px">${esc(t)}</span></div>`).join('');
}
function tableHtml(head,rows,cls){
  return `<div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i===1&&cls?'th':(i===2?'mn':'')}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function cheatHtml(){
  const head=['Algorithm','Best','Average','Worst','Space','Note'];
  return `<div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${ALGOS.map(a=>`<tr><td><b>${esc(a.name)}</b></td>${a.sum.slice(0,4).map(c=>`<td class="th">${esc(c)}</td>`).join('')}<td class="mn">${esc(a.sum[4])}</td></tr>`).join('')}</tbody></table></div>`;
}
function algoHtml(a){
  const head=`<div class="card-header"><div><div class="project-type">${esc(a.tag)}</div><h3 class="card-title">${esc(a.name)}</h3><p class="card-subtitle">${esc(a.tagline)}</p></div>${a.io?`<div class="io mono"><div><b>Input</b>${esc(a.io[0])}</div><div><b>Output</b>${esc(a.io[1])}</div></div>`:''}</div>`;
  if(a.later)return `<article class="glass-layer-strong algo later" id="${a.id}">${head}<div class="glass-layer todo">Notes not written yet. Add this once it is covered in class.</div></article>`;
  const cx=a.cx.length?`<h4>Complexity</h4>${tableHtml(['Measure','Cost','Why'],a.cx,true)}`:'';
  const tabs=(a.tables||[]).map(t=>`<div class="tbl-title">${esc(t.title)}</div>${tableHtml(t.head,t.rows,false)}`).join('');
  const notes=(a.notes||[]).map(n=>`<div class="nt"><b>${esc(n.t)}</b><span>${esc(n.b)}</span></div>`).join('');
  return `<article class="glass-layer-strong algo" id="${a.id}">${head}
    <div class="viz" id="viz-${a.id}"></div>
    <div class="algo-text">
      <div><h4>How it works</h4><p>${esc(a.what)}</p><div class="key glass-layer"><p>${esc(a.key)}</p></div>${notes}</div>
      <div>${cx}${tabs}</div>
    </div></article>`;
}
function secHead(id,title,sub){return `<div class="sec-head" id="${id}"><h2 class="text-fluid-md">${title}</h2>${sub?`<p>${sub}</p>`:''}</div>`;}

function renderPage(){
  const props=[['Definiteness','It must be clear what should be done.'],['Effectiveness','Each step must be such that it can, at least in principle, be carried out by a person using pencil and paper in a finite amount of time. Integer arithmetic is an example.'],['Input and output','An algorithm produces one or more outputs and may have zero or more externally supplied inputs.'],['Finiteness','It must terminate after a finite number of operations.']];
  const not=[['O','Upper bound','The running time is bounded above by this rate.'],['Ω','Lower bound','The running time is bounded below by this rate.'],['Θ','Tight bound','The running time actually grows at this rate. This is what these notes use.']];
  let h=`<section class="section" id="foundations">
    ${secHead('foundations-h','What is an algorithm?')}
    <div class="glass-layer-strong def"><p>A finite number of steps, each of which may require one or more operations, which when carried out on a set of inputs produce one or more outputs in a finite amount of time.</p></div>
    <div class="props">${props.map(p=>`<div class="glass-layer prop"><h3>${p[0]}</h3><p>${p[1]}</p></div>`).join('')}</div>
    <div class="glass-layer-strong notation">${not.map(n=>`<div><div class="sym">${n[0]}</div><h3>${n[1]}</h3><p>${n[2]}</p></div>`).join('')}</div>
  </section>`;
  const groups=[['Searching','searching','Two ways to find an element x in an array A.'],['Sorting','sorting','Merge is the building block for Merge Sort. Each sort has a live comparison counter, so try the presets and watch best and worst cases separate.']];
  groups.forEach(([g,id,sub])=>{
    h+=`<section class="section" id="${id}">${secHead(id+'-h',g,sub)}${ALGOS.filter(a=>a.group===g).map(algoHtml).join('')}</section>`;
  });
  h+=`<section class="section" id="cheat">${secHead('cheat-h','Complexity cheat sheet','Time complexity by case. Θ is the tight bound.')}
    <div class="glass-layer-strong cheat">${cheatHtml()}</div>
    <div class="glass-layer-strong grow"><h3 style="font-size:1.25rem;font-weight:700">Growth of n, log n, n log n and n²</h3>
      <input type="range" id="gn" min="2" max="1000" value="100" aria-label="Input size n">
      <div id="grows"></div><p class="g-cap">n = <span id="gnv">100</span>. Bars use a log scale so all four fit on screen.</p></div>
  </section>`;
  document.getElementById('app').innerHTML=h;

  ALGOS.forEach(a=>{
    if(!a.viz)return;
    const cfg={...a.viz,pseudoHtml:pseudoHtml(a.pseudo)};
    buildViz(document.getElementById('viz-'+a.id),cfg);
  });

  const nav=document.getElementById('index');
  nav.innerHTML=`<a href="#foundations-h" data-t="foundations">Basics</a><span class="sep"></span>`+ALGOS.map(a=>`<a href="#${a.id}" data-t="${a.id}">${a.short}</a>`).join('')+`<span class="sep"></span><a href="#cheat-h" data-t="cheat">Cheat sheet</a><button type="button" id="theme"></button>`;
  const root=document.documentElement;
  const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  const SUN='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  const themeBtn=document.getElementById('theme');
  function setIcon(){const d=isDark();themeBtn.innerHTML=d?SUN:MOON;const t=d?'Switch to light mode':'Switch to dark mode';themeBtn.setAttribute('aria-label',t);themeBtn.title=t;}
  themeBtn.onclick=()=>{root.dataset.theme=isDark()?'light':'dark';setIcon();};
  const mq=matchMedia('(prefers-color-scheme:dark)');if(mq.addEventListener)mq.addEventListener('change',setIcon);
  setIcon();

  const links=[...nav.querySelectorAll('a')];
  const targets=[document.getElementById('foundations'),...ALGOS.map(a=>document.getElementById(a.id)),document.getElementById('cheat')];
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const id=e.target.id;links.forEach(l=>l.classList.toggle('on',l.dataset.t===id));const on=links.find(l=>l.dataset.t===id);if(on)nav.scrollLeft=on.offsetLeft-nav.clientWidth/2+on.offsetWidth/2;}});},{rootMargin:'-35% 0px -60% 0px'});
    targets.forEach(t=>t&&io.observe(t));
  }

  const grows=document.getElementById('grows'),gn=document.getElementById('gn'),gnv=document.getElementById('gnv');
  const fmt=v=>v>=1e6?v.toExponential(2).replace('e+','e'):Math.round(v*10)/10;
  function upd(){
    const n=+gn.value;gnv.textContent=n;
    const rows=[['log n',Math.log2(n)],['n',n],['n log n',n*Math.log2(n)],['n²',n*n]];
    const top=Math.log10(n*n+1);
    grows.innerHTML=rows.map(([l,v])=>`<div class="g-row"><span>${l}</span><div class="g-bar"><i style="width:${Math.max(2,Math.log10(v+1)/top*100)}%"></i></div><span class="g-val">${fmt(v)}</span></div>`).join('');
  }
  gn.addEventListener('input',upd);upd();
}

function initEffects(){
  const title=document.getElementById('heroTitle'),prog=document.getElementById('prog'),blob=document.getElementById('blob');
  function onScroll(){
    const y=window.scrollY,vh=window.innerHeight;
    const p=Math.min(y/vh,1);
    title.style.transform=`scale(${1-p*.3})`;title.style.opacity=Math.max(0,1-p*1.4);
    const dh=document.documentElement.scrollHeight-vh;
    prog.style.transform=`scaleY(${dh>0?y/dh:0})`;
  }
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  let mx=0,my=0,raf=0;window.addEventListener('mousemove',e=>{mx=e.clientX-300;my=e.clientY-300;if(!raf)raf=requestAnimationFrame(()=>{blob.style.transform=`translate3d(${mx}px,${my}px,0)`;raf=0;});},{passive:true});
}

if(typeof document==='undefined'){
  module.exports={genLinear,genBinary,genMerge,genBottomUp,genSelection,genInsertion,genBubble,genRadix,genQuick};
}else{
  renderPage();initEffects();
}
</script>
</body>
