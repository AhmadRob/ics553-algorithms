<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reductions | ICS 553</title>
<meta name="description" content="KFUPM ICS 553 notes by Ahmed Abualrob: graph review and reductions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FAFAFA;--ink:#0A0A0A;--muted:#666;--line:rgba(10,10,10,.1);
  --glass:rgba(255,255,255,.4);--glass-strong:rgba(255,255,255,.6);
  --gb:rgba(0,0,0,.05);--gb-strong:rgba(0,0,0,.08);
  --blob:rgba(255,255,255,.8);--hover:rgba(0,0,0,.05);
  --bar:rgba(10,10,10,.1);--bar-line:rgba(10,10,10,.28);--bar-mid:rgba(10,10,10,.38);
  --inv:#FAFAFA;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A;--ink:#FAFAFA;--muted:#9A9A9A;--line:rgba(250,250,250,.12);
    --glass:rgba(255,255,255,.04);--glass-strong:rgba(255,255,255,.07);
    --gb:rgba(255,255,255,.08);--gb-strong:rgba(255,255,255,.14);
    --blob:rgba(255,255,255,.07);--hover:rgba(255,255,255,.08);
    --bar:rgba(250,250,250,.12);--bar-line:rgba(250,250,250,.3);--bar-mid:rgba(250,250,250,.4);
    --inv:#0A0A0A;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A;--ink:#FAFAFA;--muted:#9A9A9A;--line:rgba(250,250,250,.12);
  --glass:rgba(255,255,255,.04);--glass-strong:rgba(255,255,255,.07);
  --gb:rgba(255,255,255,.08);--gb-strong:rgba(255,255,255,.14);
  --blob:rgba(255,255,255,.07);--hover:rgba(255,255,255,.08);
  --bar:rgba(250,250,250,.12);--bar-line:rgba(250,250,250,.3);--bar-mid:rgba(250,250,250,.4);
  --inv:#0A0A0A;color-scheme:dark;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:88px}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;background:var(--bg);color:var(--ink)}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.container{position:relative;background:var(--bg);min-height:100vh}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}

.glass-layer{background:var(--glass);border:1px solid var(--gb)}
.glass-layer-strong{background:var(--glass-strong);border:1px solid var(--gb-strong)}
.panel{background:var(--glass);border:1px solid var(--gb)}

.text-fluid-xl{font-size:clamp(3rem,8vw,9rem);line-height:.9;font-weight:900;letter-spacing:-.04em;color:var(--ink);transform-origin:left top}
.text-fluid-md{font-size:clamp(1.5rem,3vw,2.5rem);line-height:1.2;font-weight:700;letter-spacing:-.02em;color:var(--ink)}

.scroll-indicator{position:fixed;left:40px;top:0;width:2px;height:100vh;background:var(--gb);z-index:1000;display:none}
.scroll-progress{position:absolute;top:0;left:0;width:100%;height:100%;background:var(--ink);transform:scaleY(0);transform-origin:top;will-change:transform}
.liquid-blob{position:fixed;left:0;top:0;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,var(--blob) 0%,rgba(255,255,255,0) 70%);pointer-events:none;z-index:0;transform:translate3d(-999px,-999px,0);will-change:transform}

.hero-section{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.hero-content{max-width:1280px;width:100%}
.subtitle-glass{display:inline-block;padding:16px 32px;margin:32px 0;font-size:1.125rem;font-weight:500;color:var(--ink);border-radius:4px}
.contact-links{display:flex;flex-wrap:wrap;gap:24px;font-size:.875rem;color:var(--muted)}
.contact-links a{color:var(--muted);text-decoration:none;transition:color .3s}
.contact-links a:hover{color:var(--ink)}

.index{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:12px;z-index:60;width:min(1120px,calc(100% - 24px));margin:0 auto;padding:6px;border-radius:999px;display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
.index::-webkit-scrollbar{display:none}
.index a,.index button{flex:0 0 auto;font:500 12px 'JetBrains Mono',monospace;color:var(--muted);text-decoration:none;padding:8px 14px;border-radius:999px;border:0;background:none;cursor:pointer;transition:all .3s}
.index a:hover,.index button:hover{color:var(--ink);background:var(--hover)}
.index a.on{background:var(--ink);color:var(--inv)}
.index #theme{padding:8px 10px;display:grid;place-items:center;margin-left:auto}
.index .sep{flex:0 0 1px;height:16px;background:var(--line);margin:0 4px}

main{position:relative;z-index:1}
.section{position:relative;padding:96px 24px 32px;max-width:1280px;margin:0 auto}
.sec-head{margin-bottom:48px;max-width:640px}
.sec-head p{color:var(--muted);line-height:1.6;margin-top:12px}

.project-type{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);margin-bottom:8px}
.card-header{display:flex;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px}
.card-title{font-size:1.875rem;font-weight:700;color:var(--ink);margin-bottom:8px;letter-spacing:-.02em}
.card-subtitle{font-size:1.125rem;color:var(--muted)}

.def{padding:48px;margin-bottom:32px}
.def p{font-size:clamp(1.15rem,2vw,1.6rem);line-height:1.5;font-weight:500;letter-spacing:-.01em;max-width:880px}
.props{display:grid;grid-template-columns:1fr;gap:24px;margin-bottom:32px}
.prop{padding:32px}
.prop h3{font-size:1.25rem;font-weight:700;margin-bottom:12px}
.prop p{color:var(--muted);line-height:1.6;font-size:.95rem}
.notation{padding:32px;display:grid;grid-template-columns:1fr;gap:24px}
.notation .sym{font-size:2.5rem;font-weight:900;letter-spacing:-.03em;line-height:1}
.notation h3{font-size:1rem;font-weight:700;margin:12px 0 6px}
.notation p{color:var(--muted);font-size:.9rem;line-height:1.55}

.algo{padding:48px;margin-bottom:48px;border-radius:2px}
.io{font-size:.8rem;color:var(--muted);line-height:1.7;max-width:420px}
.io b{color:var(--ink);font-weight:500;margin-right:8px}

.viz{margin-bottom:40px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.presets,.inputs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:500 13px 'JetBrains Mono',monospace;padding:8px 16px;border-radius:999px;border:1px solid var(--gb-strong);background:var(--glass-strong);color:var(--ink);cursor:pointer;transition:all .3s}
.btn:hover{background:var(--ink);color:var(--inv)}
.btn.solid{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.btn.solid:hover{opacity:.8}
.btn[disabled]{opacity:.35;pointer-events:none}
.lab{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);display:flex;align-items:center;gap:8px}
.in{font:400 13px 'JetBrains Mono',monospace;padding:8px 12px;border-radius:12px;border:1px solid var(--gb-strong);background:var(--glass-strong);color:var(--ink);min-width:0}
.in.arr{width:min(320px,62vw)}
.in.x{width:72px}
.hint{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);min-height:1.2em;margin-bottom:8px}
.viz-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.stage{padding:24px;border-radius:4px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:32px;margin-bottom:16px}
.chip{font:500 12px 'JetBrains Mono',monospace;padding:5px 12px;border-radius:999px;border:1px solid var(--gb-strong);background:var(--glass)}
.chip i{font-style:normal;color:var(--muted);margin-right:8px}
.chip.stat{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.chip.stat i{color:inherit;opacity:.65}
.board{overflow-x:auto;padding-bottom:6px;min-height:250px}
.cells{display:flex;gap:6px;align-items:flex-end;width:max-content;max-width:none;margin:0 auto;padding:0 4px}
.cell{flex:0 0 42px;display:flex;flex-direction:column;align-items:stretch;text-align:center;transition:opacity .25s}
.cell .val{font:500 12px 'JetBrains Mono',monospace;height:22px;line-height:22px}
.cell .bar{transition:height .25s,background .25s}
.cell .idx{font:400 11px 'JetBrains Mono',monospace;color:var(--muted);margin-top:6px}
.cell .ptr{font:500 10px 'JetBrains Mono',monospace;line-height:1.25;min-height:54px;padding-top:2px;white-space:nowrap}

.bar,.sw{background:var(--bar);border:1px solid var(--bar-line);border-radius:6px 6px 2px 2px}
.cell.cmp .bar,.sw.cmp{background:var(--ink);border-color:var(--ink)}
.cell.swap .bar,.sw.swap{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px);border-color:var(--ink)}
.cell.found .bar,.sw.found{background:var(--ink);border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.cell.min .bar,.sw.min,.cell.pivot .bar,.sw.pivot,.cell.key .bar,.sw.key{background:var(--bar-mid);border:2px solid var(--ink)}
.cell.sorted .bar,.sw.sorted{background:transparent;border:2px solid var(--ink)}
.cell.le .bar,.sw.le,.cell.runL .bar,.sw.runL{background:var(--bar-mid);border-color:var(--bar-line)}
.cell.runR .bar,.sw.runR{background:repeating-linear-gradient(135deg,var(--bar-mid) 0 3px,transparent 3px 6px);border-color:var(--bar-line)}
.cell.dim{opacity:.22}
.sw.dim{opacity:.25}
.cell.hole .bar,.sw.hole{background:transparent;border:1.5px dashed var(--bar-line)}
.cell.cmp .val,.cell.found .val,.cell.swap .val,.cell.min .val,.cell.pivot .val,.cell.key .val{font-weight:700}

.aux{margin-top:18px}
.aux-lab{font:500 11px 'JetBrains Mono',monospace;color:var(--muted);margin:14px 4px 6px;text-align:center}
.abox .box{height:36px;display:grid;place-items:center;font:500 12px 'JetBrains Mono',monospace;border:1.5px dashed var(--bar-line);border-radius:6px}
.abox.swap .box{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px);border:1.5px solid var(--ink);font-weight:700;background-color:var(--bg)}
.abox.sorted .box{border:2px solid var(--ink)}
.abox .ptr{min-height:22px}

.note{font-size:.95rem;line-height:1.55;min-height:4.4em;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.extra:empty{display:none}
.extra{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.tree-cap{font-size:11px;color:var(--muted);margin-bottom:8px}
.tree-wrap{overflow-x:auto}
.tn circle{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.tn text{fill:var(--ink);font:500 10px 'JetBrains Mono',monospace}
.tn.vis circle{fill:var(--ink)}
.tn.vis text{fill:var(--inv)}
.tn.cur circle{stroke-width:3.5}
.te{stroke:var(--bar-line);stroke-width:1.2}
.te.on{stroke:var(--ink);stroke-width:2.2}

.code{padding:20px;border-radius:4px;font:400 12.5px/1.6 'JetBrains Mono',monospace;align-self:start}
.code-title{font-size:.75rem;color:var(--muted);margin-bottom:12px}
.ln{display:flex;gap:10px;padding:2px 8px;border-radius:6px;color:var(--muted);transition:background .2s,color .2s}
.ln .no{opacity:.55;min-width:18px;text-align:right}
.ln .tx{white-space:pre-wrap}
.ln.on{background:var(--ink);color:var(--inv)}
.ln.proc .tx{font-weight:500}

.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.ctl input[type=range]{flex:1 1 180px;accent-color:var(--ink);min-width:120px}
.ctl select{font:500 12px 'JetBrains Mono',monospace;padding:8px 30px 8px 14px;border-radius:999px;border:1px solid var(--gb-strong);color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none;
  background-color:var(--glass-strong);
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;transition:all .3s}
.ctl select:hover{background-color:var(--hover)}
select option{background:var(--bg);color:var(--ink)}
.count{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);min-width:64px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px;font:400 12px 'JetBrains Mono',monospace;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:8px}
.sw{width:16px;height:16px;border-radius:4px;display:inline-block}

.rx{display:flex;flex-direction:column;gap:14px}
.rx-row{display:flex;gap:12px;align-items:center}
.rx-lab{font:500 12px 'JetBrains Mono',monospace;color:var(--muted);min-width:14px}
.rx-list{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;align-items:center}
.rx-empty{font:400 12px 'JetBrains Mono',monospace;color:var(--muted)}
.rx-cur{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);display:flex;gap:10px;align-items:center;min-height:34px}
.nchip{font:500 13px 'JetBrains Mono',monospace;padding:5px 9px;border-radius:8px;border:1px solid var(--bar-line);background:var(--bar);display:inline-block}
.nchip.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.nchip .lz{opacity:.35}
.nchip .dg.hi{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px;font-weight:700}
.rx-buckets{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.rx-b{border:1px solid var(--bar-line);border-radius:8px;padding:8px;min-height:74px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.rx-b.on{border:2px solid var(--ink)}
.rx-h{font:500 11px 'JetBrains Mono',monospace;color:var(--muted)}
.rx-b .nchip{font-size:12px;padding:4px 7px}

.algo-text{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;border-top:1px solid var(--line);padding-top:32px}
.algo-text h4{font-size:.75rem;font-family:'JetBrains Mono',monospace;color:var(--muted);font-weight:500;margin-bottom:12px}
.algo-text p{line-height:1.65;color:var(--ink);margin-bottom:16px;max-width:64ch}
.key{padding:20px 24px;border-radius:4px;margin-bottom:16px}
.key p{margin:0;font-weight:500}
.nt{margin-bottom:16px}
.nt b{display:block;margin-bottom:4px;font-weight:700}
.nt span{color:var(--muted);line-height:1.6;display:block;max-width:64ch}
.tbl-wrap{overflow-x:auto;margin-bottom:24px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font:500 12px 'JetBrains Mono',monospace;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
td.th{font:500 13px 'JetBrains Mono',monospace;min-width:96px}
td.mn{color:var(--muted)}
.tbl-title{font-weight:700;margin-bottom:8px}
.todo{padding:32px;border-radius:4px;border-style:dashed;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.9rem}
.algo.later{opacity:.6}

.cheat{padding:32px;border-radius:2px;margin-bottom:32px}
.grow{padding:32px;border-radius:2px}
.grow input[type=range]{width:100%;accent-color:var(--ink);margin:16px 0 24px}
.g-row{display:grid;grid-template-columns:90px 1fr 120px;gap:16px;align-items:center;margin-bottom:12px;font:500 13px 'JetBrains Mono',monospace}
.g-bar{height:12px;border-radius:6px;background:var(--bar);overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .2s}
.g-val{text-align:right}
.g-cap{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);margin-top:16px}

.footer{position:relative;z-index:1;padding:80px 24px;border-top:1px solid var(--line);text-align:center;margin-top:64px}
.footer-text{color:var(--muted);font:400 .875rem 'JetBrains Mono',monospace;margin-bottom:16px}

@media (min-width:768px){
  .scroll-indicator{display:block}
  .section{padding:96px 80px 32px}
  .index{width:min(1120px,calc(100% - 160px))}
  .hero-section{padding:80px}
  .subtitle-glass{font-size:1.25rem}
  .contact-links{font-size:1rem}
  .props{grid-template-columns:repeat(2,1fr)}
  .notation{grid-template-columns:repeat(3,1fr)}
  .rx-buckets{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (min-width:1000px){
  .viz-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .algo-text{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .props{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:767px){
  .algo,.def{padding:24px}
  .cheat,.grow{padding:20px}
  .g-row{grid-template-columns:64px 1fr 84px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .liquid-blob{display:none}
}

/* ---------- Reductions page additions ---------- */
.te.dim{opacity:.18}
.te.dash{stroke-dasharray:5 4}
.te.hot{stroke:var(--ink);stroke-width:3.6}
.tn.dim{opacity:.3}
.tn rect{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.tn.vis rect{fill:var(--ink)}
.tn.cur rect{stroke-width:3.5}
.ew{fill:var(--muted);font:500 9px 'JetBrains Mono',monospace;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.ew.hot{fill:var(--ink);font-weight:700}
.lab-cap{fill:var(--muted);font:500 10px 'JetBrains Mono',monospace}
.fm{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.chip.no{opacity:.4}
.algo-text .mcase-list{color:var(--ink);max-width:64ch;line-height:1.65;margin-bottom:16px}
.algo-text .mcase-list li{margin-bottom:6px}
.algo-text .mcase-list li:last-child{margin-bottom:0}
.card-full{margin-top:28px}
.card-full .widget{margin-bottom:0}
.mapn rect{fill:var(--bg);stroke:var(--ink);stroke-width:1.2;cursor:pointer;transition:fill .2s,stroke-width .2s}
.mapn text{fill:var(--ink);font:500 11px 'JetBrains Mono',monospace;pointer-events:none}
.mapn:hover rect{fill:var(--hover)}
.mapn.sel rect{fill:var(--ink)}
.mapn.sel text{fill:var(--inv)}
.mapn.to rect{stroke-width:3.2}
.mapn.from rect{fill:var(--bar-mid)}
.mapn.dim{opacity:.3}
.mapn:focus-visible{outline:none}
.mapn:focus-visible rect{stroke-width:3.2}
.mapn{outline:none}
.hero-sub{margin:28px 0 0}
select.in{padding-right:28px;cursor:pointer}
.cap{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);margin-top:12px;line-height:1.6}

/* ---------- animations ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes subtlePulse{0%,100%{box-shadow:0 0 0 0 rgba(10,10,10,.12)}50%{box-shadow:0 0 0 8px rgba(10,10,10,0)}}

.hero-section h1{animation:fadeUp .9s cubic-bezier(.22,1,.36,1) both}
.subtitle-glass{animation:fadeUp .9s cubic-bezier(.22,1,.36,1) .15s both}
.contact-links{animation:fadeUp .9s cubic-bezier(.22,1,.36,1) .3s both}
.index{animation:slideDown .5s cubic-bezier(.22,1,.36,1) .5s both}

.reveal{opacity:0;transform:translateY(28px);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
.reveal.visible{opacity:1;transform:translateY(0)}

.algo,.def,.prop{transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s}
.algo:hover,.def:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.08)}

.cross-link{animation:subtlePulse 3s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1!important;transform:none!important}
  .hero-section h1,.subtitle-glass,.contact-links,.index,.cross-link{animation:none!important}
}
</style>
<body>
<div class="container">
  <div class="scroll-indicator"><div class="scroll-progress" id="prog"></div></div>
  <div class="liquid-blob" id="blob"></div>

  <section class="hero-section">
    <div class="hero-content">
      <h1 class="text-fluid-xl" id="heroTitle">Reductions</h1>
      <div class="glass-layer subtitle-glass">Step-by-step reduction visualizers, from the graph review to NP-completeness</div>
      <div class="contact-links mono" style="margin-top:32px">
        <a href="index.html">Back to Algorithms</a>

{sec:'graph-review',group:'Graphs review',id:'graphs-basics',title:`Graphs and Trees (Review)`,tagline:`Vertices, edges, degree and the handshaking theorem.`,cols:[
 [{svg:'g1'},
  {p:`A graph G = (V, E) is a set of vertices V and a set of edges E. A tree is a connected graph with no cycles. The example G₁ has V = {a, b, c, d} and E = {(a,b), (a,c), (b,c), (b,b), (c,d)}. It is not a tree, because it has a cycle (a, b, c) and a self-loop on b.`},
  {p:`A simple graph has no loops and no multiple edges between the same pair of vertices.`},
  {svg:'treeTypes'}],
 [{sub:`Degree`},
  {p:`The degree of a vertex is the number of edges touching it, and a self-loop counts twice. In G₁, deg(a) = 2, deg(b) = 4 (two ordinary edges plus the loop counted twice), deg(c) = 3, and deg(d) = 1. The degrees add up to 10.`},
  {key:`Handshaking theorem (undirected graphs): the sum of all degrees equals 2|E|, because every edge contributes 1 to each of its two ends, and a self-loop contributes 2 to its single endpoint. So |E| = (sum of degrees)/2. In G₁, 10/2 = 5 edges, which matches the list.`},
  {p:`In a directed graph, each vertex has an in-degree (edges coming in) and an out-degree (edges going out). Every edge goes out of exactly one vertex and into exactly one vertex, so the sum of in-degrees = the sum of out-degrees = |E|.`}]]},

{sec:'graph-review',group:'Graphs review',id:'rooted-iso',title:`Rooted Trees & Isomorphic Graphs`,tagline:`Height, and when two graphs are secretly the same graph.`,cols:[
 [{sub:`Rooted trees`},{svg:'rooted'},
  {p:`A rooted tree is a tree where one vertex is chosen as the root. The height is the maximum depth, meaning the longest path from the root down to a leaf.`},
  {nt:`Note`,b:`In the drawing above, the root has depth 0. Some courses start the root at depth 1, which makes every depth and the height one larger. Check with the professor which convention the course uses.`}],
 [{sub:`Isomorphic graphs`},{svg:'iso'},
  {p:`Two graphs G₁ = (V₁, E₁) and G₂ = (V₂, E₂) are isomorphic (G₁ ≅ G₂) if there is a one-to-one and onto mapping θ: V₁ → V₂ such that (x, y) ∈ E₁ if and only if (θ(x), θ(y)) ∈ E₂. In simple words, they are the same graph with the vertices renamed. θ is called the isomorphism. For rooted trees, the roots must also map to each other.`},
  {key:`To check two graphs, first compare the easy things: the number of vertices, the number of edges, and the degrees. If any of these differ, they are not isomorphic. If they all match, that is not proof by itself, so you still have to find the mapping θ.`}]]},

{sec:'graph-review',group:'Graphs review',id:'coloring',title:`Graph Coloring`,tagline:`How many colors does a graph need, and why a clique gives a lower bound.`,cols:[
 [{svg:'coloring'},
  {p:`A coloring gives each vertex a color C(x) so that for every edge (x, y), C(x) ≠ C(y). Adjacent vertices must get different colors. Colouring is defined on simple graphs: a self-loop would force C(x) ≠ C(x), so a graph with one cannot be coloured at all. The chromatic number χ(G) is the minimum number of colors needed.`}],
 [{key:`Theorem: χ(G) ≥ the size of the largest clique, where a clique is a set of vertices that are all connected to each other. The reason is that every vertex in a clique touches all the others, so each needs its own color. In the example graph, the clique {b, e, f, h} has size 4, so at least 4 colors are needed.`},
  {p:`To conclude that χ(G) = 4 exactly, you also need to show a valid coloring that uses only 4 colors. The clique only proves the lower bound.`}]]},

/* ===== P and NP ===== */
{sec:'np-basics',group:'P and NP',id:'decision-opt',title:`Decision vs. Optimization`,tagline:`A yes/no question, versus asking for the best value.`,cols:[
 [{p:`A decision problem has a yes/no answer, while an optimization problem asks for a best value (a minimum or maximum). Both come from the same question about a graph G = (V, E). "Is G 3-colorable?" and "Is there a clique of size 5?" are decision problems. "Find χ(G)" and "Find a maximum clique" are optimization problems.`}],
 [{key:`From decision to optimization. An algorithm for the decision version gives one for the optimization version by binary search on k. For coloring, call Colorable(G, k) (is G k-colorable?) with different values of k, and the smallest k that returns yes is χ(G). For clique, call Clique(G, k) and search for the largest k that returns yes, which is the size of the maximum clique.`},
  {p:`If the decision algorithm takes O(nᶜ), the optimization algorithm takes O(nᶜ log n), because binary search makes only about log n calls (k never exceeds |V|). So if the decision problem is easy, the optimization problem is not much harder. Note that this finds the optimal value χ(G) or the size of the largest clique; recovering an actual colouring or an actual clique needs a few more calls, fixing one vertex at a time.`}]]},

{sec:'np-basics',group:'P and NP',id:'class-p',title:`Polynomial Time and Class P`,tagline:`Tractable problems, and why input-size units can hide an exponential.`,cols:[
 [{sub:`Polynomial time (tractable)`},
  {p:`A problem is tractable if it can be solved in O(nᵏ) time for some constant k, where n is the input size. Otherwise it is intractable.`},
  {p:`Sorting has input size n (the number of elements) and runs in O(n log n), so it is tractable.`},
  {nt:`Factorization looks polynomial but isn’t`,b:`Factorization asks for a divisor d of n. The simple algorithm tries d = 2, 3, ..., ⌊√n⌋ and returns the first d that divides n. This takes O(√n) steps, which looks polynomial. But the input here is a number, so its size is the number of bits k, where n = Θ(2ᵏ). In terms of the real input size, the time is O(√n) = O(2^(k/2)), which is exponential. So this algorithm is intractable. The key point is that for number problems, the input size is the number of bits, not the value of the number.`}],
 [{sub:`Class P`},
  {p:`An algorithm is deterministic if it has only one choice at each step. The class P is the set of all decision problems that a deterministic algorithm can solve in polynomial time. Examples are "Is the array sorted?", which takes O(n), and "Is G 2-colorable?", which is polynomial because a graph is 2-colorable exactly when it has no odd cycle.`},
  {key:`Theorem: P is closed under complementation. If a deterministic polynomial algorithm solves a problem, then flipping its yes/no answer solves the complement problem in the same time. So Not-sorted and Not-2-colorable are also in P.`}]]},

{sec:'np-basics',group:'P and NP',id:'class-np',title:`Class NP`,tagline:`Guess, then verify, both in polynomial time.`,cols:[
 [{p:`The class NP is the set of all decision problems that a nondeterministic algorithm can solve in polynomial time. Such an algorithm works in two phases. First it guesses a solution in O(nⁱ) time, then it verifies the guess in O(nʲ) time. The total time is O(nᵏ) with k = max(i, j). In simple words, a problem is in NP if a proposed solution can be checked quickly, even if finding one may be hard.`}],
 [{sub:`Example: k-Coloring is in NP`},
  {nt:`Informally`,b:`If someone gives us a coloring C(x) for every vertex, we can check it in polynomial time by visiting each edge (x, y) and confirming that C(x) ≠ C(y).`},
  {nt:`Formally`,b:`Build a nondeterministic algorithm that (1) guesses a coloring C(x) for every x in V, which takes polynomial time, and then (2) verifies it by going through every edge (x, y) in E and checking C(x) ≠ C(y), which takes O(n²). Both phases are polynomial, so k-Coloring is in NP.`}]]},

/* ===== NP-complete ===== */
{sec:'np-complete',group:'NP-complete',id:'poly-reduction',title:`Polynomial-Time Reductions`,tagline:`Turning one problem into another, and why that shows hardness.`,cols:[
 [{p:`Recall that P is the set of problems solvable in polynomial time by a deterministic algorithm, and NP is the set of problems whose solution (witness) can be verified in polynomial time. NP-complete problems are the hardest problems in NP.`},
  {sub:`Polynomial-time reduction`},
  {p:`For decision problems A and B, we write A ∝ₚ B (A reduces to B) if there is a polynomial-time way to turn any instance of A into an instance of B so that the answers are the same: the A instance is "yes" exactly when the B instance is "yes". In simple words, solving B lets us solve A, so B is at least as hard as A. For example, Sum 15 ∝ₚ Tic-Tac-Toe, because we convert a Sum 15 game into a tic-tac-toe game using the magic square.`},
  {key:`Transitivity: if Π₁ ∝ₚ Π₂ and Π₂ ∝ₚ Π₃, then Π₁ ∝ₚ Π₃. We chain the two polynomial conversions, and the result is still polynomial.`}],
 [{sub:`SAT (Satisfiability)`},
  {p:`Given a formula in CNF (an AND of clauses, where each clause is an OR of literals), such as f = (x₁ ∨ x₂) ∧ (x̄₁ ∨ x₂ ∨ x₃), is there a truth assignment to the variables that makes f true?`},
  {key:`SAT ∈ NP: there are 2ⁿ possible assignments for n variables, which is too many to try, but one assignment (the witness) can be verified in polynomial time by plugging it into the formula and evaluating it. If the evaluation gives true, the formula is satisfiable.`}]]},

{sec:'np-complete',group:'NP-complete',id:'hc-tsp',title:`Hamiltonian Cycle and Traveling Salesman`,tagline:`A first complete reduction, HC ∝ₚ TS.`,cols:[
 [{sub:`Hamiltonian Cycle (HC)`},
  {p:`Given a graph G, is there a cycle that visits every vertex exactly once? For example, in the two 6-vertex graphs from the notes the first has a Hamiltonian cycle and the second does not. (These are not the same G₁ as the 4-vertex graph in the review section above.)`},
  {sub:`Traveling Salesman (TS)`},
  {p:`Given n cities with distances between them and a threshold k, is there a tour (a cycle visiting each city exactly once) of total length ≤ k? For the example graph G₃, TS(G₃, 10) = No, but TS(G₃, 15) = Yes.`}],
 [{sub:`HC ∝ₚ TS`},
  {p:`Given an instance G = (V, E) of HC with n vertices, build a TS instance G′ = (V, E′) as follows:`},
  {ol:[`Make G′ a complete graph: E′ holds every unordered pair of distinct vertices, so |E′| = n(n − 1)/2.`,`Give each pair weight 1 if (x, y) is an edge of G, and weight n if it is not.`,`Set the threshold k = n.`]},
  {p:`This takes polynomial time. It works because a tour has exactly n edges. If G has a Hamiltonian cycle, use it as the tour: all n edges have weight 1, so the length is n ≤ n. Conversely, if G′ has a tour of length ≤ n, then every edge in it has weight 1, since a single weight-n edge would push the total to at least (n − 1) + n > n. So all its edges are original edges of G, which makes it a Hamiltonian cycle of G. Therefore HC(G) = Yes if and only if TS(G′, n) = Yes. In the notes’ examples, with n = 6, HC(G₁) = Yes matches TS(G₁′, 6) = Yes, and HC(G₂) = No matches TS(G₂′, 6) = No.`}]]},

{sec:'np-complete',group:'NP-complete',id:'npc-def',title:`Definition of NP-Complete`,tagline:`In NP, and every problem in NP reduces to it.`,cols:[
 [{p:`A decision problem A is NP-complete if:`},
  {ol:[`A ∈ NP, and`,`every problem B in NP reduces to A in polynomial time (B ∝ₚ A for all B ∈ NP). This second property is called NP-hard.`]},
  {p:`So NP-complete means "in NP and NP-hard." The diagram shows this idea for SAT: every problem in NP reduces in polynomial time to SAT. Together with SAT ∈ NP, this makes SAT NP-complete (this fact is Cook’s theorem).`},
  {svg:'np'}],
 [{p:`Once we have one NP-complete problem, showing a new problem A is NP-complete gets much easier. We show A ∈ NP, then reduce a known NP-complete problem to A, and transitivity does the rest. For example, HC ∝ₚ TS shows TS is NP-hard, and since TS is also in NP, it is NP-complete.`}]]},

{sec:'np-complete',group:'NP-complete',id:'reduction-map',title:`The Reduction Map`,tagline:`Which problem reduces to which. Click a problem to follow the arrows.`,cols:[
 [{p:`A decision problem π is NP-complete if (1) π ∈ NP, and (2) π is NP-hard: every π′ in NP reduces to π in polynomial time (π′ ∝ₚ π).`},
  {p:`Once one problem is NP-complete, we prove new ones by reducing a known NP-complete problem to them, and transitivity passes the hardness along. The map starts at Circuit-SAT → SAT, with SAT and 3SAT reducing to each other. SAT reduces to Clique and Vertex Cover (VC). Clique, VC, and Independent Set (IS) reduce to each other, and VC reduces to Set Cover. 3SAT reduces to VC, 3Color, Hamiltonian Cycle (HC), and Subset Sum. HC reduces to TSP and directed HC, and Subset Sum reduces to Knapsack. Homework reductions: Clique → IS, 3SAT → VC, HC → directed HC (the study guide lists 3SAT → 3Color in place of Clique → IS, so all four are treated as homework here).`}],
 []],full:[{w:'redmap'}]},

{sec:'np-complete',group:'NP-complete',id:'clique',title:`Clique is NP-Complete`,tagline:`SAT ∝ₚ Clique, one vertex per literal occurrence.`,cols:[
 [{p:`Clique: given a graph G and k, does G have k vertices that are all connected to each other?`},
  {nt:`Clique ∈ NP`,b:`The witness is a set of k vertices. Check that every pair is joined by an edge, in O(L²) where L is the number of vertices of G.`},
  {nt:`Clique is NP-hard (SAT ∝ₚ Clique)`,b:`Given a CNF formula f = C₁ ∧ ... ∧ Cₘ, build G with one vertex per literal occurrence. Join two vertices if and only if they are in different clauses and are not complements (not x and x̄). Set k = m. This compares every pair of vertices, so it takes polynomial time, O(n²).`},
  {nt:`Correctness`,b:`If f is satisfiable, pick one true literal from each clause. They are in different clauses and can’t be complements (both are true), so they are pairwise joined: a clique of size m. Conversely, a clique of size m has exactly one vertex per clause (vertices in the same clause are never joined) and no complementary pair, so setting its literals to true is a consistent assignment satisfying every clause.`}],
 [{nt:`Example`,b:`For f = (x ∨ ¬y ∨ z) ∧ (¬x ∨ y) ∧ (¬x ∨ ¬y ∨ z), we have m = 3, so k = 3. The assignment x = 0, y = 1, z = 1 makes z true in C₁, y true in C₂, and z true in C₃, and these three vertices form the clique.`},
  {w:'cliquefig'}]]},

{sec:'np-complete',group:'NP-complete',id:'is-vc',title:`Independent Set and Vertex Cover`,tagline:`Two sides of the same coin: S is independent exactly when V − S is a cover.`,cols:[
 [{p:`An independent set is a set S of vertices with no edge between any two of them, and IS asks whether one of size k exists.`},
  {key:`Theorem: S is an independent set in G if and only if V − S is a vertex cover of G. Reason: S is independent when no edge has both ends in S, which means every edge has an end outside S, which means V − S covers every edge.`}],
 [{nt:`VC ∝ₚ IS`,b:`Given (G, k) for VC, ask IS on the same graph with k′ = |V| − k. The theorem works in both directions, so IS ∝ₚ VC too. Example: with |V| = 11, S = {7, 3, 2, 8, 9, 5} has size 6, and its cover V − S = {1, 4, 6, 10, 11} has size 11 − 6 = 5.`},
  {nt:`Clique ∝ₚ IS`,b:`A clique in G is exactly an independent set in the complement graph (edges where G has none), so complement the graph and keep k.`}]]},

{sec:'np-complete',group:'NP-complete',id:'nphard-circuit',title:`NP-Hard, Circuit-SAT, SAT and 3SAT`,tagline:`Where the chain of reductions starts.`,cols:[
 [{p:`A problem A is NP-hard if every problem π in NP reduces to it (π ∝ₚ A). A is NP-complete if A ∈ NP and A is NP-hard, as with SAT. NP-hard problems don’t have to be in NP: generalized chess is NP-hard but not in NP.`},
  {nt:`One caveat on the chess example`,b:`Generalized chess is known to be outside P, but whether it is outside NP is still open — an NP algorithm for it would force NP = EXPTIME, which nobody has ruled out. "NP-hard but not believed to be in NP" is the safe phrasing.`},
  {p:`NPI (NP-intermediate) problems are in NP but are neither in P nor NP-complete. They can exist only if P ≠ NP, and factoring and graph isomorphism are the usual suspected examples.`},
  {sub:`Circuit-SAT`},
  {p:`Circuit-SAT asks whether a Boolean circuit has an input that makes its output true. It is taken as the first NP-complete problem here, and the other proofs on this page start from it. The reason is that for every π in NP, an instance I can be hard-coded into a circuit C (the checking algorithm becomes a circuit) so that C outputs true exactly when I is a Yes instance. So π ∝ₚ Circuit-SAT for all π ∈ NP.`},
  {sub:`Circuit-SAT ∝ₚ SAT`},
  {p:`Give every wire of the circuit its own variable, write each gate as a small formula saying "output = gate(inputs)", and AND all of them together with the output variable. For example, a gate w = x ∧ ¬y becomes (¬w ∨ x) ∧ (¬w ∨ ¬y) ∧ (w ∨ ¬x ∨ y). The formula is satisfiable exactly when the circuit is. Since every problem in NP reduces to Circuit-SAT, which reduces to SAT, and SAT ∈ NP, SAT is NP-complete.`}],
 [{sub:`3SAT`},
  {p:`3SAT is SAT where every clause has exactly 3 literals, for example (x₁ ∨ ¬x₂ ∨ x₃) ∧ (x₁ ∨ ¬x₃ ∨ x₄) ∧ (x₂ ∨ ¬x₃ ∨ ¬x₄).`},
  {nt:`SAT ∝ₚ 3SAT`,b:`Given f = c₁ ∧ ... ∧ cₘ, keep every clause with 3 literals, and rewrite the others using new variables:`},
  {ul:[`Two literals: (x₁ ∨ x₂) → (x₁ ∨ x₂ ∨ z) ∧ (x₁ ∨ x₂ ∨ ¬z).`,`One literal: (x) → (x ∨ y ∨ z) ∧ (x ∨ y ∨ ¬z) ∧ (x ∨ ¬y ∨ z) ∧ (x ∨ ¬y ∨ ¬z).`,`More than three: (x₁ ∨ ... ∨ xₙ) → (x₁ ∨ x₂ ∨ z₁) ∧ (¬z₁ ∨ x₃ ∨ z₂) ∧ (¬z₂ ∨ x₄ ∨ z₃) ∧ ... ∧ (¬z_{n−3} ∨ xₙ₋₁ ∨ xₙ).`]},
  {p:`Why it works. In the first two cases, z (or y and z) is either true or false, and one of the two forms always holds, so the new clauses together are satisfied exactly when the original is. In the long case, if some xᵢ is true, set the z’s before it to true and the z’s after it to false, and every piece is satisfied. If all xᵢ are false, the first piece forces z₁ true, which forces z₂ true, and so on, until the last piece fails. So the chain is satisfiable exactly when the original clause is. Since 3SAT ∈ NP and SAT ∝ₚ 3SAT, 3SAT is NP-complete.`}]]},

{sec:'np-complete',group:'NP-complete',id:'vc',title:`Vertex Cover (VC)`,tagline:`SAT ∝ₚ VC with variable edges and clause cliques.`,cols:[
 [{p:`VC: given an undirected graph G = (V, E) and k, is there a set C ⊆ V of size k such that every edge (x, y) has x ∈ C or y ∈ C?`},
  {key:`VC is NP-complete.`},
  {nt:`VC ∈ NP`,b:`The witness is the set C. Check that every edge has an end in C, in O(n²).`},
  {nt:`VC is NP-hard (SAT ∝ₚ VC)`,b:`Given a CNF formula f with n variables and m clauses, build a graph G as follows:`},
  {ol:[`For each variable xᵢ, add two vertices xᵢ and ¬xᵢ joined by an edge.`,`For each clause cⱼ, add a clique on |cⱼ| new vertices, one per literal.`,`Join each clause vertex to the variable vertex with the same literal.`]},
  {p:`Set k = n + Σ(|cⱼ| − 1). The construction is polynomial. For f = (x ∨ ¬y ∨ ¬z) ∧ (¬x ∨ y), we get n = 3 and k = 3 + (2 + 1) = 6. For 3SAT, every clause gadget is a triangle, so k = n + 2m.`}],
 [{nt:`Correctness`,b:`A cover needs at least one end of every variable edge (n vertices), and at least |cⱼ| − 1 vertices of every clause clique. So a cover of size exactly k takes one end of each variable edge and all but one vertex of each clique.`},
  {p:`If f is satisfiable, take the true literal of each variable, and in each clique leave out one vertex whose literal is true. Every edge is covered, because the left-out vertex’s connecting edge ends at a true variable vertex, which is in the cover.`},
  {p:`Conversely, given a cover of size k, call a literal true when its variable vertex is in the cover. In each clique, the left-out vertex has a connecting edge that must be covered from the other end, so its literal is true and the clause is satisfied.`},
  {key:`So f is satisfiable if and only if G has a vertex cover of size k. Since VC ∈ NP, VC is NP-complete.`},
  {w:'vcfig'}]]},

/* ===== Co-NP ===== */
{sec:'co-np',group:'Co-NP',id:'more-np',title:`More NP-Complete Problems`,tagline:`Besides the reduction map, you need to recognize these.`,cols:[
 [{table:{title:`Problems to recognize`,head:['Problem','What it asks'],th:false,rows:[
   [`3-SAT`,`Is a CNF formula with exactly three literals per clause satisfiable?`],
   [`3-Coloring`,`Can G be colored with three colors? It is a special case of Coloring, and note that 2-Coloring is in P (a graph is 2-colorable exactly when it has no odd cycle).`],
   [`3D matching`,`Given three disjoint sets X, Y, Z of size k and a set W of triples (x, y, z), is there a perfect matching, a subset M ⊆ W of size k where no two triples agree in any coordinate? The 2D version is ordinary bipartite perfect matching, which is in P.`],
   [`Hamiltonian Path`,`Does G have a simple open path visiting every vertex exactly once?`]]}}],
 [{table:{title:`Covered later`,head:['Problem','What it asks'],th:false,rows:[
   [`Partition (later)`,`Can a set of n integers be split into two subsets with equal sums?`],
   [`Knapsack (later)`,`Given n items with sizes and values, a capacity C, and a number k, do some items fit within total size ≤ C and total value ≥ k? Dynamic programming solves it in Θ(nC), which is polynomial in the value of C but exponential in the input size (C takes only about log C bits), so this doesn’t put Knapsack in P.`],
   [`Bin Packing (later)`,`Given n item sizes, a bin capacity C, and a number k, do the items fit into at most k bins?`]]}}]]},

{sec:'co-np',group:'Co-NP',id:'complements',title:`Complements and Co-NP`,tagline:`In NP a Yes answer has a short witness. In Co-NP, a No answer does.`,cols:[
 [{p:`The complement of a decision problem π, written Co-π, is the same question with the answer flipped: π is True exactly when Co-π is False. For example, UNSAT asks whether a formula f has no satisfying assignment, and TAUTOLOGY asks whether f is true under every assignment (such as f = (x ∧ y) ∨ (¬x ∧ y) ∨ (x ∧ ¬y) ∨ (¬x ∧ ¬y), whose four terms cover every combination of x and y). Neither is known to be in NP, because there is no known short witness. For SAT, one satisfying assignment proves a Yes, but proving that no assignment works seems to require checking all 2ⁿ of them.`}],
 [{p:`Co-NP is the class of problems whose complements are in NP. So UNSAT is in Co-NP, since its complement SAT is in NP. The complement of TSP (is there no tour of length ≤ k?) is also in Co-NP.`},
  {key:`A simple way to remember the difference is that in NP, a Yes answer has a short witness, and in Co-NP, a No answer has a short witness. For UNSAT, a satisfying assignment is the short proof that the answer is No.`},
  {p:`A problem π is Co-NP-complete if π ∈ Co-NP and every π′ in Co-NP reduces to π in polynomial time.`}]]},

{sec:'co-np',group:'Co-NP',id:'conp-theorems',title:`Theorems`,tagline:`Four facts about NP, Co-NP and their complete problems.`,cols:[
 [{nt:`Complete problems and complements`,b:`π is NP-complete if and only if its complement is Co-NP-complete. The same reductions work with the answers flipped. Since SAT is NP-complete, UNSAT is Co-NP-complete.`},
  {nt:`UNSAT and tautologies`,b:`f is unsatisfiable if and only if ¬f is a tautology. If no assignment makes f true, every assignment makes ¬f true. So UNSAT reduces to TAUT by negating the formula, and since TAUT is also in Co-NP, TAUT is Co-NP-complete.`}],
 [{nt:`TAUT and the classes`,b:`TAUT ∈ P if and only if Co-NP = P, and TAUT ∈ NP if and only if Co-NP = NP. Because TAUT is Co-NP-complete, an easy algorithm for it gives an easy algorithm for every Co-NP problem, by the same argument as in the P = NP proof.`},
  {nt:`Both complete implies NP = Co-NP`,b:`If π and its complement π̄ are both NP-complete, then NP = Co-NP. Take any L in NP. Reduce L to π, and the same reduction sends L̄ to π̄. Since π̄ is in NP, L̄ is in NP, so L is in Co-NP. That shows NP ⊆ Co-NP, and taking complements gives the other direction.`}]]},

{sec:'co-np',group:'Co-NP',id:'npi',title:`NP-Intermediate and the Class Picture`,tagline:`What lives between P and NP-complete.`,cols:[
 [{sub:`NP-intermediate (NPI)`},
  {p:`A problem is in NPI if it is in NP but neither in P nor NP-complete (π ∈ NP \\ (P ∪ NPC)). The notes add that NPI is closed under complementation, so NPI = (NP ∩ Co-NP) \\ P: the part of the overlap that lies outside P is exactly the NP-intermediate problems.`},
  {nt:`Worth checking with the professor`,b:`The ⊇ half is standard: assuming NP ≠ Co-NP, anything in NP ∩ Co-NP outside P is NP-intermediate. The ⊆ half needs "NPI is closed under complementation", which is not a known theorem — an NP-intermediate problem is not known to have its complement in NP. Safe version to write in an exam: every problem in NP ∩ Co-NP outside P is NP-intermediate.`},
  {sub:`Relationship between the classes`},
  {p:`P sits inside both NP and Co-NP. Assuming NP ≠ Co-NP, NPC lies in NP only and Co-NPC lies in Co-NP only. The overlap NP ∩ Co-NP holds P, plus NPI problems such as factoring.`},
  {p:`Most researchers believe NP ≠ Co-NP, but this is unproven. The professor's notes draw four candidate pictures of how the classes might sit; believing NP ≠ Co-NP rules out the two in which NP and Co-NP coincide. For the remaining two, one more fact is needed: a problem in NP ∩ Co-NP that is not in P cannot be NP-complete unless NP = Co-NP, so under that belief it must be NPI.`}],
 [{svg:'rel'}]]},
];

/* ---------- the six reductions (from the study guide) ---------- */
const GLOSSARY=[
 [`Decision problem`,`A question with a yes/no answer.`],
 [`Instance`,`One specific input to a problem.`],
 [`Witness (certificate)`,`A short proof that the answer is Yes, which can be checked quickly.`],
 [`P`,`The problems solvable in polynomial time by a deterministic algorithm.`],
 [`NP`,`The problems whose Yes answers have a witness checkable in polynomial time.`],
 [`Polynomial-time reduction, A ∝ₚ B`,`A fast conversion from any instance of A to an instance of B with the same yes/no answer. It shows B is at least as hard as A.`],
 [`NP-hard`,`Every problem in NP reduces to it in polynomial time.`],
 [`NP-complete`,`In NP and NP-hard.`],
 [`Complement of a problem`,`The same question with the answer flipped.`],
 [`Vertex cover (VC)`,`A set of vertices touching every edge.`],
 [`Independent set (IS)`,`A set of vertices with no edge between any two of them.`],
 [`Clique`,`A set of vertices all joined to each other.`],
 [`Literal`,`A variable (x) or its negation (¬x).`],
 [`Clause`,`An OR of literals.`],
 [`CNF formula`,`An AND of clauses.`],
 [`SAT`,`Is there a true/false assignment making a CNF formula true?`],
 [`3SAT`,`SAT where every clause has exactly 3 literals.`],
 [`Circuit-SAT`,`Is there an input to a Boolean circuit (AND, OR, NOT gates) that makes its output 1?`],
 [`Tour`,`A cycle that visits every vertex exactly once, with a total weight.`],
 [`TSP`,`Given a weighted complete graph and k, is there a tour of weight ≤ k?`],
 [`Hamiltonian cycle (HC)`,`A cycle that visits every vertex exactly once, using edges of the graph.`],
 [`Gadget`,`A small group of clauses or vertices that represents one part of the original problem.`]];

const RED=[
{id:'red-circuit',viz:'circuit',tag:`Reduction 1`,name:`Circuit-SAT → SAT`,tagline:`One variable per wire, a few clauses per gate.`,
 from:`Circuit with AND, OR, NOT gates`,to:`CNF formula`,
 problem:[`Circuit-SAT asks whether some input makes the circuit output 1. SAT asks whether a CNF formula is satisfiable.`],
 construction:[`Give every wire a variable. Inputs get their own variables. Each gate output gets a variable w.`,`AND (w = a ∧ b): (¬w ∨ a), (¬w ∨ b), (w ∨ ¬a ∨ ¬b).`,`OR (w = a ∨ b): (¬a ∨ w), (¬b ∨ w), (¬w ∨ a ∨ b).`,`NOT (w = ¬a): (¬w ∨ ¬a), (w ∨ a).`,`Add the clause (out) to force the output wire true.`],
 k:[`None. SAT asks only whether a satisfying assignment exists, with no size threshold to carry across.`],
 inNP:[`The witness is an assignment. Check each clause in linear time.`],
 fwd:[`Take a circuit input that gives output 1. Set each wire variable to its wire’s value. Every gate clause holds because each gate set of clauses is equivalent to w = gate(a, b). (out) holds since the output is 1.`],
 bwd:[`Take a satisfying assignment. The gate clauses force each w to equal its gate’s value on the input variables. (out) forces the output to be 1. So the input values are a Circuit-SAT solution.`],
 time:[`At most 3 clauses per gate, so the formula is linear in the circuit size.`],
 example:[`Circuit: w = a ∧ b, out = ¬w. Formula: (¬w ∨ a) ∧ (¬w ∨ b) ∧ (w ∨ ¬a ∨ ¬b) ∧ (¬out ∨ ¬w) ∧ (out ∨ w) ∧ (out). Take a = 0, b = 0. Then w = 0 and out = 1. Every clause holds. The circuit outputs 1 on input (0, 0).`]},

{id:'red-3sat',viz:'sat3',tag:`Reduction 2`,name:`SAT → 3SAT`,tagline:`Pad short clauses, chain long ones.`,
 from:`Any CNF formula`,to:`CNF with exactly 3 literals per clause`,
 problem:[`SAT takes any CNF formula. 3SAT takes a CNF formula with exactly 3 literals per clause.`],
 cintro:`Replace each clause c with the clauses below, using fresh variables for each c.`,
 construction:[`|c| = 3: keep it.`,`|c| = 2, c = (l1 ∨ l2): (l1 ∨ l2 ∨ z), (l1 ∨ l2 ∨ ¬z).`,`|c| = 1, c = (l): (l ∨ y ∨ z), (l ∨ y ∨ ¬z), (l ∨ ¬y ∨ z), (l ∨ ¬y ∨ ¬z).`,`|c| = n > 3, c = (l1 ∨ … ∨ ln): a chain with n − 3 new variables z1 … z(n−3): (l1 ∨ l2 ∨ z1), (¬z1 ∨ l3 ∨ z2), (¬z2 ∨ l4 ∨ z3), …, (¬z(n−3) ∨ l(n−1) ∨ ln).`],
 k:[`None.`],
 inNP:[`The witness is an assignment. Check each clause.`],
 fwd:[`Take a satisfying assignment of the original formula.`,`Cases 2 and 3: some literal of c is true, so every new clause holds for any z, y.`,`Case 4: let li be a true literal. Set every z before li true and every z after it false (that is, z1 … z(i−2) true and the rest false, clamped to the z's that actually exist). The chain clause containing li holds. Each earlier clause holds through its z. Each later clause holds through its ¬z.`],
 bwd:[`Take a satisfying assignment of the new formula.`,`Cases 2 and 3: the new variables can’t satisfy all the new clauses alone, because they appear both positive and negative. So l1 ∨ l2 (or l) must be true.`,`Case 4: suppose all li are false. The first clause forces z1 = true. The next forces z2 = true, and so on. The last clause (¬z(n−3) ∨ l(n−1) ∨ ln) then fails. So some li is true.`],
 time:[`Each clause makes at most max(4, n − 2) clauses, so the total is linear in the formula size. (For n>3, we need exactly n-2 clauses.)`],
 example:[`(x1 ∨ x2 ∨ x3 ∨ x4 ∨ x5) becomes (x1 ∨ x2 ∨ z1) ∧ (¬z1 ∨ x3 ∨ z2) ∧ (¬z2 ∨ x4 ∨ x5). Take x3 = true and the rest false. Then z1 = true and z2 = false. All three clauses hold.`]},

{id:'red-hc',viz:'hc',tag:`Reduction 3`,name:`HC → TSP`,tagline:`Weight 1 for real edges, weight 2 for the rest, and k = |V|.`,
 from:`Graph G`,to:`Weighted complete graph G′ and k`,
 problem:[`HC asks whether G has a cycle through every vertex using its edges. TSP asks whether there is a tour of weight ≤ k.`],
 construction:[`Keep the same vertex set V.`,`Build a complete graph G′ on V.`,`Edge weight is 1 if the edge is in G, and 2 if it is not.`,`Set k = |V|.`],
 k:[`A tour has exactly |V| edges, and each weighs at least 1. So weight ≤ |V| means every edge weighs exactly 1.`,`The professor's lecture notes give non-edges weight n instead of 2. Either works, and for the same reason: any weight above 1 makes a single non-edge push the tour past the threshold.`],
 inNP:[`The witness is the tour. Check that it visits every vertex once and sum the weights.`],
 fwd:[`A Hamiltonian cycle in G uses |V| edges of G. Each has weight 1. So it is a tour of weight |V| = k.`],
 bwd:[`A tour of weight ≤ |V| has |V| edges of weight ≥ 1 each. So all weigh exactly 1, and all are edges of G. It is a Hamiltonian cycle in G.`],
 time:[`There are O(|V|²) edges to weigh.`],
 example:[`G is the square 1–2–3–4–1. G′ gives weight 1 to those four edges and weight 2 to the diagonals 1–3 and 2–4. The tour 1-2-3-4-1 weighs 4 = k, so the answer is Yes. Removing edge 4–1 from G makes every tour use a weight-2 edge. The weight is then at least 5 > 4, so the answer is No.`]},

{id:'red-clique',viz:'clique',tag:`Reduction 4`,name:`SAT → Clique`,tagline:`One vertex per literal occurrence, joined across clauses unless they clash.`,
 from:`CNF formula with clauses C1 … Cm`,to:`Graph G and k`,
 problem:[`SAT takes a CNF formula. Clique asks whether G has a clique of size k.`],
 cintro:`Let the formula have clauses C1 … Cm.`,
 construction:[`For each literal l in clause Ci, make a vertex (l, i).`,`Join (l, i) and (l′, j) if and only if i ≠ j and l′ ≠ ¬l.`],
 k:[`k = m. A clique can take at most one vertex per clause, since vertices in the same clause are not joined. So m is the largest possible, and it means one vertex per clause.`],
 inNP:[`The witness is a set of k vertices. Check that all pairs are adjacent.`],
 fwd:[`Take a satisfying assignment. Pick one true literal from each clause. They lie in different clauses. No two are complementary, since both can’t be true. So all pairs are joined, and this is a clique of size m.`],
 bwd:[`Take a clique of size m. It has exactly one vertex per clause. Set each chosen literal true. This is consistent, since no complementary pair is joined. Set the other variables arbitrarily. Every clause has a true literal.`],
 time:[`There are at most L vertices (L = total literal count) and O(L²) pairs to test.`],
 example:[`(x ∨ y) ∧ (¬x ∨ y). The vertices are x1, y1, ¬x2, y2. The edges are x1–y2, y1–¬x2, and y1–y2. The pair x1–¬x2 is missing because the literals are complementary. The clique {y1, y2} has size 2 = m. So set y = true, and the formula is satisfied.`]},

{id:'red-vcis',viz:'vcis',tag:`Reduction 5`,name:`VC ↔ IS`,tagline:`A set is independent exactly when everything else is a cover.`,
 from:`Graph G and a bound`,to:`The same graph G and a new bound`,
 problem:[`VC asks whether G has a vertex cover of size ≤ k. IS asks whether G has an independent set of size ≥ j.`],
 lemma:[`Lemma: S is independent if and only if V − S is a vertex cover.`,`S is independent ⇔ no edge has both endpoints in S.`,`⇔ every edge has at least one endpoint outside S.`,`⇔ every edge is touched by V − S.`,`⇔ V − S is a vertex cover.`],
 construction:[`VC → IS: the instance VC(G, k) becomes IS(G, |V| − k).`,`IS → VC: the instance IS(G, j) becomes VC(G, |V| − j).`,`The graph G is unchanged.`],
 k:[`The new bound is |V| − k. By the lemma, a cover of size ≤ k has a complement of size ≥ |V| − k.`],
 inNP:[`For VC, the witness is the vertex set. Check that every edge has an endpoint in it. For IS, the witness is the vertex set. Check that no edge joins two of its vertices. Both checks are polynomial.`],
 fwd:[`VC yes ⇒ IS yes: given a cover C with |C| ≤ k, the set V − C is independent by the lemma. Its size is ≥ |V| − k.`],
 bwd:[`IS yes ⇒ VC yes: given an independent set S with |S| ≥ |V| − k, the set V − S is a cover by the lemma. Its size is ≤ k. The other direction listed in the construction, IS(G, j) → VC(G, |V| − j), is the same lemma read the same way.`],
 time:[`Only the number |V| − k is computed.`],
 example:[`Path a–b–c. The cover {b} has size 1. The independent set {a, c} has size 2 = |V| − 1. So VC(G, 1) is Yes and IS(G, 2) is Yes. Both are No for k = 0 and j = 3.`]},

{id:'red-vc',viz:'vc',tag:`Reduction 6`,name:`SAT → VC`,tagline:`Variable edges, clause cliques, and connections that tie them together.`,
 from:`CNF formula with n variables and m clauses`,to:`Graph G and k`,
 problem:[`SAT takes a CNF formula with n variables and m clauses. VC asks whether G has a vertex cover of size ≤ k.`],
 construction:[`Variable edges: for each variable xi, make vertices xi and ¬xi and join them.`,`Clause cliques: for each clause c, make |c| vertices, one per literal occurrence. Join all of them to each other.`,`Connections: join each clause vertex to the variable vertex of its literal.`],
 k:[`k = n + Σ(|c| − 1). For 3SAT this is n + 2m.`,`A variable edge needs at least 1 vertex, so n in total.`,`A clique of size s needs at least s − 1 vertices, because leaving out two vertices leaves an uncovered edge.`,`So every cover has size ≥ k, and a cover of size exactly k must take exactly these amounts. k is reached only when f is satisfiable; for an unsatisfiable f the smallest cover is strictly larger.`],
 inNP:[`The witness is the vertex set. Check its size and that every edge has an endpoint in it.`],
 fwd:[`Take a satisfying assignment.`,`Put the true literal vertex of each variable edge in the cover. That is n vertices.`,`In each clause, choose one true literal. Leave its clause vertex out and put the other |c| − 1 in.`,`Check: clique edges are covered, because at most one vertex is out. The connection edge from the left-out vertex goes to a true literal vertex, which is in the cover. All other connection edges have their clause end in the cover.`],
 bwd:[`Take a cover of size k.`,`It has exactly one vertex per variable edge and exactly |c| − 1 per clique.`,`Set a literal true if its variable vertex is in the cover. This is consistent, since only one of xi, ¬xi is chosen.`,`In each clique, exactly one vertex is out. Its connection edge must be covered from the other end, so that literal vertex is in the cover, meaning the literal is true. So every clause has a true literal.`],
 time:[`The graph has 2n + L vertices and O(L²) edges.`],
 example:[`(x ∨ y) ∧ (¬x ∨ ¬y). Here n = 2 and k = 2 + 1 + 1 = 4. Take x = T and y = F. The cover is {x, ¬y, c1y, c2¬x}. In clause 1, c1x is left out, and its connection edge to x is covered by x. In clause 2, c2¬y is left out, and its connection edge to ¬y is covered by ¬y. All 8 edges are covered with 4 vertices.`]},
];

/* ---------- SAT helpers (literals are strings: 'x' or '~x') ---------- */
const NEG=l=>l[0]==='~'?l.slice(1):'~'+l;
const VARN=l=>l[0]==='~'?l.slice(1):l;
const fl=l=>l[0]==='~'?'¬'+l.slice(1):l;
const fc=c=>'('+c.map(fl).join(' ∨ ')+')';
const uniq=a=>[...new Set(a)];
const varsOf=cnf=>uniq(cnf.flat().map(VARN));
const litT=(l,a)=>l[0]==='~'?!a[l.slice(1)]:!!a[l];
const clT=(c,a)=>c.some(l=>litT(l,a));
const showAssign=(vs,a)=>vs.map(v=>v+' = '+(a[v]?'T':'F')).join(', ');

function solveSat(cnf){
  const vs=varsOf(cnf);
  function dp(cl,as){
    let changed=true;
    while(changed){
      changed=false;const nc=[];
      for(const c of cl){
        let sat=false;const r=[];
        for(const l of c){const v=VARN(l);if(v in as){if(litT(l,as)){sat=true;break;}}else r.push(l);}
        if(sat)continue;if(!r.length)return null;nc.push(r);
      }
      cl=nc;
      const u=cl.find(c=>c.length===1);
      if(u){as={...as,[VARN(u[0])]:u[0][0]!=='~'};changed=true;}
    }
    if(!cl.length)return as;
    const v=VARN(cl[0][0]);
    for(const val of [true,false]){const r=dp(cl,{...as,[v]:val});if(r)return r;}
    return null;
  }
  const r=dp(cnf,{});
  if(!r)return null;
  const a={};vs.forEach(v=>{a[v]=v in r?r[v]:false;});return a;
}

function parseCNF(s,lim){
  const cls=s.replace(/[()]/g,' ').split(/&|∧|\band\b/i).map(t=>t.trim()).filter(Boolean);
  if(!cls.length)throw new Error('Type a formula such as (x | ~y) & (~x | z).');
  const cnf=cls.map(c=>{
    const ls=c.split(/\||∨|\bor\b/i).map(t=>t.trim()).filter(Boolean);
    if(!ls.length)throw new Error('A clause is empty.');
    return ls.map(l=>{
      const m=l.match(/^(~|¬|!)?\s*([A-Za-z][A-Za-z0-9_]*)$/);
      if(!m)throw new Error('Cannot read the literal "'+l+'". Use names like x or ~x.');
      return (m[1]?'~':'')+m[2];
    });
  });
  if(lim){
    if(cnf.length>lim.maxC)throw new Error('Use at most '+lim.maxC+' clauses here.');
    if(cnf.some(c=>c.length>lim.maxL))throw new Error('Use at most '+lim.maxL+' literals per clause here.');
    if(varsOf(cnf).length>lim.maxV)throw new Error('Use at most '+lim.maxV+' different variables here.');
  }

}

/* ---------- graph helpers ---------- */
function parseEdges(s,maxN){
  const toks=s.split(/[,;\n]+/).map(t=>t.trim()).filter(Boolean);
  if(!toks.length)throw new Error('Type edges such as 1-2, 2-3, 3-1.');
  let V=[];const raw=[];
  toks.forEach(t=>{
    const m=t.match(/^([A-Za-z0-9]{1,3})\s*[-–]\s*([A-Za-z0-9]{1,3})$/);
    if(!m)throw new Error('Cannot read the edge "'+t+'". Use the form a-b.');
    if(m[1]===m[2])throw new Error('Self-loops are not allowed here.');
    [m[1],m[2]].forEach(x=>{if(!V.includes(x))V.push(x);});
    raw.push([m[1],m[2]]);
  });
  if(V.every(v=>/^\d+$/.test(v)))V.sort((a,b)=>a-b);
  if(V.length>maxN)throw new Error('Use at most '+maxN+' vertices here.');
  const E=[];
  raw.forEach(([a,b])=>{
    const i=V.indexOf(a),j=V.indexOf(b);
    if(!E.some(e=>(e[0]===i&&e[1]===j)||(e[0]===j&&e[1]===i)))E.push([Math.min(i,j),Math.max(i,j)]);
  });
  return {V,E};
}
const adjMat=(n,E)=>{const A=Array.from({length:n},()=>Array(n).fill(false));E.forEach(([a,b])=>{A[a][b]=A[b][a]=true;});return A;};
const popc=m=>{let c=0;while(m){c+=m&1;m>>=1;}return c;};
const maskList=(m,n)=>{const r=[];for(let i=0;i<n;i++)if(m>>i&1)r.push(i);return r;};
function minVC(n,E){
  const em=E.map(([a,b])=>(1<<a)|(1<<b));let best=(1<<n)-1,bs=n;
  for(let m=0;m<(1<<n);m++){const c=popc(m);if(c>=bs&&m!==best)continue;if(c<bs&&em.every(e=>m&e)){best=m;bs=c;}}
  return {mask:best,size:bs};
}
function maxClique(n,A){
  let best=0,bs=0;
  for(let m=1;m<(1<<n);m++){
    const c=popc(m);if(c<=bs)continue;
    const L=maskList(m,n);let ok=true;
    for(let a=0;a<L.length&&ok;a++)for(let b=a+1;b<L.length;b++)if(!A[L[a]][L[b]]){ok=false;break;}
    if(ok){best=m;bs=c;}
  }
  return {mask:best,size:bs};
}
function tspBest(n,w){
  let best=Infinity,bt=null;
  const rest=[];for(let i=1;i<n;i++)rest.push(i);
  (function perm(arr,k){
    if(k===arr.length){const t=[0,...arr,0];let s=0;for(let i=0;i<t.length-1;i++)s+=w(t[i],t[i+1]);if(s<best){best=s;bt=t.slice();}return;}
    for(let i=k;i<arr.length;i++){[arr[k],arr[i]]=[arr[i],arr[k]];perm(arr,k+1);[arr[k],arr[i]]=[arr[i],arr[k]];}
  })(rest,0);
  return {w:best,tour:bt};
}
const circ=(n,cx,cy,r)=>Array.from({length:n},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return {x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};});

     <span class="count"></span>

  const $=s=>host.querySelector(s);
  const hint=$('.hint'),range=$('input[type=range]'),playBtn=$('[data-a=play]');
  const chipsEl=$('.chips'),boardEl=$('.board'),noteEl=$('.note'),extraEl=$('.extra'),countEl=$('.count');
  const lines=host.querySelectorAll('.ln');

  function render(){

    chipsEl.innerHTML=(f.chips||[]).map(([k,v,s])=>`<span class="chip${s?' stat':''}"><i>${esc(k)}</i>${esc(v)}</span>`).join('');
    boardEl.innerHTML=f.board||'';

    range.max=st.frames.length-1;range.value=st.i;

    $('[data-a=back]').disabled=st.i===0;$('[data-a=next]').disabled=st.i===st.frames.length-1;
  }

    clearTimeout(st.timer);
    st.timer=setTimeout(()=>{
      if(st.i<st.frames.length-1){st.i++;render();tick();}else stop();
    },1500/st.speed);
  }
  function run(){
    stop();hint.textContent='';

      const inst=mod.read(host);
      st.frames=mod.gen(inst);st.i=0;render();
    }catch(e){hint.textContent=e.message;}
  }
  host.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!host.contains(b))return;
    if(b.dataset.p!==undefined){mod.write(host,mod.presets[+b.dataset.p].inst);run();return;}
    const a=b.dataset.a;
    if(a==='apply')run();

    else if(a==='back'){stop();if(st.i>0){st.i--;render();}}
    else if(a==='next'){stop();if(st.i<st.frames.length-1){st.i++;render();}}
    else if(a==='play'){

      if(st.i>=st.frames.length-1){st.i=0;render();}

  host.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.in')){e.preventDefault();run();}});
  mod.write(host,mod.presets[0].inst);run();
}

/* =====================================================================
   1. Circuit-SAT -> SAT
   ===================================================================== */
function parseCircuit(s){
  const parts=s.split(/[;\n]+/).map(t=>t.trim()).filter(Boolean);
  if(!parts.length)throw new Error('Type gates such as w=AND(a,b); out=NOT(w).');
  if(parts.length>6)throw new Error('Use at most 6 gates here.');
  const gates=parts.map(p=>{
    const m=p.match(/^([A-Za-z][A-Za-z0-9_]*)\s*=\s*(AND|OR|NOT)\s*\(\s*([^)]*)\)$/i);
    if(!m)throw new Error('Cannot read the gate "'+p+'". Use name=AND(a,b), name=OR(a,b) or name=NOT(a).');
    const op=m[2].toUpperCase();
    const args=m[3].split(',').map(t=>t.trim()).filter(Boolean);
    if(args.length!==(op==='NOT'?1:2))throw new Error(op+' needs '+(op==='NOT'?'1 input':'2 inputs')+' in "'+p+'".');
    args.forEach(a=>{if(!/^[A-Za-z][A-Za-z0-9_]*$/.test(a))throw new Error('"'+a+'" is not a valid wire name.');});
    return {id:m[1],op,args};
  });
  const ids=gates.map(g=>g.id);
  if(new Set(ids).size!==ids.length)throw new Error('Each gate needs its own name.');
  const inputs=[];
  gates.forEach((g,i)=>g.args.forEach(a=>{
    const j=ids.indexOf(a);
    if(j>=i)throw new Error('"'+a+'" is used before it is defined.');
    if(j<0&&!inputs.includes(a))inputs.push(a);
  }));
  if(inputs.length>4)throw new Error('Use at most 4 inputs here.');
  return {inputs,gates};
}
function evalCircuit(C,inp){
  const v={...inp};
  C.gates.forEach(g=>{
    const [a,b]=g.args.map(x=>v[x]);
    v[g.id]=g.op==='AND'?(a&&b?1:0):g.op==='OR'?(a||b?1:0):(a?0:1);
  });
  return v;
}
function gateClauses(g){
  const w=g.id,[a,b]=g.args;
  if(g.op==='AND')return [['~'+w,a],['~'+w,b],[w,'~'+a,'~'+b]];
  if(g.op==='OR')return [['~'+a,w],['~'+b,w],['~'+w,a,b]];
  return [['~'+w,'~'+a],[w,a]];
}
const gateSym={AND:'∧',OR:'∨',NOT:'¬'};
function drawCircuit(C,val,hot){
  const depth={};C.inputs.forEach(i=>{depth[i]=0;});
  C.gates.forEach(g=>{depth[g.id]=1+Math.max(...g.args.map(a=>depth[a]));});
  const maxD=Math.max(...Object.values(depth));
  const cols=Array.from({length:maxD+1},()=>[]);
  C.inputs.forEach(i=>cols[0].push(i));C.gates.forEach(g=>cols[depth[g.id]].push(g.id));
  const H=50+Math.max(...cols.map(c=>c.length))*52,W=130+maxD*150;
  const pos={};cols.forEach((c,d)=>c.forEach((id,k)=>{pos[id]={x:50+d*150,y:H/(c.length+1)*(k+1)};}));
  let s='';
  C.gates.forEach(g=>g.args.forEach(a=>{s+=sLine(pos[a],pos[g.id],'te'+(!val||val[a]?' on':''));}));
  C.inputs.forEach(i=>{s+=sNode(pos[i],i,(val&&val[i]?'vis':''));});
  C.gates.forEach(g=>{
    const p=pos[g.id];
    s+=`<g class="tn${val&&val[g.id]?' vis':''}${hot===g.id?' cur':''}"><rect x="${f1(p.x-30)}" y="${f1(p.y-13)}" width="60" height="26" rx="8"/><text x="${f1(p.x)}" y="${f1(p.y+3.5)}" text-anchor="middle">${gateSym[g.op]} ${esc(g.id)}</text></g>`;
  });
  const o=pos[C.gates[C.gates.length-1].id];
  s+=sText(o.x+52,o.y+3.5,'output');
  return svgW(W,H,s,'Boolean circuit');
}
const modCircuit={
  presets:[
    {l:'¬(a ∧ b)',inst:{text:'w=AND(a,b); out=NOT(w)'}},
    {l:'a ∧ ¬a (No)',inst:{text:'n=NOT(a); out=AND(a,n)'}},
    {l:'(a ∨ b) ∧ ¬c',inst:{text:'p=OR(a,b); q=NOT(c); out=AND(p,q)'}}],
  inputHtml:`<label class="lab">Gates <input class="in" data-i="text" style="width:min(340px,60vw)" spellcheck="false" aria-label="Circuit gates"></label>`,
  read:h=>({text:h.querySelector('[data-i=text]').value}),
  write:(h,i)=>{h.querySelector('[data-i=text]').value=i.text;},
  steps:[
    `Give every wire a variable: the inputs and each gate output w.`,
    `AND (w = a ∧ b): (¬w ∨ a), (¬w ∨ b), (w ∨ ¬a ∨ ¬b)`,
    `OR (w = a ∨ b): (¬a ∨ w), (¬b ∨ w), (¬w ∨ a ∨ b)`,
    `NOT (w = ¬a): (¬w ∨ ¬a), (w ∨ a)`,
    `Add the clause (out) to force the output wire true.`,
    `Circuit-SAT is Yes ⇔ SAT is Yes.`],
  legend:[['cmp','Wire value 1'],['min','Gate being translated']],
  gen(inst){
    const C=parseCircuit(inst.text);
    const outId=C.gates[C.gates.length-1].id;
    const allVars=[...C.inputs,...C.gates.map(g=>g.id)];
    const clauses=[];const F=[];
    const extra=from=>blk('CNF formula so far ('+clauses.length+' clause'+(clauses.length===1?'':'s')+')',clauses.map((c,i)=>cch(c,i>=from)));
    F.push({board:drawCircuit(C),chips:[['inputs',C.inputs.join(', ')],['gates',C.gates.length]],note:`The circuit has ${C.inputs.length} input${C.inputs.length===1?'':'s'} (${C.inputs.join(', ')}) and ${C.gates.length} gate${C.gates.length===1?'':'s'}. The goal is a CNF formula that is satisfiable exactly when some input makes ${outId} equal 1.`,line:[]});
    F.push({board:drawCircuit(C),chips:[['variables',allVars.length]],note:`Every wire gets a variable: ${allVars.join(', ')}.`,line:[1]});
    C.gates.forEach(g=>{
      const from=clauses.length;gateClauses(g).forEach(c=>clauses.push(c));
      const desc=g.op==='NOT'?`${g.id} = ¬${g.args[0]}`:`${g.id} = ${g.args[0]} ${gateSym[g.op]} ${g.args[1]}`;
      F.push({board:drawCircuit(C,null,g.id),chips:[['gate',desc],['clauses',clauses.length]],note:`Gate ${desc}. These ${clauses.length-from} clauses are satisfied exactly when ${g.id} really equals the gate’s output.`,line:[g.op==='AND'?2:g.op==='OR'?3:4],extra:extra(from)});
    });
    clauses.push([outId]);
    F.push({board:drawCircuit(C,null,outId),chips:[['clauses',clauses.length]],note:`Add the clause (${outId}) so that the output wire must be true.`,line:[5],extra:extra(clauses.length-1)});
    let found=null;
    for(let m=0;m<(1<<C.inputs.length)&&!found;m++){
      const inp={};C.inputs.forEach((x,i)=>{inp[x]=m>>i&1;});
      const val=evalCircuit(C,inp);if(val[outId])found={inp,val};
    }
    const sat=solveSat(clauses);
    if(found){
      const a={};allVars.forEach(v=>{a[v]=!!found.val[v];});
      const ok=clauses.every(c=>clT(c,a));
      F.push({board:drawCircuit(C,found.val),chips:[['Circuit-SAT',yn(true),true],['SAT',yn(!!sat),true]],
        note:`(⇒) Input ${C.inputs.map(x=>x+' = '+found.inp[x]).join(', ')} makes the output 1. Setting each wire variable to its wire’s value ${ok?'satisfies every clause':'fails'}. (⇐) Any satisfying assignment must agree with the gates, so its input values are a Circuit-SAT solution.`,
        line:[6],extra:blk('All '+clauses.length+' clauses are true',clauses.map(c=>cch(c,true)))});
    }else{
      F.push({board:drawCircuit(C),chips:[['Circuit-SAT',yn(false),true],['SAT',yn(!!sat),true]],
        note:`None of the ${1<<C.inputs.length} inputs makes the output 1, and the formula has no satisfying assignment either. The two answers agree.`,line:[6],extra:extra(clauses.length)});
    }
    return F;
  }
};

/* =====================================================================
   2. SAT -> 3SAT
   ===================================================================== */
function to3(c,fresh){
  const n=c.length;
  if(n===3)return {line:1,out:[c.slice()],zs:[],txt:'3 literals: keep it.'};
  if(n===2){const z=fresh('z');return {line:2,out:[[c[0],c[1],z],[c[0],c[1],NEG(z)]],zs:[z],txt:`2 literals: add a fresh variable ${z}, once positive and once negative.`};}
  if(n===1){const y=fresh('y'),z=fresh('z');return {line:3,out:[[c[0],y,z],[c[0],y,NEG(z)],[c[0],NEG(y),z],[c[0],NEG(y),NEG(z)]],zs:[y,z],txt:`1 literal: add fresh variables ${y} and ${z} in all four sign combinations.`};}
  const zs=[];for(let i=0;i<n-3;i++)zs.push(fresh('z'));
  const out=[[c[0],c[1],zs[0]]];
  for(let i=1;i<n-3;i++)out.push([NEG(zs[i-1]),c[i+1],zs[i]]);
  out.push([NEG(zs[n-4]),c[n-2],c[n-1]]);
  return {line:4,out,zs,txt:`${n} literals: a chain of ${n-2} clauses using ${n-3} new variable${n-3===1?'':'s'} (${zs.join(', ')}).`};
}
const modSat3={
  presets:[
    {l:'5-literal clause',inst:{text:'(x1 | x2 | x3 | x4 | x5)'}},
    {l:'Mixed sizes',inst:{text:'(x | y) & (~x) & (x | ~y | z)'}},
    {l:'Unsatisfiable',inst:{text:'(x) & (~x)'}}],
  inputHtml:`<label class="lab">Formula <input class="in" data-i="text" style="width:min(340px,60vw)" spellcheck="false" aria-label="CNF formula"></label>`,
  read:h=>({text:h.querySelector('[data-i=text]').value}),
  write:(h,i)=>{h.querySelector('[data-i=text]').value=i.text;},
  steps:[
    `|c| = 3: keep it.`,
    `|c| = 2, c = (l1 ∨ l2): (l1 ∨ l2 ∨ z), (l1 ∨ l2 ∨ ¬z)`,
    `|c| = 1, c = (l): (l ∨ y ∨ z), (l ∨ y ∨ ¬z), (l ∨ ¬y ∨ z), (l ∨ ¬y ∨ ¬z)`,
    `|c| = n > 3: a chain with n − 3 new variables: (l1 ∨ l2 ∨ z1), (¬z1 ∨ l3 ∨ z2), …, (¬z(n−3) ∨ l(n−1) ∨ ln)`,
    `The original formula is satisfiable ⇔ the new formula is satisfiable.`],
  legend:[],
  gen(inst){
    const cnf=parseCNF(inst.text,{maxC:5,maxL:6,maxV:6});
    const used=new Set(varsOf(cnf));const cnt={};
    const fresh=p=>{let n;do{cnt[p]=(cnt[p]||0)+1;n=p+cnt[p];}while(used.has(n));used.add(n);return n;};
    const conv=cnf.map(c=>to3(c,fresh));
    const F=[];const news=[];
    const board=(cur,from)=>
      blk('Original formula f',cnf.map((c,i)=>cch(c,i===cur,cur!==null&&i>cur)))+'<div style="height:14px"></div>'+
      blk('3SAT formula f′ ('+news.length+' clause'+(news.length===1?'':'s')+')',news.map((c,i)=>cch(c,i>=from)));
    F.push({board:board(null,99),chips:[['clauses in f',cnf.length],['variables',used.size]],note:`The input formula f has ${cnf.length} clause${cnf.length===1?'':'s'} of size ${cnf.map(c=>c.length).join(', ')}. Every clause must end up with exactly 3 literals.`,line:[]});
    cnf.forEach((c,i)=>{
      const from=news.length;conv[i].out.forEach(x=>news.push(x));
      F.push({board:board(i,from),chips:[['clause',i+1+' of '+cnf.length],['new clauses',conv[i].out.length],['f′ size',news.length]],note:`Clause ${fc(c)}: ${conv[i].txt}`,line:[conv[i].line]});
    });
    const a=solveSat(cnf);const b=solveSat(news);
    if(a){
      const ext={...a};
      conv.forEach((cv,i)=>{
        const c=cnf[i],n=c.length;
        if(n>3){
          const t=c.findIndex(l=>litT(l,a))+1;
          cv.zs.forEach((z,j)=>{ext[z]=(j+1)<=t-2;});
        }else cv.zs.forEach(z=>{ext[z]=false;});
      });
      const ok=news.every(c=>clT(c,ext));
      F.push({board:board(null,99),chips:[['SAT',yn(true),true],['3SAT',yn(!!b),true]],
        note:`(⇒) f is satisfied by ${showAssign(varsOf(cnf),a)}. Setting the new variables as in the proof (z’s before the first true literal true, the rest false) satisfies all ${news.length} new clauses${ok?'':' (check failed)'}. (⇐) Any assignment satisfying f′ must make a literal of every original clause true.`,line:[5]});
    }else{
      F.push({board:board(null,99),chips:[['SAT',yn(false),true],['3SAT',yn(!!b),true]],
        note:`f has no satisfying assignment, and neither does f′ (checked exhaustively). The two answers agree.`,line:[5]});
    }
    return F;
  }
};

/* =====================================================================
   3. HC -> TSP
   ===================================================================== */
function drawHC(G,pos,mode,tour,W,H){
  const n=G.V.length,adj=adjMat(n,G.E);
  const tourSet=new Set();
  if(tour)for(let i=0;i<tour.length-1;i++)tourSet.add(Math.min(tour[i],tour[i+1])+'-'+Math.max(tour[i],tour[i+1]));
  let s='',labels='';
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){
    const inG=adj[a][b];
    if(mode<1&&!inG)continue;

function vcModel(cnf){

    E.push([vid[v],vid['~'+v],'var']);
  });
  cnf.forEach((c,i)=>{
    const ids=c.map((l,j)=>{V.push({k:'cl',lit:l,i,j});return V.length-1;});
    for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++)E.push([ids[a],ids[b],'cl']);
    ids.forEach((id,j)=>E.push([id,vid[c[j]],'con']));
  });
  const k=vs.length+cnf.reduce((s,c)=>s+c.length-1,0);
  return {vs,V,E,k,n:vs.length,m:cnf.length,vid,cnf};

  });
  M.cnf.forEach((c,i)=>{
    const cx=W*(i+.5)/M.m,cy=185,s=c.length;
    const r=s===1?0:s===2?24:s===3?30:34;
    const ids=M.V.map((v,idx)=>v.k==='cl'&&v.i===i?idx:-1).filter(x=>x>=0);
    ids.forEach((id,j)=>{
      const ang=s===2?(j?Math.PI:0):-Math.PI/2+j*2*Math.PI/s;
      pos[id]={x:cx+r*Math.cos(ang),y:cy+(s===3?6:0)+r*Math.sin(ang)};

  const cover=new Set(),out=new Set();
  M.vs.forEach(v=>cover.add(M.vid[a[v]?v:'~'+v]));

    const ids=M.V.map((v,idx)=>v.k==='cl'&&v.i===i?idx:-1).filter(x=>x>=0);
