const DSCALE=1.35;
const svgW=(w,h,inner,label)=>`<svg class="dg" viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${Math.round(w*DSCALE)}px;display:block;margin:0 auto" role="img" aria-label="${esc(label||'diagram')}">${inner}</svg>`;

const sText=(x,y,t,cls)=>`<text class="${cls||'lab-cap'}" x="${f1(x)}" y="${f1(y)}" dominant-baseline="central" text-anchor="middle">${esc(t)}</text>`;
const cch=(cl,on,no,orig)=>`<span class="chip${on?' on':''}${no?' no':''}">(${cl.map(l=>orig&&!orig.has(VARN(l))?`<b class="lit-new">${esc(fl(l))}</b>`:esc(fl(l))).join(' ∨ ')})</span>`;

function buildRed(host,mod){
  const st={frames:[],i:0,timer:null,speed:1};
  host.innerHTML=`
   <div class="tools">
     <div class="presets">${mod.presets.map((p,i)=>`<button class="btn" data-p="${i}">${esc(p.l)}</button>`).join('')}</div>
     <div class="inputs">${mod.inputHtml}<button class="btn solid" data-a="apply">Run</button></div>
   </div>

   <div class="viz-grid">

       <div class="board"></div>
       <div class="extra"></div>
       <div class="note" aria-live="polite"></div>
     </div>
     <div class="code panel"><div class="code-title">Construction</div>${mod.steps.map((t,i)=>`<div class="ln" data-n="${i+1}"><span class="no">${i+1}</span><span class="tx">${esc(t)}</span></div>`).join('')}</div>
   </div>
   <div class="ctl">
     <button class="btn" data-a="reset">Reset</button>
     <button class="btn" data-a="back">Back</button>
     <button class="btn solid" data-a="play">Play</button>
     <button class="btn" data-a="next">Step</button>
     <input type="range" min="0" value="0" aria-label="Step position">
     <select aria-label="Speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option></select>
     <span class="count"></span>
   </div>
   <div class="legend">${(mod.legend||[]).map(([c,l])=>`<span class="lg">${c?`<i class="sw ${c}"></i>`:''}${esc(l)}</span>`).join('')}</div>`;
  const $=s=>host.querySelector(s);
  const hint=$('.hint'),range=$('input[type=range]'),playBtn=$('[data-a=play]');
  const chipsEl=$('.chips'),boardEl=$('.board'),noteEl=$('.note'),extraEl=$('.extra'),countEl=$('.count');
  const lines=host.querySelectorAll('.ln');

  function render(){
    const f=st.frames[st.i];
    chipsEl.innerHTML=(f.chips||[]).map(([k,v,s])=>`<span class="chip${s?' stat':''}${s&&v==='Yes'?' yes':''}${s&&v==='No'?' no':''}"><i>${esc(k)}</i>${esc(v)}</span>`).join('');
    boardEl.innerHTML=f.board||'';
    extraEl.innerHTML=f.extra||'';
    noteEl.textContent=f.note||'';
    lines.forEach(l=>l.classList.toggle('on',(f.line||[]).includes(+l.dataset.n)));
    range.max=st.frames.length-1;range.value=st.i;
    countEl.textContent=`${st.i+1} / ${st.frames.length}`;
    $('[data-a=back]').disabled=st.i===0;$('[data-a=next]').disabled=st.i===st.frames.length-1;
  }
  function stop(){clearTimeout(st.timer);st.timer=null;playBtn.textContent='Play';}
  function tick(){
    clearTimeout(st.timer);
    st.timer=setTimeout(()=>{
      if(st.i<st.frames.length-1){st.i++;render();tick();}else stop();
    },1500/st.speed);
  }
  function run(){
    stop();hint.textContent='';
    try{
      const inst=mod.read(host);
      st.frames=mod.gen(inst);st.i=0;render();
    }catch(e){hint.textContent=e.message;}
  }
  host.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!host.contains(b))return;
    if(b.dataset.p!==undefined){mod.write(host,mod.presets[+b.dataset.p].inst);run();return;}
    const a=b.dataset.a;
    if(a==='apply')run();
    else if(a==='reset'){stop();st.i=0;render();}
    else if(a==='back'){stop();if(st.i>0){st.i--;render();}}
    else if(a==='next'){stop();if(st.i<st.frames.length-1){st.i++;render();}}
    else if(a==='play'){
      if(st.timer){stop();return;}
      if(st.i>=st.frames.length-1){st.i=0;render();}
      playBtn.textContent='Pause';tick();
    }
  });
  range.addEventListener('input',()=>{stop();st.i=+range.value;render();});
  $('select[aria-label=Speed]').addEventListener('change',e=>{st.speed=+e.target.value;if(st.timer)tick();});
  host.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.in')){e.preventDefault();run();}});
  mod.write(host,mod.presets[0].inst);run();
}

/* =====================================================================
   1. Circuit-SAT -> SAT
   ===================================================================== */
function parseCircuit(s){
  const parts=s.split(/[;\n]+/).map(t=>t.trim()).filter(Boolean);
  if(!parts.length)throw new Error('Type gates such as w=AND(a,b); out=NOT(w).');
  if(parts.length>6)throw new Error('Use at most 6 gates here.');
  const gates=parts.map(p=>{
    const m=p.match(/^([A-Za-z][A-Za-z0-9_]*)\s*=\s*(AND|OR|NOT)\s*\(\s*([^)]*)\)$/i);
    if(!m)throw new Error('Cannot read the gate "'+p+'". Use name=AND(a,b), name=OR(a,b) or name=NOT(a).');
    const op=m[2].toUpperCase();
    const args=m[3].split(',').map(t=>t.trim()).filter(Boolean);
    if(args.length!==(op==='NOT'?1:2))throw new Error(op+' needs '+(op==='NOT'?'1 input':'2 inputs')+' in "'+p+'".');
    args.forEach(a=>{if(!/^[A-Za-z][A-Za-z0-9_]*$/.test(a))throw new Error('"'+a+'" is not a valid wire name.');});
    return {id:m[1],op,args};
  });
  const ids=gates.map(g=>g.id);
  if(new Set(ids).size!==ids.length)throw new Error('Each gate needs its own name.');
  const inputs=[];
  gates.forEach((g,i)=>g.args.forEach(a=>{
    const j=ids.indexOf(a);
    if(j>=i)throw new Error('"'+a+'" is used before it is defined.');
    if(j<0&&!inputs.includes(a))inputs.push(a);
  }));
  if(inputs.length>4)throw new Error('Use at most 4 inputs here.');
  return {inputs,gates};
}
function evalCircuit(C,inp){
  const v={...inp};
  C.gates.forEach(g=>{
    const [a,b]=g.args.map(x=>v[x]);
    v[g.id]=g.op==='AND'?(a&&b?1:0):g.op==='OR'?(a||b?1:0):(a?0:1);
  });
  return v;
}
function gateClauses(g){
  const w=g.id,[a,b]=g.args;
  if(g.op==='AND')return [['~'+w,a],['~'+w,b],[w,'~'+a,'~'+b]];
  if(g.op==='OR')return [['~'+a,w],['~'+b,w],['~'+w,a,b]];
  return [['~'+w,'~'+a],[w,a]];
}
const gateSym={AND:'∧',OR:'∨',NOT:'¬'};
function drawCircuit(C,val,hot){
  const depth={};C.inputs.forEach(i=>{depth[i]=0;});
  C.gates.forEach(g=>{depth[g.id]=1+Math.max(...g.args.map(a=>depth[a]));});
  const maxD=Math.max(...Object.values(depth));
  const cols=Array.from({length:maxD+1},()=>[]);
  C.inputs.forEach(i=>cols[0].push(i));C.gates.forEach(g=>cols[depth[g.id]].push(g.id));
  const H=50+Math.max(...cols.map(c=>c.length))*56,W=140+maxD*150;
  const pos={};cols.forEach((c,d)=>c.forEach((id,k)=>{pos[id]={x:50+d*150,y:H/(c.length+1)*(k+1)};}));
  let s='';
  C.gates.forEach(g=>g.args.forEach(a=>{s+=sLine(pos[a],pos[g.id],'te'+(!val||val[a]?' on':'')+(val&&val[a]?' one':''));}));
  C.inputs.forEach(i=>{s+=sNode(pos[i],i,(val?(val[i]?'vis':'h-rose'):''),16);});
  C.gates.forEach(g=>{
    const p=pos[g.id];
    s+=`<g class="tn${val?(val[g.id]?' vis':' h-rose'):''}${hot===g.id?' cur':''}"><rect x="${f1(p.x-32)}" y="${f1(p.y-15)}" width="64" height="30" rx="10"/><text x="${f1(p.x)}" y="${f1(p.y)}" dominant-baseline="central" text-anchor="middle">${gateSym[g.op]} ${esc(g.id)}</text></g>`;
  });
  const o=pos[C.gates[C.gates.length-1].id];
  s+=sText(o.x+58,o.y,'OUTPUT');
  return svgW(W,H,s,'Boolean circuit');
}
const modCircuit={
  presets:[
    {l:'¬(a ∧ b)',inst:{text:'w=AND(a,b); out=NOT(w)'}},
    {l:'a ∧ ¬a (No)',inst:{text:'n=NOT(a); out=AND(a,n)'}},
    {l:'(a ∨ b) ∧ ¬c',inst:{text:'p=OR(a,b); q=NOT(c); out=AND(p,q)'}}],
  inputHtml:`<label class="lab">Gates <input class="in" data-i="text" style="width:min(340px,60vw)" spellcheck="false" aria-label="Circuit gates"></label>`,

  steps:[
    `Give every wire a variable: the inputs and each gate output w.`,

/* =====================================================================
   2. SAT -> 3SAT
   ===================================================================== */
function to3(c,fresh){
  const n=c.length;
  if(n===3)return {line:1,out:[c.slice()],zs:[],txt:'3 literals: keep it.'};
  if(n===2){const z=fresh('z');return {line:2,out:[[c[0],c[1],z],[c[0],c[1],NEG(z)]],zs:[z],txt:`2 literals: add a fresh variable ${z}, once positive and once negative.`};}
  if(n===1){const y=fresh('y'),z=fresh('z');return {line:3,out:[[c[0],y,z],[c[0],y,NEG(z)],[c[0],NEG(y),z],[c[0],NEG(y),NEG(z)]],zs:[y,z],txt:`1 literal: add fresh variables ${y} and ${z} in all four sign combinations.`};}
  const zs=[];for(let i=0;i<n-3;i++)zs.push(fresh('z'));
  const out=[[c[0],c[1],zs[0]]];
  for(let i=1;i<n-3;i++)out.push([NEG(zs[i-1]),c[i+1],zs[i]]);
  out.push([NEG(zs[n-4]),c[n-2],c[n-1]]);
  return {line:4,out,zs,txt:`${n} literals: a chain of ${n-2} clauses using ${n-3} new variable${n-3===1?'':'s'} (${zs.join(', ')}).`};
}

    const conv=cnf.map(c=>to3(c,fresh));

      blk('Original formula f',cnf.map((c,i)=>cch(c,i===cur,cur!==null&&i>cur)))+'<div style="height:14px"></div>'+

    cnf.forEach((c,i)=>{

    });

        note:`(⇒) f is satisfied by ${showAssign(varsOf(cnf),a)}. Setting the new variables as in the proof (z’s before the first true literal true, the rest false) satisfies all ${news.length} new clauses${ok?'':' (check failed)'}. (⇐) Any assignment satisfying f′ must make a literal of every original clause true.`,line:[5]});
    }else{
      F.push({board:board(null,99),chips:[['SAT',yn(false),true],['3SAT',yn(!!b),true]],
        note:`f has no satisfying assignment, and neither does f′ (checked exhaustively). The two answers agree.`,line:[5]});

function drawHC(G,pos,mode,tour,W,H){
  const n=G.V.length,adj=adjMat(n,G.E);
  const tourSet=new Set();
  if(tour)for(let i=0;i<tour.length-1;i++)tourSet.add(Math.min(tour[i],tour[i+1])+'-'+Math.max(tour[i],tour[i+1]));
  let s='',labels='';
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){
    const inG=adj[a][b];
    if(mode<1&&!inG)continue;
    const key=a+'-'+b,inT=tourSet.has(key);
    let cls=inG?'te on':'te dash';
    if(tour){cls=inT?'te hot':(inG?'te':'te dash dim');}
    s+=sLine(pos[a],pos[b],cls);
    if(mode>=2){
      const m=mid(pos[a],pos[b],.36);
      labels+=`<text class="ew ${inG?'w1':'w2'}${inT?' hot':''}" x="${f1(m.x)}" y="${f1(m.y)}" dominant-baseline="central" text-anchor="middle">${inG?1:2}</text>`;
    }
  }
  const nodes=pos.map((p,i)=>sNode(p,G.V[i],'vis')).join('');
  return svgW(W,H,s+labels+nodes,'Graph');
}

function cliqueModel(cnf){
  const V=[];cnf.forEach((c,i)=>c.forEach((l,j)=>V.push({lit:l,i,j,id:V.length})));
  const E=[];
  for(let a=0;a<V.length;a++)for(let b=a+1;b<V.length;b++)
    if(V[a].i!==V[b].i&&V[a].lit!==NEG(V[b].lit))E.push([a,b]);
  return {V,E,m:cnf.length};
}
function drawClique(M,o){
  o=o||{};

  const maxL=Math.max(...sizes);
  const W=40+colw*m,H=70+maxL*50;
  const pos=M.V.map(v=>({x:20+colw*v.i+colw/2,y:62+v.j*50+(maxL-sizes[v.i])*25}));
  const shown=o.shown===undefined?m:o.shown;
  const hot=o.hot||null;
  let s='';
  const HUE=['blue','green','amber','rose'];
  for(let i=0;i<m;i++)if(i<shown)s+=sText(20+colw*i+colw/2,22,'C'+(i+1),'lab-h h-'+HUE[i%4]);
  if(o.edges)M.E.forEach(([a,b])=>{
    const both=hot&&hot.has(a)&&hot.has(b);
    s+=sLine(pos[a],pos[b],hot?(both?'te hot':'te dim'):'te');
  });
  M.V.forEach((v,idx)=>{if(v.i<shown)s+=sNode(pos[idx],fl(v.lit),'h-'+HUE[v.i%4]+' '+(hot?(hot.has(idx)?'vis':'dim'):(o.fresh===v.i?'cur':'')),16);});
  return svgW(W,H,s,'Clique graph built from the formula');
}

    `Join (l, i) and (l′, j) if and only if i ≠ j and l′ ≠ ¬l.`,

    F.push({board:drawClique(M,{edges:true}),chips:[['k',m,true]],note:`k = m = ${m}. A clique can use at most one vertex per clause, so size ${m} means exactly one per clause.`,line:[3]});
    const a=solveSat(cnf);
    // search for a clique of size m: one vertex per clause
    let clique=null;
    const adj=adjMat(M.V.length,M.E);
    (function pick(i,ch){

      M.V.forEach((v,idx)=>{if(v.i===i&&ch.every(c=>adj[c][idx]))pick(i+1,[...ch,idx]);});

      const back={};clique.forEach(i=>{const l=M.V[i].lit;back[VARN(l)]=l[0]!=='~';});
      varsOf(cnf).forEach(v=>{if(!(v in back))back[v]=false;});
      const ok=cnf.every(c=>clT(c,back));
      F.push({board:drawClique(M,{edges:true,hot:new Set(clique)}),chips:[['SAT',yn(true),true],['Clique(G, '+m+')',yn(true),true]],note:`(⇐) A clique of size ${m}: ${clique.map(i=>fl(M.V[i].lit)).join(', ')}. Setting those literals true is consistent and ${ok?'satisfies every clause':'fails'}.`,line:[5,6]});
    }else{
      F.push({board:drawClique(M,{edges:true}),chips:[['SAT',yn(false),true],['Clique(G, '+m+')',yn(!!clique),true]],note:`Every way of choosing one vertex per clause contains a complementary pair, so no clique of size ${m} exists. f is unsatisfiable too. The two answers agree.`,line:[5,6]});
    }
    return F;
  }
};

        return svgW(620,250,`<g>${drawG(G,pos,{node:nf})}</g><g transform="translate(320,0)">${drawG(G,pos,{E:cE,node:nf2})}</g>${sText(150,244,'G')}${sText(470,244,'complement of G')}`,'G and its complement');
      };
      F.push({board:one(()=>'' ),chips:[['|V|',n],['k',k]],note:`Instance: Clique(G, ${k}). Is there a set of ${k} vertices that are all joined to each other?`,line:[1]});
      F.push({board:svgW(620,250,`<g>${drawG(G,pos)}</g><g transform="translate(320,0)">${drawG(G,pos,{E:cE})}</g>${sText(150,244,'G')}${sText(470,244,'complement of G')}`,'G and its complement'),chips:[['edges in G',G.E.length],['edges in complement',cE.length]],note:`Complement the graph: join two vertices exactly when G has no edge between them. Keep k = ${k}.`,line:[5]});
      F.push({board:two(cl.mask),chips:[['largest clique',names(cl.mask)],['size',w]],note:`A largest clique of G is ${names(cl.mask)} (size ${w}). In the complement the same vertices have no edges between them, so they form an independent set.`,line:[5]});
      F.push({board:two(w>=k?cl.mask:0),chips:[['Clique(G, '+k+')',yn(w>=k),true],['IS(complement, '+k+')',yn(w>=k),true]],note:`Both answers are ${yn(w>=k)} because the largest clique of G has size ${w}${w>=k?' ≥ ':' < '}${k}.`,line:[6]});
      return F;
    }
    const vc=minVC(n,G.E);const mv=vc.size,mi=n-mv;
    const coverNode=m=>i=>(m>>i&1)?'vis':'cur';
    const isVC=inst.mode==='vc2is';
    const newB=n-k;
    const startTxt=isVC?`Instance: VC(G, ${k}). Is there a vertex cover with at most ${k} vertices?`:`Instance: IS(G, ${k}). Is there an independent set with at least ${k} vertices?`;
    F.push({board:one(()=>'' ),chips:[['|V|',n],[isVC?'k':'j',k]],note:startTxt,line:[1]});
    F.push({board:one(coverNode(vc.mask)),chips:[['smallest cover',names(vc.mask)],['size',mv],['complement size',mi]],note:`A smallest vertex cover is ${names(vc.mask)}. By the lemma, the vertices left over, ${names(((1<<n)-1)^vc.mask)}, form an independent set (the largest one, size ${mi}).`,line:[2]});
    F.push({board:one(()=>'' ),chips:[[isVC?'new bound j = |V| − k':'new bound k = |V| − j',newB,true]],note:isVC?`Keep G and ask IS(G, ${newB}), because ${n} − ${k} = ${newB}.`:`Keep G and ask VC(G, ${newB}), because ${n} − ${k} = ${newB}.`,line:[isVC?3:4]});
    const ansVC=mv<=(isVC?k:newB),ansIS=mi>=(isVC?newB:k);
    const yes=ansVC;
    F.push({board:one(coverNode(vc.mask)),chips:[['VC(G, '+(isVC?k:newB)+')',yn(ansVC),true],['IS(G, '+(isVC?newB:k)+')',yn(ansIS),true]],
      note:`Both answers are ${yn(yes)}: the smallest cover has ${mv} ${mv===1?'vertex':'vertices'} (${mv<=(isVC?k:newB)?'≤':'>'} ${isVC?k:newB}) and the largest independent set has ${mi} ${mi===1?'vertex':'vertices'} (${mi>=(isVC?newB:k)?'≥':'<'} ${isVC?newB:k}).`,line:[6]});
    return F;
  }
};

/* =====================================================================
   6. SAT -> VC
   ===================================================================== */
function vcModel(cnf){
  const vs=varsOf(cnf);const V=[],E=[],vid={};
  vs.forEach(v=>{
    vid[v]=V.length;V.push({k:'var',lit:v});
    vid['~'+v]=V.length;V.push({k:'var',lit:'~'+v});
    E.push([vid[v],vid['~'+v],'var']);
  });
  cnf.forEach((c,i)=>{
    const ids=c.map((l,j)=>{V.push({k:'cl',lit:l,i,j});return V.length-1;});
    for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++)E.push([ids[a],ids[b],'cl']);
    ids.forEach((id,j)=>E.push([id,vid[c[j]],'con']));
  });
  const k=vs.length+cnf.reduce((s,c)=>s+c.length-1,0);
  return {vs,V,E,k,n:vs.length,m:cnf.length,vid,cnf};
}
function vcLayout(M){
  const W=Math.max(460,M.n*150,M.m*160),H=250;
  const pos=[];
  M.vs.forEach((v,i)=>{
    const cx=W*(i+.5)/M.n;
    pos[M.vid[v]]={x:cx-32,y:42};pos[M.vid['~'+v]]={x:cx+32,y:42};
  });
  M.cnf.forEach((c,i)=>{
    const cx=W*(i+.5)/M.m,cy=185,s=c.length;
    const r=s===1?0:s===2?30:s===3?36:40;
    const ids=M.V.map((v,idx)=>v.k==='cl'&&v.i===i?idx:-1).filter(x=>x>=0);
    ids.forEach((id,j)=>{
      const ang=s===2?(j?Math.PI:0):-Math.PI/2+j*2*Math.PI/s;
      pos[id]={x:cx+r*Math.cos(ang),y:cy+(s===3?6:0)+r*Math.sin(ang)};
    });
  });
  return {W,H,pos};
}
function drawVC(M,o){
  o=o||{};
  const {W,H,pos}=vcLayout(M);
  const showV=o.vars!==false,cl=o.cl===undefined?M.m:o.cl,con=o.con!==false;
  const shownIdx=idx=>{const v=M.V[idx];return v.k==='var'?showV:v.i<cl;};
  let s='';
  M.E.forEach(([a,b,t])=>{
    if(!shownIdx(a)||!shownIdx(b))return;
    if(t==='con'&&!o.con)return;
    s+=sLine(pos[a],pos[b],'te e-'+t);
  });
  M.V.forEach((v,idx)=>{
    if(!shownIdx(idx))return;
    let cls='';
    if(o.cover){cls=o.cover.has(idx)?'vis':'';if(o.out&&o.out.has(idx))cls='cur';}
    else if(o.fresh!==undefined&&v.k==='cl'&&v.i===o.fresh)cls='cur fresh';
    s+=sNode(pos[idx],fl(v.lit),cls,v.k==='var'?17:15);
  });
  if(showV)s+=sText(W/2,12,'VARIABLE EDGES');
  if(cl>0)s+=sText(W/2,H-4,'CLAUSE CLIQUES');
  return svgW(W,H,s,'Vertex cover graph built from the formula');
}
function vcCover(M,a){
  const cover=new Set(),out=new Set();
  M.vs.forEach(v=>cover.add(M.vid[a[v]?v:'~'+v]));
  M.cnf.forEach((c,i)=>{
    const ids=M.V.map((v,idx)=>v.k==='cl'&&v.i===i?idx:-1).filter(x=>x>=0);
    const keep=c.findIndex(l=>litT(l,a));
    ids.forEach((id,j)=>{if(j===keep)out.add(id);else cover.add(id);});
  });
  return {cover,out};
}
const modVC={
  presets:[
    {l:'(x ∨ y) ∧ (¬x ∨ ¬y)',inst:{text:'(x | y) & (~x | ~y)'}},
    {l:'(x ∨ ¬y ∨ ¬z) ∧ (¬x ∨ y)',inst:{text:'(x | ~y | ~z) & (~x | y)'}},
    {l:'Unsatisfiable',inst:{text:'(x) & (~x)'}}],
  inputHtml:`<label class="lab">Formula <input class="in" data-i="text" style="width:min(340px,60vw)" spellcheck="false" aria-label="CNF formula"></label>`,
  read:h=>({text:h.querySelector('[data-i=text]').value}),
  write:(h,i)=>{h.querySelector('[data-i=text]').value=i.text;},
  steps:[
    `Variable edges: for each variable xi, make vertices xi and ¬xi and join them.`,
    `Clause cliques: for each clause c, make |c| vertices, one per literal, and join them all.`,
    `Connections: join each clause vertex to the variable vertex of its literal.`,
    `k = n + Σ(|c| − 1).`,
    `(⇒) Cover the true literal of each variable, and in each clause leave out one true-literal vertex.`,
    `(⇐) Set a literal true when its variable vertex is in the cover.`],
  legend:[['k-amber','In the cover'],['k-ring-green','Left out (true literal)'],['k-line-blue','Variable edge'],['k-line-violet','Clause clique'],['k-dash','Connection']],
  gen(inst){
    const cnf=parseCNF(inst.text,{maxC:4,maxL:3,maxV:4});
    const M=vcModel(cnf);
    const F=[];
    F.push({board:`<div class="fm" style="justify-content:center">${cnf.map(c=>cch(c,true)).join('')}</div>`,chips:[['n variables',M.n],['m clauses',M.m]],note:`The SAT instance f has ${M.n} variable${M.n===1?'':'s'} and ${M.m} clause${M.m===1?'':'s'}.`,line:[]});
    F.push({board:drawVC(M,{cl:0,con:false}),chips:[['vertices',2*M.n],['edges',M.n]],note:`One edge per variable, joining xi and ¬xi. A cover needs at least one end of every variable edge, so at least ${M.n} vertices.`,line:[1]});
    for(let i=0;i<M.m;i++)F.push({board:drawVC(M,{cl:i+1,con:false,fresh:i}),chips:[['clause',i+1+' of '+M.m],['clique size',cnf[i].length]],note:`Clause ${fc(cnf[i])}: a clique on ${cnf[i].length} new ${cnf[i].length===1?'vertex':'vertices'}. A clique of size ${cnf[i].length} needs at least ${cnf[i].length-1} cover ${cnf[i].length-1===1?'vertex':'vertices'}.`,line:[2]});
    F.push({board:drawVC(M,{con:true}),chips:[['vertices',M.V.length],['edges',M.E.length]],note:`Connect every clause vertex to the variable vertex with the same literal (dashed).`,line:[3]});
    F.push({board:drawVC(M,{con:true}),chips:[['k',M.k,true]],note:`k = n + Σ(|c| − 1) = ${M.n} + ${cnf.map(c=>c.length-1).join(' + ')} = ${M.k}. No cover can be smaller than this; a cover of exactly this size exists only if f is satisfiable.`,line:[4]});
    const a=solveSat(cnf);
    const adjE=M.E.map(([x,y])=>(1<<x)|(1<<y));
    const mv=(()=>{const N=M.V.length;let bs=N;for(let m=0;m<(1<<N);m++){const c=popc(m);if(c<bs&&adjE.every(e=>m&e))bs=c;}return bs;})();
    if(a){
      const {cover,out}=vcCover(M,a);
      const ok=M.E.every(([x,y])=>cover.has(x)||cover.has(y))&&cover.size===M.k;
      F.push({board:drawVC(M,{con:true,cover,out}),chips:[['assignment',showAssign(M.vs,a)],['cover size',cover.size],['k',M.k]],note:`(⇒) f is satisfied by ${showAssign(M.vs,a)}. Cover the true literal of each variable, and in each clause leave out one vertex with a true literal (ringed). The cover has ${cover.size} vertices and ${ok?'touches every edge':'misses an edge'}.`,line:[5]});
      F.push({board:drawVC(M,{con:true,cover,out}),chips:[['SAT',yn(true),true],['VC(G, '+M.k+')',yn(mv<=M.k),true]],note:`(⇐) Read the cover back: a literal is true when its variable vertex is in the cover. In each clique one vertex is out, and its connection edge forces its literal vertex into the cover, so every clause has a true literal. Smallest cover found by search: ${mv}.`,line:[6]});
    }else{
      F.push({board:drawVC(M,{con:true}),chips:[['SAT',yn(false),true],['VC(G, '+M.k+')',yn(mv<=M.k),true],['smallest cover',mv]],note:`f is unsatisfiable, and the smallest vertex cover has ${mv} vertices, more than k = ${M.k}. The two answers agree.`,line:[5,6]});
    }
    return F;
  }
};

const MAPN={
  circ:{l:'Circuit-SAT',x:72,y:200},sat:{l:'SAT',x:205,y:200},s3:{l:'3SAT',x:335,y:215},
  clq:{l:'Clique',x:335,y:35},is:{l:'IS',x:335,y:108},vc:{l:'VC',x:485,y:70},sc:{l:'Set Cover',x:645,y:70},
  c3:{l:'3Color',x:485,y:185},hc:{l:'HC',x:485,y:255},ss:{l:'Subset Sum',x:485,y:330},
  tsp:{l:'TSP',x:645,y:235},dhc:{l:'Directed HC',x:645,y:285},kn:{l:'Knapsack',x:645,y:335}};
const MAPE=[['circ','sat'],['sat','s3'],['s3','sat'],['sat','clq'],['sat','vc'],['clq','vc'],['vc','clq'],['vc','is'],['is','vc'],['clq','is',1],['is','clq'],['is','hc'],['vc','sc'],['s3','vc',1],['s3','c3',1],['s3','hc'],['s3','ss'],['hc','tsp'],['hc','dhc',1],['ss','kn']];
const MAPFAM={circ:'green',sat:'green',s3:'green',clq:'violet',is:'violet',vc:'violet',sc:'violet',c3:'rose',hc:'blue',tsp:'blue',dhc:'blue',ss:'amber',kn:'amber'};
function mapSvg(sel){
  const nw=id=>Math.max(54,MAPN[id].l.length*7.6+26),nh=30;
  const to=new Set(),from=new Set();
  if(sel)MAPE.forEach(([a,b])=>{if(a===sel)to.add(b);if(b===sel)from.add(a);});
  const rev=(a,b)=>MAPE.some(e=>e[0]===b&&e[1]===a);
  const COL={base:'var(--d-edge-strong)',out:'var(--d-blue)',in:'var(--d-amber)',faint:'var(--d-edge)'};
  let s=`<defs>${Object.entries(COL).map(([k,c])=>`<marker id="mk-${k}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" style="fill:${c}"/></marker>`).join('')}</defs>`;
  MAPE.forEach(([a,b,hw])=>{
    const A=MAPN[a],B=MAPN[b];
    let dx=B.x-A.x,dy=B.y-A.y;const L=Math.hypot(dx,dy);dx/=L;dy/=L;
    const clip=(N,id,sgn)=>{const tx=dx?nw(id)/2/Math.abs(dx):1e9,ty=dy?nh/2/Math.abs(dy):1e9;return Math.min(tx,ty)+(sgn>0?8:3);};
    const off=rev(a,b)?5:0,px=-dy*off,py=dx*off;
    const x1=A.x+dx*clip(A,a,-1)+px,y1=A.y+dy*clip(A,a,-1)+py,x2=B.x-dx*clip(B,b,1)+px,y2=B.y-dy*clip(B,b,1)+py;
    const k=!sel?'base':a===sel?'out':b===sel?'in':'faint';
    const op=k==='faint'?.35:(k==='base'?.75:1);
    s+=`<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" style="stroke:${COL[k]};stroke-width:${k==='out'||k==='in'?3:1.8};opacity:${op}${hw?';stroke-dasharray:6 5':''}" stroke-linecap="round" marker-end="url(#mk-${k})"/>`;
  });
  Object.entries(MAPN).forEach(([id,N])=>{
    const w=nw(id);
    let c='';
    if(sel){c=id===sel?' sel':to.has(id)?' to':from.has(id)?' from':' dim';}
    s+=`<g class="mapn h-${MAPFAM[id]}${c}" data-n="${id}" tabindex="0" role="button" aria-label="${esc(N.l)}"><rect x="${f1(N.x-w/2)}" y="${f1(N.y-nh/2)}" width="${f1(w)}" height="${nh}" rx="15"/><text x="${f1(N.x)}" y="${f1(N.y)}" dominant-baseline="central" text-anchor="middle">${esc(N.l)}</text></g>`;
  });
  return svgW(760,375,s,'Reduction map').replace('viewBox="0 0 760 375"','viewBox="-10 -5 770 380"');
}
function buildMap(host){
  let sel=null;
  function paint(){
    const to=[],from=[];
    if(sel)MAPE.forEach(([a,b])=>{if(a===sel)to.push(MAPN[b].l);if(b===sel)from.push(MAPN[a].l);});
    host.innerHTML=`<div class="widget">${mapSvg(sel)}

      <p class="cap">${sel?`<b>${esc(MAPN[sel].l)}</b> reduces to: ${to.length?esc(to.join(', ')):'nothing on this map'}. Reduces to <b>${esc(MAPN[sel].l)}</b>: ${from.length?esc(from.join(', ')):'nothing on this map'}. Click it again to clear.`:`Click a problem to trace its arrows. A → B means A ∝ₚ B. Dashed arrows are homework: Clique → IS, 3SAT → VC, HC → Directed HC, 3SAT → 3Color.`}</p></div>`;
  }
  host.addEventListener('click',e=>{const g=e.target.closest('[data-n]');if(!g)return;sel=sel===g.dataset.n?null:g.dataset.n;paint();});

/* ---------- 7. HC -> Directed HC ---------- */
function hamCycle(n,E){
  const A=adjMat(n,E);

  return best.w===n?best.tour:null;
}
function drawDHC(G,pos,directed,cyc){

  const undirOn=(a,b)=>onCyc.has(a+'>'+b)||onCyc.has(b+'>'+a);
  let s=`<defs><marker id="dh-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path class="arrow-blue" d="M0,0L10,5L0,10z"/></marker><marker id="dh-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="arrow-hot" d="M0,0L10,5L0,10z"/></marker></defs>`;

    const A=pos[a],B=pos[b];let dx=B.x-A.x,dy=B.y-A.y;const L=Math.hypot(dx,dy);dx/=L;dy/=L;

    const sx=A.x+dx*R+nx*6,sy=A.y+dy*R+ny*6,ex=B.x-dx*(R+4)+nx*6,ey=B.y-dy*(R+4)+ny*6;

    return `<path class="${cls}" d="M${f1(sx)} ${f1(sy)} Q${f1(cx)} ${f1(cy)} ${f1(ex)} ${f1(ey)}" marker-end="url(#${mk})"/>`;
  };
  G.E.forEach(([a,b])=>{
    if(!directed){s+=sLine(pos[a],pos[b],cyc?(undirOn(a,b)?'te hot':'te dim'):'te on');return;}
    [[a,b],[b,a]].forEach(([u,v])=>{
      const hot=onCyc.has(u+'>'+v);
      s+=arc(u,v,hot?'te arc-hot':(cyc?'te arc dim':'te arc'),hot?'dh-h':'dh-n');

}
const modDHC={

  write:(h,i)=>{h.querySelector('[data-i=text]').value=i.text;},
  steps:[

    `For each edge {u, v} in G, add both arcs u → v and v → u.`,
    `k: none. Directed HC has no number to carry across.`,
    `(⇒) Walk G's Hamiltonian cycle in one direction: every step is an arc of D.`,

    F.push({board:drawDHC(G,pos,true,null),chips:[['|V|',n],['arcs in D',2*G.E.length]],note:`Replace each edge {u, v} with the two arcs u → v and v → u. D has the same ${n} vertices and 2|E| = ${2*G.E.length} arcs.`,line:[1,2]});

/* ---------- 8. 3SAT -> VC (reuses the SAT -> VC drawing) ---------- */
const modVC3={

    `(⇒) Cover each true literal, and in each triangle leave out one true-literal vertex.`,

/* ---------- 9. 3SAT -> 3Color ---------- */

  const vs=varsOf(cnf),V=[],E=[];

  const T=add('T','pal'),Fv=add('F','pal'),B=add('B','pal');
  E.push([T,Fv,'pal'],[Fv,B,'pal'],[T,B,'pal']);

    `OR gadget (a, b → r): p – a, q – b, triangle p – q – r.`,
    `Clause (a ∨ b ∨ c): r1 = OR(a, b), r2 = OR(r1, c); join r2 to F and B.`,
    `(⇒) Color literals by the assignment, then each OR gadget by the rules.`,
    `(⇐) All three literals F forces r2 = F, which clashes with the F vertex.`],
  legend:[['k-green','T (true)'],['k-rose','F (false)'],['k-blue','B (base)'],['k-ring-violet','OR gadget vertex, not yet colored'],['','Small F / B: the palette vertices, redrawn next to r2']],
  gen(inst){
    const cnf=parseCNF(inst.text,{maxC:2,maxL:3,maxV:3});
    if(cnf.some(c=>c.length!==3))throw new Error('3SAT needs exactly 3 literals in every clause.');
    const M=col3Model(cnf);const F=[];
    const pal={};pal[M.T]='T';pal[M.F]='F';pal[M.B]='B';
    F.push({board:drawCol3(M,{lits:false,cl:0,col:pal}),chips:[['colors',3,true]],note:`Palette triangle T, F, B. Its vertices need three different colors, so name each color after its vertex: True, False, Base.`,line:[1]});
    F.push({board:drawCol3(M,{cl:0,col:pal}),chips:[['n variables',M.n],['literal vertices',2*M.n]],note:`Variable gadgets: xi – ¬xi, and both joined to B. Each literal must avoid B, so it is T or F, and xi, ¬xi get opposite colors.`,line:[2]});
    cnf.forEach((c,i)=>F.push({board:drawCol3(M,{cl:i+1,col:pal,fresh:i}),chips:[['clause',(i+1)+' of '+M.m],['new vertices',6]],note:`Clause ${fc(c)}: r1 = OR(${fl(c[0])}, ${fl(c[1])}), then r2 = OR(r1, ${fl(c[2])}). r2 is joined to F and B, so r2 must be T.`,line:[3,4]}));
    F.push({board:drawCol3(M,{col:pal}),chips:[['vertices',`${M.V.length} = 3 + 2·${M.n} + 6·${M.m}`],['edges',`${M.E.length} = 3 + 3·${M.n} + 12·${M.m}`]],note:`The whole graph has linear size, so the reduction is polynomial.`,line:[4]});
    const a=solveSat(cnf);
    if(a){
      const col=col3Color(M,v=>a[v]);const ok=colValid(M,col);
      F.push({board:drawCol3(M,{col}),chips:[['assignment',showAssign(M.vs,a)],['valid coloring',yn(ok),true]],note:`(⇒) ${showAssign(M.vs,a)} satisfies f. Color each literal T or F by its value, then each OR gadget by the rules. Every r2 comes out T, and ${ok?'no edge joins two vertices of the same color':'some edge clashes (check failed)'}.`,line:[5]});
    }
    const c0=cnf[0];
    if(!c0.some(l=>c0.includes(NEG(l)))){
      const forced={};c0.forEach(l=>{forced[VARN(l)]=l[0]==='~';});
      const col=col3Color(M,v=>v in forced?forced[v]:(a?a[v]:undefined),0);
      F.push({board:drawCol3(M,{col,dimOther:0}),chips:[['clause 1',fc(c0)],['r2','forced F']],note:`(⇐) Suppose every literal of ${fc(c0)} is F. Then r1 is forced to F, so r2 = OR(F, F) is forced to F. But r2 is joined to F: the red edge is a clash. So in a valid coloring every clause has a T literal.`,line:[6]});
    }
    const colorable=a?true:col3Search(M);
    F.push({board:a?drawCol3(M,{col:col3Color(M,v=>a[v])}):drawCol3(M,{col:pal}),chips:[['3SAT',yn(!!a),true],['3Color',yn(colorable),true]],note:a?`Both answers are Yes.`:`f is unsatisfiable, and a search over colorings finds no valid 3-coloring of G either. Both answers are No.`,line:[6]});
    return F;
  }
};

/* ---------- 10. Clique -> IS ---------- */
function drawCIS(G,pos,cE,o){
  o=o||{};
  const S=o.S||0,inS=i=>!!(S>>i&1);
  const left=()=>{
    let s='';
    if(o.showG!==false)G.E.forEach(([a,b])=>{s+=sLine(pos[a],pos[b],S&&o.hotG?(inS(a)&&inS(b)?'te hot':'te dim'):'te on');});
    pos.forEach((p,i)=>{s+=sNode(p,G.V[i],S&&o.hotG?(inS(i)?'vis':'dim'):'',17);});
    return s;
  };
  const right=()=>{
    let s='';
    cE.forEach(([a,b])=>{s+=sLine(pos[a],pos[b],'te h-amber');});
    pos.forEach((p,i)=>{s+=sNode(p,G.V[i],S&&o.hotC&&inS(i)?'cur':'',17);});
    return s;
  };
  if(!o.comp)return svgW(300,260,left()+sText(150,252,'G'),'Graph G');
  return svgW(620,260,`<g>${left()}</g><g transform="translate(320,0)">${right()}</g>${sText(150,252,'G')}${sText(470,252,'COMPLEMENT Ḡ','lab-h h-amber')}`,'G and its complement');
}
const modCliqueIS={
  presets:[
    {l:'Notes example, k = 3',inst:{k:3,text:'a-b, a-c, b-c, c-d, d-e'}},
    {l:'Same graph, k = 4 (No)',inst:{k:4,text:'a-b, a-c, b-c, c-d, d-e'}},
    {l:'Square + diagonal, k = 3',inst:{k:3,text:'1-2, 2-3, 3-4, 4-1, 1-3'}},
    {l:'Pentagon, k = 3 (No)',inst:{k:3,text:'1-2, 2-3, 3-4, 4-5, 5-1'}}],
  inputHtml:`<label class="lab">k <input class="in x" type="number" min="1" data-i="k" aria-label="Clique size k"></label>
    <label class="lab">Edges <input class="in" data-i="text" style="width:min(280px,52vw)" spellcheck="false" aria-label="Edges of G"></label>`,
  read:h=>({k:parseInt(h.querySelector('[data-i=k]').value,10),text:h.querySelector('[data-i=text]').value}),
  write:(h,i)=>{h.querySelector('[data-i=k]').value=i.k;h.querySelector('[data-i=text]').value=i.text;},
  steps:[
    `Keep the same vertex set V.`,
    `Complement: join u, v in Ḡ exactly when they are not joined in G.`,
    `Keep the same k.`,
    `(⇒) A clique S in G has every pair joined, so no pair in Ḡ: S is independent in Ḡ.`,
    `(⇐) An independent S in Ḡ has no pair joined, so every pair in G: S is a clique in G.`,
    `Clique(G, k) = Yes ⇔ IS(Ḡ, k) = Yes.`],
  legend:[['k-violet','In the clique (G)'],['k-teal','Independent set (Ḡ)'],['k-line','Edge of G'],['k-line-amber','Edge of Ḡ']],
  gen(inst){
    const G=parseEdges(inst.text,8);const n=G.V.length;
    if(!Number.isInteger(inst.k)||inst.k<1||inst.k>n)throw new Error('k must be a whole number from 1 to '+n+'.');
    const k=inst.k,A=adjMat(n,G.E),cE=[];
    for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)if(!A[a][b])cE.push([a,b]);
    const pos=circ(n,150,122,88);
    const cl=maxClique(n,A),w=cl.size;
    const names=m=>'{'+maskList(m,n).map(i=>G.V[i]).join(', ')+'}';
    const pairs=n*(n-1)/2;
    const F=[];
    F.push({board:drawCIS(G,pos,cE,{}),chips:[['|V|',n],['|E|',G.E.length],['k',k]],note:`Instance: Clique(G, ${k}). Are there ${k} vertices that are all joined to each other?`,line:[1]});
    F.push({board:drawCIS(G,pos,cE,{comp:true}),chips:[['pairs',pairs],['edges in G',G.E.length],['edges in Ḡ',cE.length]],note:`Complement the graph: of the ${pairs} pairs, the ${G.E.length} joined in G are left out and the other ${cE.length} become the edges of Ḡ (amber).`,line:[1,2]});
    F.push({board:drawCIS(G,pos,cE,{comp:true}),chips:[['k',k,true]],note:`Keep k = ${k}. The new instance is IS(Ḡ, ${k}). Building Ḡ checks each pair once: O(|V|²).`,line:[3]});
    F.push({board:drawCIS(G,pos,cE,{comp:true,S:cl.mask,hotG:true}),chips:[['largest clique',names(cl.mask)],['size',w]],note:`A largest clique of G is ${names(cl.mask)} (size ${w}): every pair is joined in G (violet).`,line:[4]});
    F.push({board:drawCIS(G,pos,cE,{comp:true,S:cl.mask,hotG:true,hotC:true}),chips:[['independent in Ḡ',names(cl.mask)],['size',w]],note:`(⇒) The same vertices in Ḡ (teal): no amber edge joins two of them, so they form an independent set of size ${w}. (⇐) Reading any independent set of Ḡ back in G gives a clique the same way.`,line:[4,5]});
    F.push({board:drawCIS(G,pos,cE,{comp:true,S:w>=k?cl.mask:0,hotG:w>=k,hotC:w>=k}),chips:[['Clique(G, '+k+')',yn(w>=k),true],['IS(Ḡ, '+k+')',yn(w>=k),true]],note:w>=k?`Both answers are Yes: G has a clique of size ${w} ≥ ${k}.`:`Both answers are No: the largest clique of G has size ${w} < ${k}, so Ḡ has no independent set of size ${k} either.`,line:[6]});
    return F;
  }
};

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function tableHtml(head,rows,cls){
  return `<div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i===1&&cls?'th':(i===2?'mn':'')}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function blockHtml(b){
  if(b.p)return `<p>${esc(b.p)}</p>`;
  if(b.key)return `<div class="key glass-layer"><p>${esc(b.key)}</p></div>`;
  if(b.nt)return `<div class="nt"><b>${esc(b.nt)}</b><span>${esc(b.b)}</span></div>`;
  if(b.sub)return `<h4 style="margin-top:8px">${esc(b.sub)}</h4>`;
  if(b.ol)return `<ol class="mcase-list">${b.ol.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`;
  if(b.ul)return `<ul class="mcase-list">${b.ul.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
  if(b.table)return `${b.table.title?`<div class="tbl-title">${esc(b.table.title)}</div>`:''}${tableHtml(b.table.head,b.table.rows,b.table.th)}`;
  if(b.formula)return `<div class="glass-layer" style="padding:16px 20px;border-radius:4px;margin-bottom:16px"><p class="mono" style="margin:0;font-size:.95rem">${esc(b.formula)}</p></div>`;
  if(b.svg)return SVGS[b.svg]?SVGS[b.svg]():'';
  if(b.w)return `<div data-w="${b.w}"></div>`;
  return '';
}
function cardHtml(c,group){

}

const pHtml=a=>a.map(t=>typeof t!=='object'?`<p>${esc(t)}</p>`:t.nt?`<div class="nt"><b>${esc(t.nt)}</b><span>${esc(t.b)}</span></div>`:t.h?`<h4>${esc(t.h)}</h4>`:t.ul?`<ul class="mcase-list">${t.ul.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'').join('');
const TPLID={'red-circuit':'circuit','red-3sat':'sat3','red-hc':'hc','red-clique':'clique','red-vcis':'vcis','red-vc':'vc','red-dhc':'dhc','red-vc3':'vc3','red-3col':'col3','red-cliqueis':'cliqueis'};
function redCard(r){
  const head=`<div class="card-header"><div><div class="project-type">${esc(r.tag)}</div><h3 class="card-title">${esc(r.name)}</h3><p class="card-subtitle">${esc(r.tagline)}</p></div><div class="io mono"><div><b>From</b>${esc(r.from)}</div><div><b>To</b>${esc(r.to)}</div></div></div>`;

  const right=`<h4>In NP</h4>${pHtml(r.inNP)}<h4>(⇒)</h4>${pHtml(r.fwd)}<h4>(⇐)</h4>${pHtml(r.bwd)}<h4>Time</h4>${pHtml(r.time)}<h4>Example</h4>${pHtml(r.example)}${r.note?pHtml(r.note):''}${TPLID[r.id]?`<a class="tp-link" href="ProofTemplate.html#use-${TPLID[r.id]}">Write it as an exam proof →</a>`:''}`;

const SECS=[
 {id:'graph-review',nav:'Graphs',h:'Review: Graphs',sub:'Graphs, trees, degree, isomorphism and coloring.'},
 {id:'np-basics',nav:'P &amp; NP',h:'Decision Problems, P and NP',sub:'Decision vs. optimization, polynomial time, P and NP.'},
 {id:'np-complete',nav:'NP-complete',h:'NP-Complete Problems',sub:'Reductions, the reduction map and the core NP-complete problems.'},
 {id:'co-np',nav:'Co-NP',h:'Co-NP',sub:'More NP-complete problems, complements, Co-NP and NP-intermediate.'},
 {id:'reductions',nav:'Reductions',h:'Reductions, Step by Step',sub:'NP-Completeness Study Guide by Ahmed Abualrob, KFUPM ICS 553, 10/15/2026. Each has a live visualizer: pick a preset or type your own instance.'}];

function labelTables(){document.querySelectorAll('table').forEach(t=>{const h=[...t.querySelectorAll('thead th')].map(x=>x.textContent.trim());t.querySelectorAll('tbody tr').forEach(r=>[...r.children].forEach((td,i)=>{td.dataset.label=h[i]||'';}));});}
function renderPage(){
  let h='';
  SECS.forEach(S=>{
    const inner=S.id==='reductions'
      ?glossaryCard()+RED.map(redCard).join('')+`<div class="nt prof-intro"><b>Which reductions to study</b><span>${esc(HOMEWORK_INTRO)}</span></div>`+HWRED.map(redCard).join('')+HOMEWORK.map(hwCard).join('')
      :TOPICS.filter(t=>t.sec===S.id).map(t=>cardHtml(t,t.group)).join('');
    h+=`<section class="section" id="${S.id}">${secHead(S.id+'-h',S.h,S.sub)}${inner}</section>`;
  });
  document.getElementById('app').innerHTML=h;

  document.querySelectorAll('[data-viz]').forEach(el=>buildRed(el,REDVIZ[el.dataset.viz]));
  document.querySelectorAll('[data-w]').forEach(el=>{
    const w=el.dataset.w;
    if(w==='redmap')buildMap(el);
    else el.innerHTML=w==='cliquefig'?cliqueFigure():vcFigure();
  });

  const nav=document.getElementById('index');
  nav.innerHTML=`<a href="index.html#foundations-h">Basics</a><a href="index.html#searching">Searching</a><a href="index.html#sorting">Sorting</a><a href="index.html#cheat-h">Cheat sheet</a><a href="index.html#complexity-h">Complexity</a><a href="index.html#recursion-h">Recursion</a><span class="sep"></span>`+SECS.map(S=>`<a href="#${S.id}-h" data-t="${S.id}">${S.nav}</a>`).join('')+`<span class="sep"></span>`+[...RED,...HWRED].map(r=>`<a href="#${r.id}" data-t="${r.id}">${r.name}</a>`).join('')+`<span class="sep"></span><a href="ProofTemplate.html">Proof template</a><button type="button" id="theme"></button>`;
  const root=document.documentElement;
  const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  const SUN='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  const themeBtn=document.getElementById('theme');
  function setIcon(){const d=isDark();themeBtn.innerHTML=d?SUN:MOON;const t=d?'Switch to light mode':'Switch to dark mode';themeBtn.setAttribute('aria-label',t);themeBtn.title=t;}
  themeBtn.onclick=()=>{root.dataset.theme=isDark()?'light':'dark';setIcon();};
  const mq=matchMedia('(prefers-color-scheme:dark)');if(mq.addEventListener)mq.addEventListener('change',setIcon);
  setIcon();

  const links=[...nav.querySelectorAll('a[data-t]')];
  const targets=[...SECS.map(S=>document.getElementById(S.id)),...[...RED,...HWRED].map(r=>document.getElementById(r.id))];
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const id=e.target.id;links.forEach(l=>l.classList.toggle('on',l.dataset.t===id));const on=links.find(l=>l.dataset.t===id);if(on)nav.scrollLeft=on.offsetLeft-nav.clientWidth/2+on.offsetWidth/2;}});},{rootMargin:'-35% 0px -60% 0px'});
    targets.forEach(t=>t&&io.observe(t));
  }
}

function initEffects(){
  const title=document.getElementById('heroTitle'),prog=document.getElementById('prog'),blob=document.getElementById('blob');
  function onScroll(){
    const y=window.scrollY,vh=window.innerHeight;
    const p=Math.min(y/vh,1);
    title.style.transform=`scale(${1-p*.3})`;title.style.opacity=Math.max(0,1-p*1.4);
    const dh=document.documentElement.scrollHeight-vh;
    prog.style.transform=`scaleY(${dh>0?y/dh:0})`;
  }
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  let mx=0,my=0,raf=0;window.addEventListener('mousemove',e=>{mx=e.clientX-300;my=e.clientY-300;if(!raf)raf=requestAnimationFrame(()=>{blob.style.transform=`translate3d(${mx}px,${my}px,0)`;raf=0;});},{passive:true});

  /* scroll-reveal */
  const reveals=document.querySelectorAll('.sec-head, .algo, .def, .notation');
  reveals.forEach((el,i)=>{el.classList.add('reveal');el.style.transitionDelay=`${Math.min(i%4,3)*0.07}s`;});
  if('IntersectionObserver' in window){
    const rio=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');rio.unobserve(e.target);}});},{threshold:0.08,rootMargin:'0px 0px -40px 0px'});
    reveals.forEach(el=>rio.observe(el));
  }else{reveals.forEach(el=>el.classList.add('visible'));}
}
