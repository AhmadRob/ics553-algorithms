<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reductions | ICS 553</title>
<meta name="description" content="KFUPM ICS 553 notes by Ahmed Abualrob: graph review, P and NP, NP-completeness and nine reductions with step-by-step visualizers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FAFAFA;--ink:#0A0A0A;--muted:#666;--line:rgba(10,10,10,.1);
  --glass:rgba(255,255,255,.4);--glass-strong:rgba(255,255,255,.6);
  --gb:rgba(0,0,0,.05);--gb-strong:rgba(0,0,0,.08);
  --blob:rgba(255,255,255,.8);--hover:rgba(0,0,0,.05);
  --bar:rgba(10,10,10,.1);--bar-line:rgba(10,10,10,.28);--bar-mid:rgba(10,10,10,.38);
  --inv:#FAFAFA;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A;--ink:#FAFAFA;--muted:#9A9A9A;--line:rgba(250,250,250,.12);
    --glass:rgba(255,255,255,.04);--glass-strong:rgba(255,255,255,.07);
    --gb:rgba(255,255,255,.08);--gb-strong:rgba(255,255,255,.14);
    --blob:rgba(255,255,255,.07);--hover:rgba(255,255,255,.08);
    --bar:rgba(250,250,250,.12);--bar-line:rgba(250,250,250,.3);--bar-mid:rgba(250,250,250,.4);
    --inv:#0A0A0A;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A;--ink:#FAFAFA;--muted:#9A9A9A;--line:rgba(250,250,250,.12);
  --glass:rgba(255,255,255,.04);--glass-strong:rgba(255,255,255,.07);
  --gb:rgba(255,255,255,.08);--gb-strong:rgba(255,255,255,.14);
  --blob:rgba(255,255,255,.07);--hover:rgba(255,255,255,.08);
  --bar:rgba(250,250,250,.12);--bar-line:rgba(250,250,250,.3);--bar-mid:rgba(250,250,250,.4);
  --inv:#0A0A0A;color-scheme:dark;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:88px}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;background:var(--bg);color:var(--ink)}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.container{position:relative;background:var(--bg);min-height:100vh}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}

.glass-layer{background:var(--glass);border:1px solid var(--gb)}
.glass-layer-strong{background:var(--glass-strong);border:1px solid var(--gb-strong)}
.panel{background:var(--glass);border:1px solid var(--gb)}

.text-fluid-xl{font-size:clamp(3rem,8vw,9rem);line-height:.9;font-weight:900;letter-spacing:-.04em;color:var(--ink);transform-origin:left top}
.text-fluid-md{font-size:clamp(1.5rem,3vw,2.5rem);line-height:1.2;font-weight:700;letter-spacing:-.02em;color:var(--ink)}

.scroll-indicator{position:fixed;left:40px;top:0;width:2px;height:100vh;background:var(--gb);z-index:1000;display:none}
.scroll-progress{position:absolute;top:0;left:0;width:100%;height:100%;background:var(--ink);transform:scaleY(0);transform-origin:top;will-change:transform}
.liquid-blob{position:fixed;left:0;top:0;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,var(--blob) 0%,rgba(255,255,255,0) 70%);pointer-events:none;z-index:0;transform:translate3d(-999px,-999px,0);will-change:transform}

.hero-section{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.hero-content{max-width:1280px;width:100%}
.subtitle-glass{display:inline-block;padding:16px 32px;margin:32px 0;font-size:1.125rem;font-weight:500;color:var(--ink);border-radius:4px}
.contact-links{display:flex;flex-wrap:wrap;gap:24px;font-size:.875rem;color:var(--muted)}
.contact-links a{color:var(--muted);text-decoration:none;transition:color .3s}
.contact-links a:hover{color:var(--ink)}

.index{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:12px;z-index:60;width:min(1120px,calc(100% - 24px));margin:0 auto;padding:6px;border-radius:999px;display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
.index::-webkit-scrollbar{display:none}
.index a,.index button{flex:0 0 auto;font:500 12px 'JetBrains Mono',monospace;color:var(--muted);text-decoration:none;padding:8px 14px;border-radius:999px;border:0;background:none;cursor:pointer;transition:all .3s}
.index a:hover,.index button:hover{color:var(--ink);background:var(--hover)}
.index a.on{background:var(--ink);color:var(--inv)}
.index #theme{padding:8px 10px;display:grid;place-items:center;margin-left:auto}
.index .sep{flex:0 0 1px;height:16px;background:var(--line);margin:0 4px}

main{position:relative;z-index:1}
.section{position:relative;padding:96px 24px 32px;max-width:1280px;margin:0 auto}
.sec-head{margin-bottom:48px;max-width:640px}
.sec-head p{color:var(--muted);line-height:1.6;margin-top:12px}

.project-type{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);margin-bottom:8px}
.card-header{display:flex;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px}
.card-title{font-size:1.875rem;font-weight:700;color:var(--ink);margin-bottom:8px;letter-spacing:-.02em}
.card-subtitle{font-size:1.125rem;color:var(--muted)}

.def{padding:48px;margin-bottom:32px}
.def p{font-size:clamp(1.15rem,2vw,1.6rem);line-height:1.5;font-weight:500;letter-spacing:-.01em;max-width:880px}
.props{display:grid;grid-template-columns:1fr;gap:24px;margin-bottom:32px}
.prop{padding:32px}
.prop h3{font-size:1.25rem;font-weight:700;margin-bottom:12px}
.prop p{color:var(--muted);line-height:1.6;font-size:.95rem}
.notation{padding:32px;display:grid;grid-template-columns:1fr;gap:24px}
.notation .sym{font-size:2.5rem;font-weight:900;letter-spacing:-.03em;line-height:1}
.notation h3{font-size:1rem;font-weight:700;margin:12px 0 6px}
.notation p{color:var(--muted);font-size:.9rem;line-height:1.55}

.algo{padding:48px;margin-bottom:48px;border-radius:2px}
.io{font-size:.8rem;color:var(--muted);line-height:1.7;max-width:420px}
.io b{color:var(--ink);font-weight:500;margin-right:8px}

.viz{margin-bottom:40px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.presets,.inputs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:500 13px 'JetBrains Mono',monospace;padding:8px 16px;border-radius:999px;border:1px solid var(--gb-strong);background:var(--glass-strong);color:var(--ink);cursor:pointer;transition:all .3s}
.btn:hover{background:var(--ink);color:var(--inv)}
.btn.solid{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.btn.solid:hover{opacity:.8}
.btn[disabled]{opacity:.35;pointer-events:none}
.lab{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);display:flex;align-items:center;gap:8px}
.in{font:400 13px 'JetBrains Mono',monospace;padding:8px 12px;border-radius:12px;border:1px solid var(--gb-strong);background:var(--glass-strong);color:var(--ink);min-width:0}
.in.arr{width:min(320px,62vw)}
.in.x{width:72px}
.hint{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);min-height:1.2em;margin-bottom:8px}
.viz-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.stage{padding:24px;border-radius:4px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:32px;margin-bottom:16px}
.chip{font:500 12px 'JetBrains Mono',monospace;padding:5px 12px;border-radius:999px;border:1px solid var(--gb-strong);background:var(--glass)}
.chip i{font-style:normal;color:var(--muted);margin-right:8px}
.chip.stat{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.chip.stat i{color:inherit;opacity:.65}
.board{overflow-x:auto;padding-bottom:6px;min-height:250px}
.cells{display:flex;gap:6px;align-items:flex-end;width:max-content;max-width:none;margin:0 auto;padding:0 4px}
.cell{flex:0 0 42px;display:flex;flex-direction:column;align-items:stretch;text-align:center;transition:opacity .25s}
.cell .val{font:500 12px 'JetBrains Mono',monospace;height:22px;line-height:22px}
.cell .bar{transition:height .25s,background .25s}
.cell .idx{font:400 11px 'JetBrains Mono',monospace;color:var(--muted);margin-top:6px}
.cell .ptr{font:500 10px 'JetBrains Mono',monospace;line-height:1.25;min-height:54px;padding-top:2px;white-space:nowrap}

.bar,.sw{background:var(--bar);border:1px solid var(--bar-line);border-radius:6px 6px 2px 2px}
.cell.cmp .bar,.sw.cmp{background:var(--ink);border-color:var(--ink)}
.cell.swap .bar,.sw.swap{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px);border-color:var(--ink)}
.cell.found .bar,.sw.found{background:var(--ink);border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.cell.min .bar,.sw.min,.cell.pivot .bar,.sw.pivot,.cell.key .bar,.sw.key{background:var(--bar-mid);border:2px solid var(--ink)}
.cell.sorted .bar,.sw.sorted{background:transparent;border:2px solid var(--ink)}
.cell.le .bar,.sw.le,.cell.runL .bar,.sw.runL{background:var(--bar-mid);border-color:var(--bar-line)}
.cell.runR .bar,.sw.runR{background:repeating-linear-gradient(135deg,var(--bar-mid) 0 3px,transparent 3px 6px);border-color:var(--bar-line)}
.cell.dim{opacity:.22}
.sw.dim{opacity:.25}
.cell.hole .bar,.sw.hole{background:transparent;border:1.5px dashed var(--bar-line)}
.cell.cmp .val,.cell.found .val,.cell.swap .val,.cell.min .val,.cell.pivot .val,.cell.key .val{font-weight:700}

.aux{margin-top:18px}
.aux-lab{font:500 11px 'JetBrains Mono',monospace;color:var(--muted);margin:14px 4px 6px;text-align:center}
.abox .box{height:36px;display:grid;place-items:center;font:500 12px 'JetBrains Mono',monospace;border:1.5px dashed var(--bar-line);border-radius:6px}
.abox.swap .box{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px);border:1.5px solid var(--ink);font-weight:700;background-color:var(--bg)}
.abox.sorted .box{border:2px solid var(--ink)}
.abox .ptr{min-height:22px}

.note{font-size:.95rem;line-height:1.55;min-height:4.4em;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.extra:empty{display:none}
.extra{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.tree-cap{font-size:11px;color:var(--muted);margin-bottom:8px}
.tree-wrap{overflow-x:auto}
.tn circle{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.tn text{fill:var(--ink);font:500 10px 'JetBrains Mono',monospace}
.tn.vis circle{fill:var(--ink)}
.tn.vis text{fill:var(--inv)}
.tn.cur circle{stroke-width:3.5}
.te{stroke:var(--bar-line);stroke-width:1.2}
.te.on{stroke:var(--ink);stroke-width:2.2}

.code{padding:20px;border-radius:4px;font:400 12.5px/1.6 'JetBrains Mono',monospace;align-self:start}
.code-title{font-size:.75rem;color:var(--muted);margin-bottom:12px}
.ln{display:flex;gap:10px;padding:2px 8px;border-radius:6px;color:var(--muted);transition:background .2s,color .2s}
.ln .no{opacity:.55;min-width:18px;text-align:right}
.ln .tx{white-space:pre-wrap}
.ln.on{background:var(--ink);color:var(--inv)}
.ln.proc .tx{font-weight:500}

.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.ctl input[type=range]{flex:1 1 180px;accent-color:var(--ink);min-width:120px}
.ctl select{font:500 12px 'JetBrains Mono',monospace;padding:8px 30px 8px 14px;border-radius:999px;border:1px solid var(--gb-strong);color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none;
  background-color:var(--glass-strong);
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;transition:all .3s}
.ctl select:hover{background-color:var(--hover)}
select option{background:var(--bg);color:var(--ink)}
.count{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);min-width:64px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px;font:400 12px 'JetBrains Mono',monospace;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:8px}
.sw{width:16px;height:16px;border-radius:4px;display:inline-block}

.rx{display:flex;flex-direction:column;gap:14px}
.rx-row{display:flex;gap:12px;align-items:center}
.rx-lab{font:500 12px 'JetBrains Mono',monospace;color:var(--muted);min-width:14px}
.rx-list{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;align-items:center}
.rx-empty{font:400 12px 'JetBrains Mono',monospace;color:var(--muted)}
.rx-cur{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);display:flex;gap:10px;align-items:center;min-height:34px}
.nchip{font:500 13px 'JetBrains Mono',monospace;padding:5px 9px;border-radius:8px;border:1px solid var(--bar-line);background:var(--bar);display:inline-block}
.nchip.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.nchip .lz{opacity:.35}
.nchip .dg.hi{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px;font-weight:700}
.rx-buckets{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.rx-b{border:1px solid var(--bar-line);border-radius:8px;padding:8px;min-height:74px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.rx-b.on{border:2px solid var(--ink)}
.rx-h{font:500 11px 'JetBrains Mono',monospace;color:var(--muted)}
.rx-b .nchip{font-size:12px;padding:4px 7px}

.algo-text{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;border-top:1px solid var(--line);padding-top:32px}
.algo-text h4{font-size:.75rem;font-family:'JetBrains Mono',monospace;color:var(--muted);font-weight:500;margin-bottom:12px}
.algo-text p{line-height:1.65;color:var(--ink);margin-bottom:16px;max-width:64ch}
.key{padding:20px 24px;border-radius:4px;margin-bottom:16px}
.key p{margin:0;font-weight:500}
.nt{margin-bottom:20px;padding:16px 20px 16px 22px;border-left:3px solid var(--muted);border-radius:0 8px 8px 0;background:color-mix(in srgb,var(--ink) 4%,transparent);backdrop-filter:blur(6px);max-width:68ch}
.nt b{display:block;margin-bottom:6px;font-weight:700;font-size:.85rem;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.nt span{color:var(--ink);opacity:.78;line-height:1.65;display:block;font-size:.92rem}
.prof-intro{margin:40px auto 28px;padding:20px 24px;border-radius:12px;background:color-mix(in srgb,var(--ink) 4%,transparent);backdrop-filter:blur(6px);max-width:68ch;line-height:1.65;font-size:.93rem;color:var(--ink);opacity:.85;border:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}
.tbl-wrap{overflow-x:auto;margin-bottom:24px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font:500 12px 'JetBrains Mono',monospace;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
td.th{font:500 13px 'JetBrains Mono',monospace;min-width:96px}
td.mn{color:var(--muted)}
.tbl-title{font-weight:700;margin-bottom:8px}
.todo{padding:32px;border-radius:4px;border-style:dashed;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.9rem}
.algo.later{opacity:.6}

.cheat{padding:32px;border-radius:2px;margin-bottom:32px}
.grow{padding:32px;border-radius:2px}
.grow input[type=range]{width:100%;accent-color:var(--ink);margin:16px 0 24px}
.g-row{display:grid;grid-template-columns:90px 1fr 120px;gap:16px;align-items:center;margin-bottom:12px;font:500 13px 'JetBrains Mono',monospace}
.g-bar{height:12px;border-radius:6px;background:var(--bar);overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .2s}
.g-val{text-align:right}
.g-cap{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);margin-top:16px}

.footer{position:relative;z-index:1;padding:80px 24px;border-top:1px solid var(--line);text-align:center;margin-top:64px}
.footer-text{color:var(--muted);font:400 .875rem 'JetBrains Mono',monospace;margin-bottom:16px}

@media (min-width:768px){
  .scroll-indicator{display:block}
  .section{padding:96px 80px 32px}
  .index{width:min(1120px,calc(100% - 160px))}
  .hero-section{padding:80px}
  .subtitle-glass{font-size:1.25rem}
  .contact-links{font-size:1rem}
  .props{grid-template-columns:repeat(2,1fr)}
  .notation{grid-template-columns:repeat(3,1fr)}
  .rx-buckets{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (min-width:1000px){
  .viz-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .algo-text{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .props{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:767px){
  .algo,.def{padding:24px}
  .cheat,.grow{padding:20px}
  .g-row{grid-template-columns:64px 1fr 84px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .liquid-blob{display:none}
}

/* ---------- Reductions page additions ---------- */
.te.dim{opacity:.18}
.te.dash{stroke-dasharray:5 4}
.te.hot{stroke:var(--ink);stroke-width:3.6}
.tn.dim{opacity:.3}
.tn rect{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.tn.vis rect{fill:var(--ink)}
.tn.cur rect{stroke-width:3.5}
.ew{fill:var(--muted);font:500 9px 'JetBrains Mono',monospace;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.ew.hot{fill:var(--ink);font-weight:700}
.lab-cap{fill:var(--muted);font:500 10px 'JetBrains Mono',monospace}
.fm{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.chip.no{opacity:.4}
.algo-text .mcase-list{color:var(--ink);max-width:64ch;line-height:1.65;margin-bottom:16px}
.algo-text .mcase-list li{margin-bottom:6px}
.algo-text .mcase-list li:last-child{margin-bottom:0}
.card-full{margin-top:28px}
.card-full .widget{margin-bottom:0}
.mapn rect{fill:var(--bg);stroke:var(--ink);stroke-width:1.2;cursor:pointer;transition:fill .2s,stroke-width .2s}
.mapn text{fill:var(--ink);font:500 11px 'JetBrains Mono',monospace;pointer-events:none}
.mapn:hover rect{fill:var(--hover)}
.mapn.sel rect{fill:var(--ink)}
.mapn.sel text{fill:var(--inv)}
.mapn.to rect{stroke-width:3.2}
.mapn.from rect{fill:var(--bar-mid)}
.mapn.dim{opacity:.3}
.mapn:focus-visible{outline:none}
.mapn:focus-visible rect{stroke-width:3.2}
.mapn{outline:none}
.hero-sub{margin:28px 0 0}
select.in{padding-right:28px;cursor:pointer}
.cap{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);margin-top:12px;line-height:1.6}

/* ---------- editorial note callouts ---------- */
.nt{margin-bottom:20px;padding:16px 20px 16px 22px;border-left:3px solid var(--muted);border-radius:0 8px 8px 0;background:color-mix(in srgb,var(--ink) 4%,transparent);backdrop-filter:blur(6px);max-width:68ch}
.nt b{display:block;margin-bottom:6px;font-weight:700;font-size:.85rem;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.nt span{color:var(--ink);opacity:.78;line-height:1.65;display:block;font-size:.92rem}
.prof-intro{margin:40px auto 28px;padding:20px 24px;border-radius:12px;background:color-mix(in srgb,var(--ink) 4%,transparent);backdrop-filter:blur(6px);max-width:68ch;line-height:1.65;font-size:.93rem;color:var(--ink);opacity:.85;border:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}

/* ---------- animations ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes subtlePulse{0%,100%{box-shadow:0 0 0 0 rgba(10,10,10,.12)}50%{box-shadow:0 0 0 8px rgba(10,10,10,0)}}

.hero-section h1{animation:fadeUp .9s cubic-bezier(.22,1,.36,1) both}
.subtitle-glass{animation:fadeUp .9s cubic-bezier(.22,1,.36,1) .15s both}
.contact-links{animation:fadeUp .9s cubic-bezier(.22,1,.36,1) .3s both}
.index{animation:slideDown .5s cubic-bezier(.22,1,.36,1) .5s both}

.reveal{opacity:0;transform:translateY(28px);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
.reveal.visible{opacity:1;transform:translateY(0)}

.algo,.def,.prop{transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s}
.algo:hover,.def:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.08)}

.cross-link{animation:subtlePulse 3s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1!important;transform:none!important}
  .hero-section h1,.subtitle-glass,.contact-links,.index,.cross-link{animation:none!important}
}

/* ---------- polish layer (shared by both pages) ---------- */
:root{
  --r-lg:20px;--r-md:14px;--r-sm:10px;
  --shadow:0 1px 2px rgba(10,10,10,.04),0 8px 28px -12px rgba(10,10,10,.10);
  --shadow-up:0 2px 4px rgba(10,10,10,.05),0 18px 40px -16px rgba(10,10,10,.16);
  --tint:rgba(10,10,10,.035);--tint-2:rgba(10,10,10,.06);
  --nav-bg:rgba(250,250,250,.92);--nav-solid:#FAFAFA;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -14px rgba(0,0,0,.7);
    --shadow-up:0 1px 0 rgba(255,255,255,.06) inset,0 20px 44px -18px rgba(0,0,0,.85);
    --tint:rgba(255,255,255,.04);--tint-2:rgba(255,255,255,.07);
    --nav-bg:rgba(14,14,14,.92);--nav-solid:#0E0E0E;
  }
}
:root[data-theme="dark"]{
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-up:0 1px 0 rgba(255,255,255,.06) inset,0 20px 44px -18px rgba(0,0,0,.85);
  --tint:rgba(255,255,255,.04);--tint-2:rgba(255,255,255,.07);
  --nav-bg:rgba(14,14,14,.92);--nav-solid:#0E0E0E;
}

html{scroll-padding-top:96px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-feature-settings:'cv11','ss01';text-rendering:optimizeLegibility}
::selection{background:var(--ink);color:var(--inv)}
.mono,.io,.btn,.chip,.code,.count,td.th,.g-row{font-variant-numeric:tabular-nums}

/* hero */
.hero-section h1{letter-spacing:-.05em}
.subtitle-glass{border-radius:999px;padding:12px 24px;font-size:1.05rem;box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.contact-links{gap:10px}
.contact-links a{color:var(--ink);padding:9px 16px;border-radius:999px;border:1px solid var(--gb-strong);background:var(--glass-strong);font-size:.82rem;transition:background .25s,color .25s,border-color .25s}
.contact-links a:hover{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.contact-links a:first-child{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.contact-links a:first-child:hover{opacity:.85}

/* nav: solid glass, soft shadow, fades at the edges so it reads as scrollable */
.index{background:var(--nav-bg);border-color:var(--gb-strong);box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);padding:6px 0;scroll-behavior:smooth}
.index::before,.index::after{content:"";position:sticky;flex:0 0 22px;align-self:stretch;margin:-6px 0;z-index:2;pointer-events:none}
.index::before{left:0;background:linear-gradient(90deg,var(--nav-solid) 30%,transparent)}
.index::after{right:0;background:linear-gradient(270deg,var(--nav-solid) 30%,transparent)}
.index a,.index button{font-size:11.5px;padding:7px 13px;letter-spacing:.01em}
.index a.on{box-shadow:0 4px 12px -4px rgba(0,0,0,.35)}
.index .sep{margin:0 6px}

/* sections */
main{counter-reset:sec}
.section{padding-top:112px}
.sec-head{counter-increment:sec;margin-bottom:40px;max-width:720px;padding-top:4px}
.sec-head::before{content:counter(sec,decimal-leading-zero);display:inline-block;font:500 11px 'JetBrains Mono',monospace;color:var(--muted);letter-spacing:.08em;padding:4px 10px;border:1px solid var(--gb-strong);border-radius:999px;margin-bottom:16px}
.sec-head h2{letter-spacing:-.035em}
.sec-head p{font-size:1.05rem;line-height:1.6;max-width:62ch}

/* cards */
.algo,.def,.prop,.notation,.cheat,.grow{border-radius:var(--r-lg);box-shadow:var(--shadow)}
.algo{margin-bottom:40px}
.def{padding:44px 48px}
.def p{letter-spacing:-.015em;text-wrap:pretty}
.prop{padding:28px}
.prop h3{font-size:1.05rem;letter-spacing:-.01em}
.prop p{font-size:.92rem}
.notation .sym{font-size:2.25rem}
.stage,.code,.key,.todo,.widget{border-radius:var(--r-md)}
.stage{box-shadow:inset 0 0 0 1px var(--gb)}
.code{background:var(--tint);border-color:transparent}
.ln{border-radius:7px}

/* no lift on big interactive cards; keep a light lift on small ones */
.algo:hover,.cheat:hover,.grow:hover,.def:hover{transform:none;box-shadow:var(--shadow)}
.prop:hover{transform:translateY(-2px);box-shadow:var(--shadow-up)}

/* card header */
.card-header{margin-bottom:28px;align-items:flex-start}
.project-type{display:inline-block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--tint-2);color:var(--ink);opacity:.75;margin-bottom:14px}
.card-title{font-size:clamp(1.6rem,2.6vw,2rem);letter-spacing:-.03em;line-height:1.15}
.card-subtitle{font-size:1.05rem;line-height:1.5;max-width:60ch}
.io{padding:12px 16px;border-radius:var(--r-sm);background:var(--tint);line-height:1.75}

/* controls */
.btn,.ctl select,.in{transition:background .2s,color .2s,border-color .2s,opacity .2s}
.btn:active{transform:translateY(1px)}
.in:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--tint-2)}
.chip{background:var(--glass-strong)}
.ctl{padding:10px 12px;border-radius:999px;background:var(--tint);margin-top:18px}
.ctl input[type=range]{height:4px}
.legend{margin-top:14px;padding-left:4px}
.note{font-size:.98rem;line-height:1.6}

/* reading text */
.algo-text{gap:40px;padding-top:36px;margin-top:8px}
.algo-text h4{display:flex;align-items:center;gap:10px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;margin:4px 0 12px}
.algo-text h4::after{content:"";flex:1;height:1px;background:var(--line)}
.algo-text p{font-size:1rem;line-height:1.7;text-wrap:pretty}
.algo-text p + h4,.algo-text ol + h4,.algo-text ul + h4,.algo-text .key + h4,.algo-text .nt + h4,.algo-text .tbl-wrap + h4{margin-top:28px}

/* key idea: solid ink rule; notes: muted rule */
.key{border:0;border-left:3px solid var(--ink);border-radius:0 var(--r-md) var(--r-md) 0;background:var(--tint);padding:18px 22px}
.key p{line-height:1.6}
.nt{border-left-color:var(--bar-line);background:var(--tint);border-radius:0 var(--r-md) var(--r-md) 0;backdrop-filter:none}
.nt b{font-size:.68rem;letter-spacing:.1em;margin-bottom:8px}
.nt span{opacity:.82}

/* tables */
.tbl-wrap{border:1px solid var(--gb-strong);border-radius:var(--r-md);overflow:auto}
table{font-size:.9rem}
thead th{background:var(--tint);border-bottom:1px solid var(--gb-strong);padding:12px 14px;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase}
td{padding:12px 14px}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--tint)}
.tbl-title{font-size:.95rem;letter-spacing:-.01em;margin:4px 0 10px}
.cheat{padding:28px}
.cheat .tbl-wrap{margin-bottom:0}

/* homework intro: same family as .nt, full width */
.nt.prof-intro{max-width:none;margin:56px 0 28px;padding:22px 26px 22px 28px;border:0;border-left:3px solid var(--bar-line);border-radius:0 var(--r-md) var(--r-md) 0;background:var(--tint);opacity:1;font-size:inherit}
.nt.prof-intro span{max-width:78ch;font-size:.98rem}

/* homework placeholders */
.algo.later{opacity:1;box-shadow:none;background:transparent;border-style:dashed}
.algo.later .card-header{margin-bottom:16px}
.todo{border-radius:var(--r-sm);padding:18px 20px;font-size:.82rem}

/* page-to-page link */
.cross-link{animation:none!important;background:var(--ink)!important;color:var(--inv)!important;border-color:var(--ink)!important;box-shadow:var(--shadow-up);font-family:'Inter',system-ui,sans-serif!important;font-weight:600!important;letter-spacing:-.01em}
.cross-link:hover{opacity:.88}
.footer{padding:64px 24px 72px;margin-top:72px}
.footer-text{margin-bottom:0}

@media (max-width:767px){
  .section{padding:88px 14px 24px}
  .algo,.def{padding:22px 18px;border-radius:16px}
  .stage{padding:16px 12px}
  .code{padding:14px}
  .card-header{margin-bottom:20px}
  .ctl{border-radius:var(--r-md)}
  .sec-head{margin-bottom:28px}
  .index{width:calc(100% - 16px);top:8px;padding:5px 0}
  .algo-text{gap:24px}
  .def p{font-size:1.1rem}
}

/* ---------- mobile alignment fixes (both pages) ---------- */
main ol,main ul{padding-left:1.5em}
main li{padding-left:.15em}
main li::marker{color:var(--muted);font-variant-numeric:tabular-nums}
main p,main li,main td,.nt span,.note,.cap,.card-subtitle,.io div,.key p{overflow-wrap:break-word}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.tree-wrap svg{display:block;margin:0 auto}

@media (max-width:640px){
  /* tables become one small card per row, labelled by column */
  .tbl-wrap{border:0;border-radius:0;overflow:visible}
  .tbl-wrap table,.tbl-wrap tbody,.tbl-wrap tr,.tbl-wrap td{display:block;width:100%}
  .tbl-wrap thead{display:none}
  .tbl-wrap tr{border:1px solid var(--gb-strong);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:10px;background:var(--tint)}
  .tbl-wrap tbody tr:hover{background:var(--tint)}
  .tbl-wrap td{border:0;padding:4px 0;display:grid;grid-template-columns:minmax(78px,32%) minmax(0,1fr);gap:10px;align-items:baseline}
  .tbl-wrap td::before{content:attr(data-label);font:500 .64rem 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .tbl-wrap td:first-child{display:block;font-weight:700;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  .tbl-wrap td:first-child::before{display:none}
  .tbl-wrap td.th{min-width:0}
  /* bars: fit a 10-element array across a phone */
  .cells{gap:4px}
  .cell .val{font-size:11px}
  .cell .ptr{font-size:9px}
  .stage{padding:14px 10px}
  .inputs{width:100%}
  .inputs .in.arr{flex:1 1 160px;width:auto}
  .legend{gap:6px 14px}
}

/* bars shrink to fit the panel instead of scrolling */
.cells{width:100%;justify-content:center}
.cell{flex:1 1 0;min-width:20px;max-width:42px}

.tp-link{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font:500 13px 'JetBrains Mono',monospace;color:var(--ink);text-decoration:none;padding:9px 16px;border-radius:999px;border:1px solid var(--gb-strong);background:var(--glass-strong);transition:background .2s,color .2s}
.tp-link:hover{background:var(--ink);color:var(--inv)}

/* ---------- diagrams: shared palette + node/edge styles ---------- */
:root{
  --d-blue:#2563EB;--d-green:#059669;--d-amber:#D97706;--d-rose:#E11D48;--d-violet:#7C3AED;--d-teal:#0891B2;
  --d-edge:#A8B1BE;--d-edge-strong:#475569;--d-node:#FFFFFF;--d-node-stroke:#334155;--d-text:#0F172A;--d-on:#FFFFFF;--d-muted:#64748B;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --d-blue:#60A5FA;--d-green:#34D399;--d-amber:#FBBF24;--d-rose:#FB7185;--d-violet:#A78BFA;--d-teal:#22D3EE;
    --d-edge:#3F4A5A;--d-edge-strong:#94A3B8;--d-node:#12161D;--d-node-stroke:#CBD5E1;--d-text:#F1F5F9;--d-on:#0A0A0A;--d-muted:#94A3B8;
  }
}
:root[data-theme="dark"]{
  --d-blue:#60A5FA;--d-green:#34D399;--d-amber:#FBBF24;--d-rose:#FB7185;--d-violet:#A78BFA;--d-teal:#22D3EE;
  --d-edge:#3F4A5A;--d-edge-strong:#94A3B8;--d-node:#12161D;--d-node-stroke:#CBD5E1;--d-text:#F1F5F9;--d-on:#0A0A0A;--d-muted:#94A3B8;
}

/* hue helpers: set --h on a node, edge or swatch */
.h-blue{--h:var(--d-blue)}.h-green{--h:var(--d-green)}.h-amber{--h:var(--d-amber)}
.h-rose{--h:var(--d-rose)}.h-violet{--h:var(--d-violet)}.h-teal{--h:var(--d-teal)}

svg.dg{overflow:visible}
.dg text{font-family:'JetBrains Mono',ui-monospace,monospace}

/* nodes */
.dg .tn circle,.dg .tn rect{fill:var(--d-node);stroke:var(--d-node-stroke);stroke-width:1.8;transition:fill .25s,stroke .25s,opacity .25s}
.dg .tn text{fill:var(--d-text);font-size:12px;font-weight:600;transition:fill .25s}
.dg .tn[class*="h-"] circle,.dg .tn[class*="h-"] rect{fill:color-mix(in srgb,var(--h) 16%,var(--d-node));stroke:var(--h);stroke-width:2.2}
.dg .tn.solid circle,.dg .tn.solid rect,
.dg .tn.vis circle,.dg .tn.vis rect{fill:var(--h,var(--vis-h,var(--d-blue)));stroke:var(--h,var(--vis-h,var(--d-blue)))}
.dg .tn.solid text,.dg .tn.vis text{fill:var(--d-on)}
.dg .tn.cur circle,.dg .tn.cur rect{fill:color-mix(in srgb,var(--cur-h,var(--d-blue)) 18%,var(--d-node));stroke:var(--cur-h,var(--d-blue));stroke-width:3.4}
.dg .tn.dim{opacity:.38}

/* edges */
.dg .te{stroke:var(--d-edge);stroke-width:2.2;stroke-linecap:round;fill:none;transition:stroke .25s,opacity .25s,stroke-width .25s}
.dg .te.on{stroke:var(--d-edge-strong)}
.dg .te[class*="h-"]{stroke:var(--h)}
.dg .te.thick{stroke-width:4}
.dg .te.hot{stroke:var(--hot-h,var(--d-blue));stroke-width:4.5}
.dg .te.dash{stroke-dasharray:6 5}
.dg .te.dim{opacity:.16}
.dg .area{stroke-width:2;fill-opacity:.10}
.dg .area[class*="h-"]{stroke:var(--h);fill:var(--h)}

/* labels */
.dg .lab-cap{fill:var(--d-muted);font-size:11px;font-weight:600;letter-spacing:.06em}
.dg .lab-h{fill:var(--h);font-size:12px;font-weight:700}
.dg .lab-big{fill:var(--d-text);font-size:14px;font-weight:700}
.dg .ew{fill:var(--d-muted);font-size:11px;font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.dg .ew.w1{fill:var(--d-edge-strong)}
.dg .ew.w2{fill:var(--d-amber)}
.dg .ew.hot{fill:var(--d-green)}
.dg .arrow-fill{fill:var(--d-edge-strong)}

/* per-visualizer meaning */
[data-viz="circuit"]{--vis-h:var(--d-green);--cur-h:var(--d-blue)}
[data-viz="circuit"] .dg .te.one{stroke:var(--d-green);stroke-width:3.4}
[data-viz="hc"]{--vis-h:var(--d-blue);--hot-h:var(--d-green)}
[data-viz="hc"] .dg .te.dash{stroke:var(--d-amber)}
[data-viz="clique"],.fig-clique{--hot-h:var(--d-violet);--cur-h:var(--d-blue)}
[data-viz="clique"] .dg .tn.vis circle,.fig-clique .dg .tn.vis circle{fill:var(--d-violet);stroke:var(--d-violet)}
[data-viz="vcis"]{--vis-h:var(--d-amber)}
[data-viz="vcis"] .dg .tn.cur circle{fill:var(--d-teal);stroke:var(--d-teal);stroke-width:1.8}
[data-viz="vcis"] .dg .tn.cur text{fill:var(--d-on)}
[data-viz="vcis"] .dg .tn.clq circle{fill:var(--d-violet);stroke:var(--d-violet)}
[data-viz="vc"],[data-viz="vc3"],.fig-vc{--vis-h:var(--d-amber);--cur-h:var(--d-green)}
.dg .te.e-var{stroke:var(--d-blue);stroke-width:3}
.dg .te.e-cl{stroke:var(--d-violet);stroke-width:3}
.dg .te.e-con{stroke:var(--d-edge-strong);stroke-dasharray:5 5}

/* legend swatches */
.sw.k-green{background:var(--d-green);border-color:var(--d-green)}
.sw.k-blue{background:var(--d-blue);border-color:var(--d-blue)}
.sw.k-amber{background:var(--d-amber);border-color:var(--d-amber)}
.sw.k-violet{background:var(--d-violet);border-color:var(--d-violet)}
.sw.k-teal{background:var(--d-teal);border-color:var(--d-teal)}
.sw.k-rose{background:var(--d-rose);border-color:var(--d-rose)}
.sw.k-ring-blue{background:color-mix(in srgb,var(--d-blue) 18%,transparent);border:2.5px solid var(--d-blue)}
.sw.k-ring-green{background:color-mix(in srgb,var(--d-green) 18%,transparent);border:2.5px solid var(--d-green)}
.sw.k-line{background:var(--d-edge-strong);border-color:var(--d-edge-strong);height:4px;border-radius:2px}
.sw.k-dash-amber{background:transparent;border:0;border-top:3px dashed var(--d-amber);height:0;border-radius:0}
.sw.k-line-green{background:var(--d-green);border-color:var(--d-green);height:5px;border-radius:3px}
.sw.k-line-blue{background:var(--d-blue);border-color:var(--d-blue);height:4px;border-radius:2px}
.sw.k-line-violet{background:var(--d-violet);border-color:var(--d-violet);height:4px;border-radius:2px}
.sw.k-dash{background:transparent;border:0;border-top:3px dashed var(--d-edge-strong);height:0;border-radius:0}

/* yes / no result chips */
.chip.stat.yes{background:var(--d-green);border-color:var(--d-green);color:var(--d-on)}
.chip.stat.no{background:var(--d-rose);border-color:var(--d-rose);color:var(--d-on)}
.chip.stat.yes i,.chip.stat.no i{color:inherit;opacity:.75}

/* 3SAT clause chips */
.chip .lit-new{color:var(--d-amber);font-weight:700}
.fm .chip.on{background:color-mix(in srgb,var(--d-blue) 14%,transparent);border-color:var(--d-blue);color:var(--d-text)}
.fm .chip.on .lit-new{color:var(--d-amber)}

/* reduction map */
.mapn rect{fill:color-mix(in srgb,var(--h,var(--d-edge)) 14%,var(--d-node));stroke:var(--h,var(--d-node-stroke));stroke-width:1.8}
.mapn text{fill:var(--d-text);font-size:12px;font-weight:600}
.mapn:hover rect{fill:color-mix(in srgb,var(--h) 26%,var(--d-node))}
.mapn.sel rect{fill:var(--h);stroke:var(--h)}
.mapn.sel text{fill:var(--d-on)}
.mapn.to rect{stroke:var(--d-blue);stroke-width:3.2;fill:color-mix(in srgb,var(--d-blue) 14%,var(--d-node))}
.mapn.from rect{stroke:var(--d-amber);stroke-width:3.2;fill:color-mix(in srgb,var(--d-amber) 14%,var(--d-node))}
.mapn.dim{opacity:.28}
.map-legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font:400 12px 'JetBrains Mono',monospace;color:var(--muted)}

/* figure captions inside cards */
.fig{margin:4px 0 20px}
.fig .cap{text-align:center;max-width:none}
.algo-text .fig svg{max-width:100%}
.dg .tn.cur.fresh circle{stroke:var(--d-blue);fill:color-mix(in srgb,var(--d-blue) 18%,var(--d-node))}
.sw.k-ring-rose{background:color-mix(in srgb,var(--d-rose) 18%,transparent);border:2.5px solid var(--d-rose)}
@media (max-width:767px){
  [data-w="redmap"] .widget > svg{min-width:640px}
  [data-w="redmap"] .widget{overflow-x:auto;-webkit-overflow-scrolling:touch}
  [data-w="redmap"] .cap::before{content:"Swipe the map sideways. ";font-weight:600}
}

/* homework visualizers */
.dg .te.arc{stroke:var(--d-blue);stroke-width:2;opacity:.85}
.dg .te.arc.dim{opacity:.18}
.dg .te.arc-hot{stroke:var(--d-green);stroke-width:3.6}
.dg .arrow-blue{fill:var(--d-blue)}
.dg .arrow-hot{fill:var(--d-green)}
.dg .tn.ghost text{font-size:10px}
.sw.k-ring-violet{background:color-mix(in srgb,var(--d-violet) 18%,transparent);border:2.5px solid var(--d-violet)}
.dg .tn.vis.cur text,.dg .tn.cur text{fill:var(--d-text)}

/* ===== Review: Graphs ===== */
{sec:'graph-review',group:'Graphs review',id:'graphs-basics',title:`Graphs and Trees (Review)`,tagline:`Vertices, edges, degree and the handshaking theorem.`,cols:[
 [{svg:'g1'},
  {p:`A graph G = (V, E) is a set of vertices V and edges E. A tree is a connected graph with no cycles. The example G₁ has V = {a, b, c, d} and E = {(a,b), (a,c), (b,c), (b,b), (c,d)}. It is not a tree: it has the cycle (a, b, c) and a self-loop on b.`},
  {p:`A simple graph has no loops and no repeated edges between the same pair of vertices.`},
  {svg:'treeTypes'}],
 [{sub:`Degree`},
  {p:`The degree of a vertex is the number of edges touching it; a self-loop counts twice. In G₁: deg(a) = 2, deg(b) = 4 (two edges plus the loop counted twice), deg(c) = 3, deg(d) = 1. Total: 10.`},
  {key:`Handshaking theorem (undirected): the degrees sum to 2|E|. Each edge adds 1 to each of its two ends, and a self-loop adds 2 to its one end. So |E| = (sum of degrees)/2. In G₁, 10/2 = 5 edges, matching the list.`},
  {p:`In a directed graph, each vertex has an in-degree (edges in) and an out-degree (edges out). Each edge leaves one vertex and enters one, so sum of in-degrees = sum of out-degrees = |E|.`}]]},

{sec:'graph-review',group:'Graphs review',id:'rooted-iso',title:`Rooted Trees & Isomorphic Graphs`,tagline:`Height, and when two graphs are secretly the same graph.`,cols:[
 [{sub:`Rooted trees`},{svg:'rooted'},
  {p:`A rooted tree is a tree with one vertex chosen as the root. Its height is the maximum depth: the longest path from the root down to a leaf.`},
  {nt:`Depth convention`,b:`In the drawing above, the root has depth 0. Some courses put the root at depth 1, which adds one to every depth and to the height. Check which convention the professor uses.`}],
 [{sub:`Isomorphic graphs`},{svg:'iso'},
  {p:`G₁ = (V₁, E₁) and G₂ = (V₂, E₂) are isomorphic (G₁ ≅ G₂) if there is a one-to-one, onto map θ: V₁ → V₂ with (x, y) ∈ E₁ ⇔ (θ(x), θ(y)) ∈ E₂. They are the same graph with the vertices renamed; θ is the isomorphism. For rooted trees, θ must also map root to root.`},
  {key:`To compare two graphs, check the easy counts first: vertices, edges and degrees. If any differ, they are not isomorphic. If all match, that proves nothing yet: you still have to find θ.`}]]},

{sec:'graph-review',group:'Graphs review',id:'coloring',title:`Graph Coloring`,tagline:`How many colors does a graph need, and why a clique gives a lower bound.`,cols:[
 [{svg:'coloring'},
  {p:`A coloring gives each vertex a color C(x) with C(x) ≠ C(y) for every edge (x, y): adjacent vertices differ. Coloring is defined on simple graphs, since a self-loop would demand C(x) ≠ C(x), so a graph with one cannot be colored at all. The chromatic number χ(G) is the fewest colors needed.`}],
 [{key:`Theorem: χ(G) ≥ the size of the largest clique (a set of vertices all joined to each other). Each clique vertex touches all the others, so each needs its own color. In the example, the clique {b, e, f, h} has size 4, so χ(G) ≥ 4.`},
  {p:`To show χ(G) = 4 exactly, also give a valid 4-coloring. The clique proves only the lower bound.`}]]},

/* ===== P and NP ===== */
{sec:'np-basics',group:'P and NP',id:'decision-opt',title:`Decision vs. Optimization`,tagline:`A yes/no question, versus asking for the best value.`,cols:[
 [{p:`A decision problem has a yes/no answer; an optimization problem asks for the best value (minimum or maximum). For a graph G = (V, E), "Is G 3-colorable?" and "Is there a clique of size 5?" are decision problems. "Find χ(G)" and "Find a maximum clique" are optimization problems.`}],
 [{key:`Decision → optimization by binary search on k. For coloring, call Colorable(G, k) for different k; the smallest k that returns yes is χ(G). For clique, the largest k for which Clique(G, k) returns yes is the maximum clique size.`},
  {p:`If the decision algorithm takes O(nᶜ), the optimization takes O(nᶜ log n): k ≤ |V|, so binary search needs about log n calls. An easy decision problem means an easy optimization problem. This finds the optimal value only; recovering an actual coloring or clique takes a few more calls, fixing one vertex at a time.`}]]},

{sec:'np-basics',group:'P and NP',id:'class-p',title:`Polynomial Time and Class P`,tagline:`Tractable problems, and why input-size units can hide an exponential.`,cols:[
 [{sub:`Polynomial time (tractable)`},
  {p:`A problem is tractable if it can be solved in O(nᵏ) time for some constant k, where n is the input size. Otherwise it is intractable.`},
  {p:`Sorting n elements takes O(n log n), so it is tractable.`},
  {nt:`Factorization looks polynomial but isn’t`,b:`To find a divisor of n, try d = 2, 3, …, ⌊√n⌋. That is O(√n) steps, which looks polynomial. But the input is a number, so its size is its bit length k, with n = Θ(2ᵏ). The time is O(√n) = O(2^(k/2)): exponential, so intractable. For number problems, input size means bits, not the value.`}],
 [{sub:`Class P`},
  {p:`A deterministic algorithm has one choice at each step. P is the set of decision problems a deterministic algorithm solves in polynomial time. Examples: "Is the array sorted?" (O(n)) and "Is G 2-colorable?" (polynomial, since G is 2-colorable exactly when it has no odd cycle).`},
  {key:`Theorem: P is closed under complementation. Flip the yes/no answer of a polynomial algorithm and you solve the complement in the same time. So Not-sorted and Not-2-colorable are in P.`}]]},

{sec:'np-basics',group:'P and NP',id:'class-np',title:`Class NP`,tagline:`Guess, then verify, both in polynomial time.`,cols:[
 [{p:`NP is the set of decision problems a nondeterministic algorithm solves in polynomial time. It works in two phases: guess a solution in O(nⁱ), then verify it in O(nʲ). Total: O(nᵏ) with k = max(i, j). Put simply, a problem is in NP if a proposed solution can be checked quickly, even if finding one is hard.`}],
 [{sub:`Example: k-Coloring is in NP`},
  {nt:`Informally`,b:`Given a coloring C(x) of every vertex, check in polynomial time that C(x) ≠ C(y) for each edge (x, y).`},
  {nt:`Formally`,b:`A nondeterministic algorithm (1) guesses C(x) for every x ∈ V in polynomial time, then (2) checks C(x) ≠ C(y) for every edge (x, y) ∈ E in O(n²). Both phases are polynomial, so k-Coloring ∈ NP.`}]]},

/* ===== NP-complete ===== */
{sec:'np-complete',group:'NP-complete',id:'poly-reduction',title:`Polynomial-Time Reductions`,tagline:`Turning one problem into another, and why that shows hardness.`,cols:[
 [{p:`Recall: P is the problems a deterministic algorithm solves in polynomial time; NP is the problems whose solution (witness) can be verified in polynomial time. NP-complete problems are the hardest in NP.`},
  {sub:`Polynomial-time reduction`},
  {p:`A ∝ₚ B (A reduces to B) means any instance of A can be turned, in polynomial time, into an instance of B with the same answer: the A instance is "yes" exactly when the B instance is "yes". Solving B then solves A, so B is at least as hard as A. Example: Sum 15 ∝ₚ Tic-Tac-Toe, converting the game with the magic square.`},
  {key:`Transitivity: if Π₁ ∝ₚ Π₂ and Π₂ ∝ₚ Π₃, then Π₁ ∝ₚ Π₃. Chaining two polynomial conversions stays polynomial.`}],
 [{sub:`SAT (Satisfiability)`},
  {p:`Given a CNF formula (an AND of clauses, each an OR of literals), such as f = (x₁ ∨ x₂) ∧ (x̄₁ ∨ x₂ ∨ x₃), does some truth assignment make f true?`},
  {key:`SAT ∈ NP: n variables give 2ⁿ assignments, too many to try. But one assignment (the witness) is checked in polynomial time: plug it in and evaluate. True means f is satisfiable.`}]]},

{sec:'np-complete',group:'NP-complete',id:'hc-tsp',title:`Hamiltonian Cycle and Traveling Salesman`,tagline:`A first complete reduction, HC ∝ₚ TSP.`,cols:[
 [{sub:`Hamiltonian Cycle (HC)`},
  {p:`Given a graph G, is there a cycle that visits every vertex exactly once? Of the two 6-vertex graphs in the notes, the first has one and the second does not. (This G₁ is not the 4-vertex G₁ from the review section.)`},
  {sub:`Traveling Salesman (TSP; the lecture notes write TS)`},
  {p:`Given n cities, the distances between them and a threshold k, is there a tour (a cycle visiting each city once) of length ≤ k? For G₃, TSP(G₃, 10) = No and TSP(G₃, 15) = Yes.`}],
 [{sub:`HC ∝ₚ TSP`},
  {p:`From an HC instance G = (V, E) with n vertices, build a TSP instance G′ = (V, E′):`},
  {ol:[`Make G′ complete: E′ holds every pair of distinct vertices, so |E′| = n(n − 1)/2.`,`Weight a pair 1 if (x, y) is an edge of G, and n if not.`,`Set k = n.`]},
  {p:`This is polynomial. A tour has exactly n edges. (⇒) A Hamiltonian cycle of G is a tour of n weight-1 edges: length n ≤ n. (⇐) A tour of length ≤ n uses only weight-1 edges, since one weight-n edge brings the total to at least (n − 1) + n > n. So every edge is in G, and the tour is a Hamiltonian cycle. Hence HC(G) = Yes ⇔ TSP(G′, n) = Yes. In the notes (n = 6): HC(G₁) = Yes and TSP(G₁′, 6) = Yes; HC(G₂) = No and TSP(G₂′, 6) = No.`}]]},

{sec:'np-complete',group:'NP-complete',id:'npc-def',title:`Definition of NP-Complete`,tagline:`In NP, and every problem in NP reduces to it.`,cols:[
 [{p:`A decision problem A is NP-complete if:`},
  {ol:[`A ∈ NP, and`,`every B ∈ NP reduces to A in polynomial time (B ∝ₚ A). This second property is called NP-hard.`]},
  {p:`NP-complete = in NP and NP-hard. The diagram shows this for SAT: every NP problem reduces to SAT, and SAT ∈ NP, so SAT is NP-complete (Cook’s theorem).`},
  {svg:'np'}],
 [{p:`With one NP-complete problem in hand, proving a new problem A NP-complete is easier: show A ∈ NP, then reduce a known NP-complete problem to A. Transitivity does the rest. Example: HC ∝ₚ TSP makes TSP NP-hard, and TSP ∈ NP, so TSP is NP-complete.`}]]},

{sec:'np-complete',group:'NP-complete',id:'reduction-map',title:`The Reduction Map`,tagline:`Which problem reduces to which. Click a problem to follow the arrows.`,cols:[
 [{p:`π is NP-complete if (1) π ∈ NP and (2) π is NP-hard: every π′ ∈ NP has π′ ∝ₚ π.`},
  {p:`New NP-complete proofs reduce a known NP-complete problem to the new one; transitivity passes the hardness along. The map starts at Circuit-SAT → SAT, and SAT and 3SAT reduce to each other. SAT reduces to Clique and Vertex Cover (VC). Clique, VC and Independent Set (IS) reduce to each other; VC reduces to Set Cover, and IS to Hamiltonian Cycle (HC) by way of VC (IS → VC → HC). 3SAT reduces to VC, 3Color, HC and Subset Sum. HC reduces to TSP and Directed HC; Subset Sum reduces to Knapsack. Homework reductions: Clique → IS, 3SAT → VC, HC → Directed HC (the study guide lists 3SAT → 3Color instead of Clique → IS, so all four count as homework here).`}],
 []],full:[{w:'redmap'}]},

{sec:'np-complete',group:'NP-complete',id:'clique',title:`Clique is NP-Complete`,tagline:`SAT ∝ₚ Clique, one vertex per literal occurrence.`,cols:[
 [{p:`Clique: given a graph G and k, does G have k vertices all joined to each other?`},
  {nt:`Clique ∈ NP`,b:`The witness is a set of k vertices. Check every pair is an edge, in O(L²) for L vertices.`},
  {nt:`Clique is NP-hard (SAT ∝ₚ Clique)`,b:`Given f = C₁ ∧ … ∧ Cₘ, build G with one vertex per literal occurrence. Join two vertices exactly when they are in different clauses and are not complements (like x and x̄). Set k = m. With L literal occurrences, comparing every pair takes O(L²), which is polynomial.`},
  {nt:`Correctness`,b:`(⇒) Pick one true literal per clause. They are in different clauses and both true, so not complements: pairwise joined, a clique of size m. (⇐) A clique of size m has exactly one vertex per clause (same-clause vertices are never joined) and no complementary pair. Setting its literals true is consistent and satisfies every clause.`}],
 [{nt:`Example`,b:`f = (x ∨ ¬y ∨ z) ∧ (¬x ∨ y) ∧ (¬x ∨ ¬y ∨ z) has m = 3, so k = 3. With x = 0, y = 1, z = 1, the true literals z in C₁, y in C₂ and z in C₃ form the clique.`},
  {w:'cliquefig'}]]},

{sec:'np-complete',group:'NP-complete',id:'is-vc',title:`Independent Set and Vertex Cover`,tagline:`Two sides of the same coin: S is independent exactly when V − S is a cover.`,cols:[
 [{p:`An independent set S has no edge between any two of its vertices. IS asks whether one of size k exists.`},
  {key:`Theorem: S is independent in G ⇔ V − S is a vertex cover of G. No edge has both ends in S ⇔ every edge has an end outside S ⇔ V − S covers every edge.`}],
 [{nt:`VC ∝ₚ IS`,b:`Turn VC(G, k) into IS on the same graph with k′ = |V| − k. The theorem runs both ways, so IS ∝ₚ VC too. Example: |V| = 11, S = {7, 3, 2, 8, 9, 5} has size 6, and the cover V − S = {1, 4, 6, 10, 11} has size 11 − 6 = 5.`},
  {nt:`Clique ∝ₚ IS`,b:`A clique in G is exactly an independent set in the complement graph (edges exactly where G has none). Complement the graph and keep k.`}]]},

{sec:'np-complete',group:'NP-complete',id:'nphard-circuit',title:`NP-Hard, Circuit-SAT, SAT and 3SAT`,tagline:`Where the chain of reductions starts.`,cols:[
 [{p:`A is NP-hard if every π ∈ NP has π ∝ₚ A. A is NP-complete if it is also in NP, like SAT. NP-hard problems need not be in NP: generalized chess is NP-hard but not in NP.`},
  {nt:`One caveat on the chess example`,b:`Generalized chess is known to be outside P, but whether it is outside NP is open: an NP algorithm for it would force NP = EXPTIME, which nobody has ruled out. The safe phrasing is "NP-hard but not believed to be in NP."`},
  {p:`NPI (NP-intermediate) problems are in NP but neither in P nor NP-complete. They exist only if P ≠ NP; factoring and graph isomorphism are the usual suspects.`},
  {sub:`Circuit-SAT`},
  {p:`Circuit-SAT asks whether some input makes a Boolean circuit output true. It is the first NP-complete problem here, and the other proofs start from it. For any π ∈ NP, an instance I can be hard-coded into a circuit C (the checking algorithm becomes a circuit) that outputs true exactly when I is a Yes instance. So π ∝ₚ Circuit-SAT for all π ∈ NP.`},
  {sub:`Circuit-SAT ∝ₚ SAT`},
  {p:`Give every wire a variable, write each gate as a small formula "output = gate(inputs)", and AND them all with the output variable. Example: w = x ∧ ¬y becomes (¬w ∨ x) ∧ (¬w ∨ ¬y) ∧ (w ∨ ¬x ∨ y). The formula is satisfiable exactly when the circuit is. Every NP problem reduces to Circuit-SAT, which reduces to SAT, and SAT ∈ NP, so SAT is NP-complete.`}],
 [{sub:`3SAT`},
  {p:`3SAT is SAT with exactly 3 literals per clause, e.g. (x₁ ∨ ¬x₂ ∨ x₃) ∧ (x₁ ∨ ¬x₃ ∨ x₄) ∧ (x₂ ∨ ¬x₃ ∨ ¬x₄).`},
  {nt:`SAT ∝ₚ 3SAT`,b:`Given f = c₁ ∧ … ∧ cₘ, keep 3-literal clauses and rewrite the rest with new variables:`},
  {ul:[`Two literals: (x₁ ∨ x₂) → (x₁ ∨ x₂ ∨ z) ∧ (x₁ ∨ x₂ ∨ ¬z).`,`One literal: (x) → (x ∨ y ∨ z) ∧ (x ∨ y ∨ ¬z) ∧ (x ∨ ¬y ∨ z) ∧ (x ∨ ¬y ∨ ¬z).`,`More than three: (x₁ ∨ ... ∨ xₙ) → (x₁ ∨ x₂ ∨ z₁) ∧ (¬z₁ ∨ x₃ ∨ z₂) ∧ (¬z₂ ∨ x₄ ∨ z₃) ∧ ... ∧ (¬z_{n−3} ∨ xₙ₋₁ ∨ xₙ).`]},
  {p:`Why it works. In the short cases, the new variables appear both plain and negated, so the new clauses all hold exactly when the original clause does. In the long case, if some xᵢ is true, set the z’s before it true and those after it false: every piece holds. If all xᵢ are false, the first piece forces z₁ true, which forces z₂ true, and so on until the last piece fails. So the chain is satisfiable exactly when the clause is. 3SAT ∈ NP and SAT ∝ₚ 3SAT, so 3SAT is NP-complete.`}]]},

{sec:'np-complete',group:'NP-complete',id:'vc',title:`Vertex Cover (VC)`,tagline:`SAT ∝ₚ VC with variable edges and clause cliques.`,cols:[
 [{p:`VC: given an undirected graph G = (V, E) and k, is there a set C ⊆ V of size k with x ∈ C or y ∈ C for every edge (x, y)?`},
  {key:`VC is NP-complete.`},
  {nt:`VC ∈ NP`,b:`The witness is C. Check every edge has an end in C, in O(n²).`},
  {nt:`VC is NP-hard (SAT ∝ₚ VC)`,b:`From a CNF formula f with n variables and m clauses, build G:`},
  {ol:[`For each variable xᵢ, add vertices xᵢ and ¬xᵢ joined by an edge.`,`For each clause cⱼ, add a clique of |cⱼ| new vertices, one per literal.`,`Join each clause vertex to the variable vertex of the same literal.`]},
  {p:`Set k = n + Σ(|cⱼ| − 1). The construction is polynomial. For f = (x ∨ ¬y ∨ ¬z) ∧ (¬x ∨ y): n = 3 and k = 3 + (2 + 1) = 6. In 3SAT every clause gadget is a triangle, so k = n + 2m.`}],
 [{nt:`Correctness`,b:`Any cover needs one end of each variable edge (n vertices) and at least |cⱼ| − 1 vertices of each clause clique. So a cover of size exactly k takes one end per variable edge and all but one vertex per clique.`},
  {p:`(⇒) Put each variable’s true literal in the cover, and in each clique leave out one vertex with a true literal. Every edge is covered: the left-out vertex’s connecting edge ends at a true variable vertex, which is in the cover.`},
  {p:`(⇐) Given a cover of size k, call a literal true when its variable vertex is in the cover. In each clique, the left-out vertex’s connecting edge must be covered from the other end, so its literal is true and the clause is satisfied.`},
  {key:`f is satisfiable ⇔ G has a vertex cover of size k. With VC ∈ NP, VC is NP-complete.`},
  {w:'vcfig'}]]},

/* ===== Co-NP ===== */
{sec:'co-np',group:'Co-NP',id:'more-np',title:`More NP-Complete Problems`,tagline:`Beyond the reduction map, recognize these.`,cols:[
 [{table:{title:`Problems to recognize`,head:['Problem','What it asks'],th:false,rows:[
   [`3-SAT`,`Is a CNF formula with exactly three literals per clause satisfiable?`],
   [`3-Coloring`,`Can G be colored with three colors? A special case of Coloring. 2-Coloring is in P (2-colorable ⇔ no odd cycle).`],
   [`3D matching`,`Given disjoint sets X, Y, Z of size k and a set W of triples (x, y, z), is there a perfect matching: M ⊆ W of size k with no two triples agreeing in any coordinate? The 2D version is bipartite perfect matching, which is in P.`],
   [`Hamiltonian Path`,`Does G have a simple open path visiting every vertex exactly once?`]]}}],
 [{table:{title:`Covered later`,head:['Problem','What it asks'],th:false,rows:[
   [`Partition (later)`,`Can n integers be split into two subsets with equal sums?`],
   [`Knapsack (later)`,`Given n items with sizes and values, a capacity C and a number k, do some items have total size ≤ C and total value ≥ k? Dynamic programming takes Θ(nC): polynomial in the value of C but exponential in input size (C is only about log C bits). So this does not put Knapsack in P.`],
   [`Bin Packing (later)`,`Given n item sizes, a bin capacity C and a number k, do the items fit in at most k bins?`]]}}]]},

{sec:'co-np',group:'Co-NP',id:'complements',title:`Complements and Co-NP`,tagline:`In NP a Yes answer has a short witness. In Co-NP, a No answer does.`,cols:[
 [{p:`The complement Co-π of a decision problem π is the same question with the answer flipped: π is True exactly when Co-π is False. UNSAT asks whether f has no satisfying assignment. TAUTOLOGY asks whether f is true under every assignment, e.g. f = (x ∧ y) ∨ (¬x ∧ y) ∨ (x ∧ ¬y) ∨ (¬x ∧ ¬y), whose four terms cover every combination. Neither is known to be in NP: there is no known short witness. One assignment proves SAT is Yes, but proving no assignment works seems to need all 2ⁿ.`}],
 [{p:`Co-NP is the class of problems whose complements are in NP. UNSAT ∈ Co-NP because SAT ∈ NP. The complement of TSP (is there no tour of length ≤ k?) is also in Co-NP.`},
  {key:`NP: a Yes answer has a short witness. Co-NP: a No answer has a short witness. For UNSAT, a satisfying assignment is the short proof that the answer is No.`},
  {p:`π is Co-NP-complete if π ∈ Co-NP and every π′ ∈ Co-NP reduces to π in polynomial time.`}]]},

{sec:'co-np',group:'Co-NP',id:'conp-theorems',title:`Theorems`,tagline:`Four facts about NP, Co-NP and their complete problems.`,cols:[
 [{nt:`Complete problems and complements`,b:`π is NP-complete ⇔ its complement is Co-NP-complete: the same reductions work with answers flipped. SAT is NP-complete, so UNSAT is Co-NP-complete.`},
  {nt:`UNSAT and tautologies`,b:`f is unsatisfiable ⇔ ¬f is a tautology: if no assignment makes f true, every assignment makes ¬f true. So negating the formula reduces UNSAT to TAUT, and TAUT ∈ Co-NP, so TAUT is Co-NP-complete.`}],
 [{nt:`TAUT and the classes`,b:`TAUT ∈ P ⇔ Co-NP = P, and TAUT ∈ NP ⇔ Co-NP = NP. TAUT is Co-NP-complete, so an easy algorithm for it gives one for every Co-NP problem, by the same argument as the P = NP proof.`},
  {nt:`Both complete implies NP = Co-NP`,b:`If π and its complement π̄ are both NP-complete, then NP = Co-NP. Take any L ∈ NP and reduce it to π; the same reduction sends L̄ to π̄. π̄ ∈ NP, so L̄ ∈ NP and L ∈ Co-NP. So NP ⊆ Co-NP, and complementing gives the other direction.`}]]},

{sec:'co-np',group:'Co-NP',id:'npi',title:`NP-Intermediate and the Class Picture`,tagline:`What lives between P and NP-complete.`,cols:[
 [{sub:`NP-intermediate (NPI)`},
  {p:`NPI is the problems in NP that are neither in P nor NP-complete: π ∈ NP \\ (P ∪ NPC). The notes add that NPI is closed under complementation, so NPI = (NP ∩ Co-NP) \\ P: the part of the overlap outside P.`},
  {nt:`Worth checking with the professor`,b:`The ⊇ half is standard: if NP ≠ Co-NP, anything in NP ∩ Co-NP outside P is NP-intermediate. The ⊆ half needs "NPI is closed under complementation", which is not a known theorem: an NP-intermediate problem is not known to have its complement in NP. Safe exam version: every problem in NP ∩ Co-NP outside P is NP-intermediate.`},
  {sub:`Relationship between the classes`},
  {p:`P sits inside both NP and Co-NP. If NP ≠ Co-NP, NPC lies only in NP and Co-NPC only in Co-NP. The overlap NP ∩ Co-NP holds P plus NPI problems such as factoring.`},
  {nt:`From the professor's notes`,b:`Most researchers believe NP ≠ Co-NP, but it is unproven. The notes draw four candidate pictures of the classes; NP ≠ Co-NP rules out the two where NP and Co-NP coincide. The remaining two need one more fact: a problem in NP ∩ Co-NP outside P cannot be NP-complete unless NP = Co-NP, so under that belief it is NPI.`}],
 [{svg:'rel'}]]},
];

/* ---------- the six reductions (from the study guide) ---------- */
const GLOSSARY=[
 [`Decision problem`,`A question with a yes/no answer.`],
 [`Instance`,`One specific input to a problem.`],
 [`Witness (certificate)`,`A short, quickly checkable proof that the answer is Yes.`],
 [`P`,`The problems solvable in polynomial time by a deterministic algorithm.`],
 [`NP`,`The problems whose Yes answers have a witness checkable in polynomial time.`],
 [`Polynomial-time reduction, A ∝ₚ B`,`A polynomial-time conversion of any A instance into a B instance with the same answer. B is at least as hard as A.`],
 [`NP-hard`,`Every problem in NP reduces to it in polynomial time.`],
 [`NP-complete`,`In NP and NP-hard.`],
 [`Complement of a problem`,`The same question with the answer flipped.`],
 [`Vertex cover (VC)`,`A set of vertices touching every edge.`],
 [`Independent set (IS)`,`A set of vertices with no edge between any two of them.`],
 [`Clique`,`A set of vertices all joined to each other.`],
 [`Literal`,`A variable (x) or its negation (¬x).`],
 [`Clause`,`An OR of literals.`],
 [`CNF formula`,`An AND of clauses.`],
 [`SAT`,`Is there a true/false assignment making a CNF formula true?`],
 [`3SAT`,`SAT where every clause has exactly 3 literals.`],
 [`Circuit-SAT`,`Is there an input to a Boolean circuit (AND, OR, NOT gates) that makes its output 1?`],
 [`Tour`,`A cycle that visits every vertex exactly once, with a total weight.`],
 [`TSP`,`Given a weighted complete graph and k, is there a tour of weight ≤ k?`],
 [`Hamiltonian cycle (HC)`,`A cycle that visits every vertex exactly once, using edges of the graph.`],
 [`Gadget`,`A small group of clauses or vertices standing for one part of the original problem.`]];

const RED=[
{id:'red-circuit',viz:'circuit',tag:`Reduction 1`,name:`Circuit-SAT → SAT`,tagline:`One variable per wire, a few clauses per gate.`,
 from:`Circuit with AND, OR, NOT gates`,to:`CNF formula`,
 problem:[`Circuit-SAT asks whether some input makes the circuit output 1. SAT asks whether a CNF formula is satisfiable.`],
 construction:[`Give every wire a variable: each input, and each gate output w.`,`AND (w = a ∧ b): (¬w ∨ a), (¬w ∨ b), (w ∨ ¬a ∨ ¬b).`,`OR (w = a ∨ b): (¬a ∨ w), (¬b ∨ w), (¬w ∨ a ∨ b).`,`NOT (w = ¬a): (¬w ∨ ¬a), (w ∨ a).`,`Add the clause (out) to force the output true.`],
 k:[`None. SAT has no size threshold to carry across.`],
 inNP:[`The witness is an assignment. Check each clause in linear time.`],
 fwd:[`Take an input that makes the output 1, and set each wire variable to its wire’s value. Each gate’s clauses are equivalent to w = gate(a, b), so they hold. (out) holds since the output is 1.`],
 bwd:[`Take a satisfying assignment. The gate clauses force each w to its gate’s value on the inputs, and (out) forces the output to 1. So the input values solve Circuit-SAT.`],
 time:[`At most 3 clauses per gate: linear in circuit size.`],
 example:[`Circuit: w = a ∧ b, out = ¬w. Formula: (¬w ∨ a) ∧ (¬w ∨ b) ∧ (w ∨ ¬a ∨ ¬b) ∧ (¬out ∨ ¬w) ∧ (out ∨ w) ∧ (out). With a = b = 0: w = 0, out = 1, and every clause holds. The circuit outputs 1 on (0, 0).`]},

{id:'red-3sat',viz:'sat3',tag:`Reduction 2`,name:`SAT → 3SAT`,tagline:`Pad short clauses, chain long ones.`,
 from:`Any CNF formula`,to:`CNF with exactly 3 literals per clause`,
 problem:[`SAT takes any CNF formula. 3SAT takes a CNF formula with exactly 3 literals per clause.`],
 cintro:`Replace each clause c with the clauses below, using fresh variables for each c.`,
 construction:[`|c| = 3: keep it.`,`|c| = 2, c = (l1 ∨ l2): (l1 ∨ l2 ∨ z), (l1 ∨ l2 ∨ ¬z).`,`|c| = 1, c = (l): (l ∨ y ∨ z), (l ∨ y ∨ ¬z), (l ∨ ¬y ∨ z), (l ∨ ¬y ∨ ¬z).`,`|c| = n > 3, c = (l1 ∨ … ∨ ln): a chain with n − 3 new variables z1 … z(n−3): (l1 ∨ l2 ∨ z1), (¬z1 ∨ l3 ∨ z2), (¬z2 ∨ l4 ∨ z3), …, (¬z(n−3) ∨ l(n−1) ∨ ln).`],
 k:[`None.`],
 inNP:[`The witness is an assignment. Check each clause.`],
 fwd:[`Take a satisfying assignment of the original formula.`,`Cases 2 and 3: some literal of c is true, so every new clause holds whatever z, y are.`,`Case 4: let li be true. Set the z’s before li true and those after it false (z1 … z(i−2) true, the rest false, limited to the z’s that exist). The clause containing li holds, earlier clauses hold through their z, and later ones through their ¬z.`],
 bwd:[`Take a satisfying assignment of the new formula.`,`Cases 2 and 3: the new variables appear both plain and negated, so they cannot satisfy every new clause alone. So l1 ∨ l2 (or l) is true.`,`Case 4: suppose every li is false. The first clause forces z1 = true, the next z2 = true, and so on, until the last clause (¬z(n−3) ∨ l(n−1) ∨ ln) fails. So some li is true.`],
 time:[`Each clause becomes at most max(4, n − 2) clauses (exactly n − 2 when n > 3): linear in formula size.`],
 example:[`(x1 ∨ x2 ∨ x3 ∨ x4 ∨ x5) becomes (x1 ∨ x2 ∨ z1) ∧ (¬z1 ∨ x3 ∨ z2) ∧ (¬z2 ∨ x4 ∨ x5). With x3 true and the rest false: z1 = true, z2 = false, and all three clauses hold.`]},

{id:'red-hc',viz:'hc',tag:`Reduction 3`,name:`HC → TSP`,tagline:`Weight 1 for real edges, weight 2 for the rest, and k = |V|.`,
 from:`Graph G`,to:`Weighted complete graph G′ and k`,
 problem:[`HC asks whether G has a cycle through every vertex along its edges. TSP asks whether there is a tour of weight ≤ k.`],
 construction:[`Keep the vertex set V.`,`Build the complete graph G′ on V.`,`Weight an edge 1 if it is in G, and 2 if not.`,`Set k = |V|.`],
 k:[`A tour has exactly |V| edges, each of weight ≥ 1. So weight ≤ |V| means every edge weighs exactly 1.`,{nt:`Weight convention`,b:`The professor's lecture notes give non-edges weight n instead of 2. Either works for the same reason: with any weight above 1, a single non-edge pushes the tour past the threshold.`}],
 inNP:[`The witness is the tour. Check it visits every vertex once and sum the weights.`],
 fwd:[`A Hamiltonian cycle uses |V| edges of G, each of weight 1: a tour of weight |V| = k.`],
 bwd:[`A tour of weight ≤ |V| has |V| edges of weight ≥ 1, so all weigh exactly 1 and all are edges of G: a Hamiltonian cycle.`],
 time:[`O(|V|²) edges to weigh.`],
 example:[`G is the square 1–2–3–4–1. G′ weights those four edges 1 and the diagonals 1–3 and 2–4 weight 2. The tour 1-2-3-4-1 weighs 4 = k: Yes. Remove edge 4–1 from G and every tour uses a weight-2 edge, so weighs at least 5 > 4: No.`]},

{id:'red-clique',viz:'clique',tag:`Reduction 4`,name:`SAT → Clique`,tagline:`One vertex per literal occurrence, joined across clauses unless they clash.`,
 from:`CNF formula with clauses C1 … Cm`,to:`Graph G and k`,
 problem:[`SAT takes a CNF formula. Clique asks whether G has a clique of size k.`],
 cintro:`Let the formula have clauses C1 … Cm.`,
 construction:[`For each literal l in clause Ci, make a vertex (l, i).`,`Join (l, i) and (l′, j) exactly when i ≠ j and l′ ≠ ¬l.`],
 k:[`k = m. Same-clause vertices are not joined, so a clique has at most one vertex per clause. Size m means exactly one per clause.`],
 inNP:[`The witness is a set of k vertices. Check all pairs are adjacent.`],
 fwd:[`Take a satisfying assignment and pick one true literal per clause. They lie in different clauses, and no two are complementary since both are true. So all pairs are joined: a clique of size m.`],
 bwd:[`Take a clique of size m: one vertex per clause. Set each chosen literal true; this is consistent because no complementary pair is joined. Set other variables arbitrarily. Every clause has a true literal.`],
 time:[`At most L vertices (L = total literal count), so O(L²) pairs to test.`],
 example:[`(x ∨ y) ∧ (¬x ∨ y). Vertices: x1, y1, ¬x2, y2. Edges: x1–y2, y1–¬x2, y1–y2. The pair x1–¬x2 is missing because the literals are complementary. The clique {y1, y2} has size 2 = m, so y = true satisfies the formula.`]},

{id:'red-vcis',viz:'vcis',tag:`Reduction 5`,name:`VC ↔ IS`,tagline:`A set is independent exactly when everything else is a cover.`,
 from:`Graph G and a bound`,to:`The same graph G and a new bound`,
 problem:[`VC asks whether G has a vertex cover of size ≤ k. IS asks whether G has an independent set of size ≥ j.`],
 lemma:[`Lemma: S is independent ⇔ V − S is a vertex cover.`,`S is independent ⇔ no edge has both endpoints in S.`,`⇔ every edge has an endpoint outside S.`,`⇔ every edge is touched by V − S.`,`⇔ V − S is a vertex cover.`],
 construction:[`VC → IS: VC(G, k) becomes IS(G, |V| − k).`,`IS → VC: IS(G, j) becomes VC(G, |V| − j).`,`G is unchanged.`],
 k:[`The new bound is |V| − k: by the lemma, a cover of size ≤ k has a complement of size ≥ |V| − k.`],
 inNP:[`Both witnesses are vertex sets. VC: check every edge has an endpoint in the set. IS: check no edge joins two of its vertices. Both checks are polynomial.`],
 fwd:[`VC yes ⇒ IS yes: for a cover C with |C| ≤ k, V − C is independent by the lemma, with size ≥ |V| − k.`],
 bwd:[`IS yes ⇒ VC yes: for an independent S with |S| ≥ |V| − k, V − S is a cover by the lemma, with size ≤ k. The reverse reduction IS(G, j) → VC(G, |V| − j) uses the same lemma the same way.`],
 time:[`Only the number |V| − k is computed.`],
 example:[`Path a–b–c. The cover {b} has size 1; the independent set {a, c} has size 2 = |V| − 1. So VC(G, 1) and IS(G, 2) are both Yes. Both are No for k = 0 and j = 3.`]},

{id:'red-vc',viz:'vc',tag:`Reduction 6`,name:`SAT → VC`,tagline:`Variable edges, clause cliques, and connections that tie them together.`,
 from:`CNF formula with n variables and m clauses`,to:`Graph G and k`,
 problem:[`SAT takes a CNF formula with n variables and m clauses. VC asks whether G has a vertex cover of size ≤ k.`],
 construction:[`Variable edges: for each variable xi, join new vertices xi and ¬xi.`,`Clause cliques: for each clause c, make |c| vertices, one per literal occurrence, all joined to each other.`,`Connections: join each clause vertex to the variable vertex of its literal.`],
 k:[`k = n + Σ(|c| − 1); for 3SAT, n + 2m.`,`Each variable edge needs at least 1 vertex: n in total.`,`A clique of size s needs at least s − 1, since leaving out two vertices leaves their edge uncovered.`,`So every cover has size ≥ k, and a cover of size exactly k takes exactly these amounts. k is reached only when f is satisfiable; otherwise the smallest cover is strictly larger.`],
 inNP:[`The witness is the vertex set. Check its size and that every edge has an endpoint in it.`],
 fwd:[`Take a satisfying assignment.`,`Put the true literal vertex of each variable edge in the cover: n vertices.`,`In each clause, pick one true literal, leave its clause vertex out and put the other |c| − 1 in.`,`Check: clique edges are covered, since at most one vertex is out. The left-out vertex’s connection edge ends at a true literal vertex, which is in the cover. Every other connection edge has its clause end in the cover.`],
 bwd:[`Take a cover of size k.`,`It has exactly one vertex per variable edge and |c| − 1 per clique.`,`Set a literal true if its variable vertex is in the cover. This is consistent: only one of xi, ¬xi is chosen.`,`In each clique one vertex is out. Its connection edge must be covered from the other end, so that literal is true. Every clause has a true literal.`],
 time:[`2n + L vertices and O(L²) edges.`],
 example:[`(x ∨ y) ∧ (¬x ∨ ¬y): n = 2, k = 2 + 1 + 1 = 4. Take x = T, y = F. Cover: {x, ¬y, c1y, c2¬x}. Clause 1 leaves out c1x, whose connection edge is covered by x. Clause 2 leaves out c2¬y, covered by ¬y. All 8 edges are covered by 4 vertices.`]},
];

 inNP:[`The witness is an ordering of the vertices. Check that each vertex appears once and that every consecutive pair, including last → first, is an arc of D.`],

 bwd:[`Take a cover of size ≤ k. By the count above, it has exactly one of xi, ¬xi and exactly 2 vertices per triangle.`,`Set a literal true if its variable vertex is in the cover. This is consistent, since exactly one of xi, ¬xi is chosen.`,`In each triangle, one vertex cj,l is out. Its connection edge to l must be covered from the other end, so l is in the cover, meaning l is true. So every clause has a true literal.`],
 time:[`2n + 3m vertices and n + 3m + 3m = n + 6m edges, which is linear.`],
 example:[`(x ∨ y ∨ z) ∧ (¬x ∨ ¬y ∨ z). Here n = 3, m = 2, and k = 3 + 4 = 7. Take x = T, y = F, z = F, which satisfies both clauses.`,`Variable vertices: x, ¬y, ¬z. Clause 1: x is true, so leave c1,x out and take c1,y, c1,z. Clause 2: ¬y is true, so leave c2,¬y out and take c2,¬x, c2,z.`,`Cover = {x, ¬y, ¬z, c1,y, c1,z, c2,¬x, c2,z}, which has 7 vertices.`,`Check the left-out vertices: c1,x – x is covered by x, and c2,¬y – ¬y is covered by ¬y. All 15 edges (3 variable, 6 triangle, 6 connection) are covered.`]},

{id:'red-3col',viz:'col3',tag:`Reduction 9 · homework`,name:`3SAT → 3Color`,tagline:`Colors True, False and Base; an OR gadget per pair of literals.`,
 from:`3CNF formula, n variables, m clauses`,to:`Graph G (3 colors)`,

 construction:[`Palette triangle: make vertices T, F, B and join all three. They must get 3 different colors, so each color can be named after its vertex.`,`Variable gadgets: for each variable xi, make vertices xi and ¬xi. Join xi – ¬xi, xi – B, and ¬xi – B. So each literal is colored T or F, and xi and ¬xi get opposite colors.`,`OR gadget with inputs a, b and output r: make vertices p, q, r. Join p – a, q – b, and the triangle p – q – r.`,`Clause gadgets: for each clause (a ∨ b ∨ c), chain two OR gadgets: r1 = OR(a, b), then r2 = OR(r1, c). Join r2 to both F and B, which forces r2 = T.`],
 after:[{h:`OR gadget facts (inputs colored T or F)`},{ul:[`Both inputs F ⇒ output forced F. p and q are next to F, so they are in {T, B} and differ, so {p, q} = {T, B}. r is next to both, so r = F.`,`Some input T ⇒ output can be T. For a = T, b = F, use p = F, q = B, r = T. For a = F, b = T, use p = B, q = F, r = T. For a = T, b = T, use p = F, q = B, r = T.`]}],

 fwd:[`Take a satisfying assignment. Color the palette with T, F, B. Color each literal vertex T if it is true and F if it is false. The variable gadgets are valid.`,`In each clause (a ∨ b ∨ c): if a or b is true, color r1 = T, using the facts above. Then OR(r1 = T, c) can output r2 = T. If only c is true, then a = b = F, so r1 = F. Then OR(F, c = T) can output r2 = T.`,`r2 = T differs from F and B, so the coloring is valid.`],
 bwd:[`Take a valid 3-coloring and name the colors after the palette vertices.`,`Each literal vertex is next to B, so it is colored T or F. Also, xi and ¬xi differ. Set xi true if it is colored T. This is consistent.`,`Suppose some clause has a = b = c = F. Then r1 is forced to F, and so r2 = OR(F, F) is forced to F. But r2 is joined to F, which is a contradiction. So every clause has a true literal.`],
 time:[`3 + 2n + 6m vertices and 3 + 3n + 12m edges, which is linear.`],

{id:'red-cliqueis',viz:'cliqueis',tag:`Reduction 10 · homework`,name:`Clique → IS`,tagline:`Complement the graph: a clique in G is an independent set in Ḡ.`,

 idea:[`A clique and an independent set are opposites: one has every edge among its vertices, the other has none. Flipping every edge turns one into the other.`],
 construction:[`Keep the same vertex set V.`,`Build the complement Ḡ = (V, Ē): for every pair u ≠ v, join u and v in Ḡ exactly when they are not joined in G.`,`Keep the same k.`],

 note:[{nt:`The other direction`,b:`IS → Clique is the same construction, since complementing Ḡ gives back G. Combined with VC ↔ IS, this links Clique, IS and VC: each reduces to the others.`}]}];

/* ---------- SAT helpers (literals are strings: 'x' or '~x') ---------- */
const NEG=l=>l[0]==='~'?l.slice(1):'~'+l;
const VARN=l=>l[0]==='~'?l.slice(1):l;
const fl=l=>l[0]==='~'?'¬'+l.slice(1):l;
const fc=c=>'('+c.map(fl).join(' ∨ ')+')';
const uniq=a=>[...new Set(a)];
const varsOf=cnf=>uniq(cnf.flat().map(VARN));
const litT=(l,a)=>l[0]==='~'?!a[l.slice(1)]:!!a[l];
const clT=(c,a)=>c.some(l=>litT(l,a));
const showAssign=(vs,a)=>vs.map(v=>v+' = '+(a[v]?'T':'F')).join(', ');

function solveSat(cnf){
  const vs=varsOf(cnf);
  function dp(cl,as){
    let changed=true;
    while(changed){
      changed=false;const nc=[];
      for(const c of cl){
        let sat=false;const r=[];
        for(const l of c){const v=VARN(l);if(v in as){if(litT(l,as)){sat=true;break;}}else r.push(l);}
        if(sat)continue;if(!r.length)return null;nc.push(r);
      }
      cl=nc;
      const u=cl.find(c=>c.length===1);
      if(u){as={...as,[VARN(u[0])]:u[0][0]!=='~'};changed=true;}
    }
    if(!cl.length)return as;
    const v=VARN(cl[0][0]);
    for(const val of [true,false]){const r=dp(cl,{...as,[v]:val});if(r)return r;}
    return null;
  }
  const r=dp(cnf,{});
  if(!r)return null;
  const a={};vs.forEach(v=>{a[v]=v in r?r[v]:false;});return a;
}

function parseCNF(s,lim){
  const cls=s.replace(/[()]/g,' ').split(/&|∧|\band\b/i).map(t=>t.trim()).filter(Boolean);
  if(!cls.length)throw new Error('Type a formula such as (x | ~y) & (~x | z).');
  const cnf=cls.map(c=>{
    const ls=c.split(/\||∨|\bor\b/i).map(t=>t.trim()).filter(Boolean);
    if(!ls.length)throw new Error('A clause is empty.');
    return ls.map(l=>{
      const m=l.match(/^(~|¬|!)?\s*([A-Za-z][A-Za-z0-9_]*)$/);
      if(!m)throw new Error('Cannot read the literal "'+l+'". Use names like x or ~x.');
      return (m[1]?'~':'')+m[2];
    });
  });
  if(lim){
    if(cnf.length>lim.maxC)throw new Error('Use at most '+lim.maxC+' clauses here.');
    if(cnf.some(c=>c.length>lim.maxL))throw new Error('Use at most '+lim.maxL+' literals per clause here.');
    if(varsOf(cnf).length>lim.maxV)throw new Error('Use at most '+lim.maxV+' different variables here.');
  }
  return cnf;
}
const cnfText=cnf=>cnf.map(c=>'('+c.map(l=>l).join(' | ')+')').join(' & ');

/* ---------- graph helpers ---------- */
function parseEdges(s,maxN){
  const toks=s.split(/[,;\n]+/).map(t=>t.trim()).filter(Boolean);
  if(!toks.length)throw new Error('Type edges such as 1-2, 2-3, 3-1.');
  let V=[];const raw=[];
  toks.forEach(t=>{
    const m=t.match(/^([A-Za-z0-9]{1,3})\s*[-–]\s*([A-Za-z0-9]{1,3})$/);
    if(!m)throw new Error('Cannot read the edge "'+t+'". Use the form a-b.');
    if(m[1]===m[2])throw new Error('Self-loops are not allowed here.');
    [m[1],m[2]].forEach(x=>{if(!V.includes(x))V.push(x);});
    raw.push([m[1],m[2]]);
  });
  if(V.every(v=>/^\d+$/.test(v)))V.sort((a,b)=>a-b);
  if(V.length>maxN)throw new Error('Use at most '+maxN+' vertices here.');
  const E=[];
  raw.forEach(([a,b])=>{
    const i=V.indexOf(a),j=V.indexOf(b);
    if(!E.some(e=>(e[0]===i&&e[1]===j)||(e[0]===j&&e[1]===i)))E.push([Math.min(i,j),Math.max(i,j)]);
  });
  return {V,E};
}
const adjMat=(n,E)=>{const A=Array.from({length:n},()=>Array(n).fill(false));E.forEach(([a,b])=>{A[a][b]=A[b][a]=true;});return A;};
const popc=m=>{let c=0;while(m){c+=m&1;m>>=1;}return c;};
const maskList=(m,n)=>{const r=[];for(let i=0;i<n;i++)if(m>>i&1)r.push(i);return r;};
function minVC(n,E){
  const em=E.map(([a,b])=>(1<<a)|(1<<b));let best=(1<<n)-1,bs=n;
  for(let m=0;m<(1<<n);m++){const c=popc(m);if(c>=bs&&m!==best)continue;if(c<bs&&em.every(e=>m&e)){best=m;bs=c;}}
  return {mask:best,size:bs};
}
function maxClique(n,A){
  let best=0,bs=0;
  for(let m=1;m<(1<<n);m++){
    const c=popc(m);if(c<=bs)continue;
    const L=maskList(m,n);let ok=true;
    for(let a=0;a<L.length&&ok;a++)for(let b=a+1;b<L.length;b++)if(!A[L[a]][L[b]]){ok=false;break;}
    if(ok){best=m;bs=c;}
  }
  return {mask:best,size:bs};
}
function tspBest(n,w){
  let best=Infinity,bt=null;
  const rest=[];for(let i=1;i<n;i++)rest.push(i);
  (function perm(arr,k){
    if(k===arr.length){const t=[0,...arr,0];let s=0;for(let i=0;i<t.length-1;i++)s+=w(t[i],t[i+1]);if(s<best){best=s;bt=t.slice();}return;}
    for(let i=k;i<arr.length;i++){[arr[k],arr[i]]=[arr[i],arr[k]];perm(arr,k+1);[arr[k],arr[i]]=[arr[i],arr[k]];}
  })(rest,0);
  return {w:best,tour:bt};
}
const circ=(n,cx,cy,r)=>Array.from({length:n},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return {x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};});

/* ---------- SVG / HTML helpers ---------- */
